<style>
*{box-sizing:border-box} :root{--yellow:#FCD116;--border:#242424}

.barWrap{flex-shrink:0;background:#151515;border-top:1px solid var(--border);padding:10px}
.bar{display:flex;gap:6px;align-items:center}
.iconBtn{background:#1e1e1e;border:1px solid var(--border);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
input.msg{flex:1;background:#1e1e1e;border:1px solid var(--border);color:#fff;border-radius:24px;padding:12px;outline:none}
button.send{border:0;border-radius:50%;width:44px;height:44px;background:var(--yellow);font-weight:900;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#151515;border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box input,.box select,.box textarea{width:100%;background:#1e1e1e;border:1px solid var(--border);color:#fff;border-radius:12px;padding:12px;outline:none;margin-bottom:12px}
.btnRow{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:10px 16px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
.btnCancel{background:#1e1e1e;color:#fff;border:1px solid var(--border)}
.btnOk{background:var(--yellow);color:#000}
.picCircle{width:90px;height:90px;border-radius:50%;background:#222;border:3px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--yellow);overflow:hidden;cursor:pointer}
.picCircle img{width:100%;height:100%;object-fit:cover}
.userRow,.contactRow{display:flex;align-items:center;gap:10px;padding:12px;background:#1a1a1a;border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.statusView{position:relative;width:100%;max-width:380px;height:75vh;background:#000;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.statusViewTop{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
.statusProgress{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:6px}
.statusProgress div{height:3px;background:rgba(255,255,255,.3);flex:1;border-radius:2px}

.footer{flex-shrink:0;background:#000;border-top:1px solid #111;padding:8px;text-align:center;font-size:10px;color:#555}

<script>
const sb = supabase.createClient('https://gmdtjtznwsimcseurntt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A');
let userId=localStorage.getItem('chale_id')||'user_'+Math.random().toString(36).substr(2,9); localStorage.setItem('chale_id',userId);
let myName=localStorage.getItem('chale_name')||''; let myAvatar=localStorage.getItem('chale_avatar')||'';
let onlineUsers={}, statuses=[], seenStatus=JSON.parse(localStorage.getItem('seen_status')||'[]'), contacts=JSON.parse(localStorage.getItem('chale_contacts')||'[]'), currentStatusUser=null;
function compress(dataUrl,cb,max=600,q=0.75){ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>max||h>max){ if(w>h){ h*=max/w; w=max; } else { w*=max/h; h=max; } } c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',q)); }; img.src=dataUrl; }
function updateAvatarUI(){ const l=(myName||'S')[0].toUpperCase(); document.getElementById('picLetter').textContent=l; document.getElementById('profilePicLetter').textContent=l; document.getElementById('topAvatarLetter').textContent=l; if(myAvatar){ document.getElementById('picCircle').innerHTML=`<img src="${myAvatar}">`; document.getElementById('profilePicCircle').innerHTML=`<img src="${myAvatar}">`; document.getElementById('topAvatarLetter').innerHTML=`<img src="${myAvatar}">`; } }
window.setStatusBg=(bg,color)=>{ const ta=document.getElementById('statusTextInput'); ta.style.background=bg; ta.style.color=color; ta.dataset.bg=bg; ta.dataset.color=color; }
const chatEl=document.getElementById('chat'), inputEl=document.getElementById('i');
function fmt(d){try{return new Date(d).toLocaleTimeString()}catch{return''}}
function saveContacts(){ localStorage.setItem('chale_contacts',JSON.stringify(contacts)); }
function renderContacts(){ const list=document.getElementById('contactsList'); list.innerHTML=''; if(contacts.length===0){ list.innerHTML='<div style="color:#666;text-align:center;padding:20px">No contacts yet<br>📁 Import .vcf</div>'; return; } contacts.forEach(c=>{ const row=document.createElement('div'); row.className='contactRow'; row.innerHTML=`<div class="av" style="width:44px;height:44px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">${c.name[0].toUpperCase()}</div><div style="flex:1"><b>${c.name}</b><div style="font-size:11px;color:#888">${c.phone}</div></div><button onclick="deleteContact('${c.phone}')" style="background:#1e1e1e;border:1px solid #333;color:#fff;padding:4px 8px;border-radius:6px">🗑️</button>`; list.appendChild(row); }); }
window.deleteContact=(phone)=>{ contacts=contacts.filter(c=>c.phone!==phone); saveContacts(); renderContacts(); }
function parseVCF(text){ let added=0; const cards=text.split('BEGIN:VCARD'); cards.forEach(card=>{ let name='',phone=''; const lines=card.split(/\r\n|\n|\r/); lines.forEach(l=>{ if(l.startsWith('FN:')) name=l.replace('FN:','').trim(); if(l.startsWith('TEL')&&!phone){ const m=l.match(/TEL[^:]*:(.+)/); if(m) phone=m[1].trim(); } }); if(name&&phone){ phone=phone.replace(/[^0-9+]/g,''); if(!contacts.find(c=>c.phone===phone)){ contacts.push({name,phone,added:Date.now()}); added++; } } }); return added; }
async function loadMessages(){ const {data}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200); chatEl.innerHTML=''; data.forEach(m=>{ if(m.content.startsWith('[STATUS:')) return; const isMe=m.user_id===userId; const div=document.createElement('div'); div.className='m '+(isMe?'me':'other'); let content=m.content; if(content.startsWith('[IMG:')){ const src=content.match(/^\[IMG:(.*?)\]/)?.[1]; content=`<img style="max-width:150px;border-radius:12px" src="${src}">`; } div.innerHTML=`<div class="avatar">${(m.username[0]||'?').toUpperCase()}</div><div style="flex:1"><b style="font-size:11px;opacity:.6">${m.username}</b><div style="font-size:14px">${content}</div><span class="time">${fmt(m.created_at)}</span></div>`; chatEl.appendChild(div); }); chatEl.scrollTop=chatEl.scrollHeight; }
async function loadStatuses(){ const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(200); const now=Date.now(); statuses=(data||[]).filter(m=>m.content.startsWith('[STATUS:')).filter(m=>(now-new Date(m.created_at).getTime())<24*60*60*1000).map(m=>{ try{ const j=m.content.replace('[STATUS:','').slice(0,-1); const o=JSON.parse(j); return {id:m.id, username:m.username, user_id:m.user_id, created_at:m.created_at, ...o}; }catch{return null;} }).filter(Boolean); renderStatusBar(); }
function renderStatusBar(){ const bar=document.getElementById('statusBar'); const grouped={}; statuses.forEach(s=>{ if(!grouped[s.user_id]) grouped[s.user_id]=[]; grouped[s.user_id].push(s); }); bar.innerHTML=''; const addItem=document.createElement('div'); addItem.className='statusItem'; addItem.onclick=()=>document.getElementById('statusCreateModal').classList.add('show'); addItem.innerHTML=`<div class="statusRing addRing"><div class="statusAv">${myAvatar?`<img src="${myAvatar}">`: (myName[0]||'+').toUpperCase()}<div class="plusBadge">+</div></div></div><div class="statusName">Add Status</div>`; bar.appendChild(addItem); Object.keys(grouped).forEach(uid=>{ const g=grouped[uid]; const latest=g[0]; const isSeen=seenStatus.includes(latest.id); const it=document.createElement('div'); it.className='statusItem'; it.onclick=()=>viewStatus(uid,0); let icon=''; if(latest.type==='video') icon='🎬 '; else if(latest.type==='image') icon='🖼️ '; it.innerHTML=`<div class="statusRing ${isSeen?'seen':''}"><div class="statusAv">${latest.avatar?`<img src="${latest.avatar}">`: (latest.username[0]||'?').toUpperCase()}</div></div><div class="statusName">${icon}${latest.username}</div>`; bar.appendChild(it); }); }
function viewStatus(uidView,idx){ const group=statuses.filter(s=>s.user_id===uidView); if(!group.length) return; currentStatusUser=uidView; const s=group[idx]; document.getElementById('viewStatusName').textContent=s.username; document.getElementById('viewStatusTime').textContent=new Date(s.created_at).toLocaleString(); document.getElementById('viewStatusAv').innerHTML=s.avatar?`<img src="${s.avatar}">`: (s.username[0]||'?').toUpperCase(); const c=document.getElementById('viewStatusContent'); if(s.type==='text'){ c.innerHTML=`<div style="background:${s.bg||'#FCD116'};color:${s.color||'#000'};padding:30px;border-radius:20px;font-size:22px;font-weight:800;text-align:center">${s.text}</div>`; } else if(s.type==='image'){ c.innerHTML=`<div style="text-align:center"><img src="${s.image}" style="max-width:100%;max-height:60vh;border-radius:16px"><div style="margin-top:12px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px">${s.caption||''}</div></div>`; } else if(s.type==='video'){ c.innerHTML=`<div style="text-align:center;width:100%"><video src="${s.video}" controls autoplay playsinline style="width:100%;max-height:60vh;border-radius:16px"></video><div style="margin-top:12px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px">${s.caption||''}</div></div>`; } const prog=document.getElementById('statusProgress'); prog.innerHTML=''; group.forEach((_,i)=>{ const d=document.createElement('div'); d.className=i===idx?'active':''; prog.appendChild(d); }); if(!seenStatus.includes(s.id)){ seenStatus.push(s.id); localStorage.setItem('seen_status',JSON.stringify(seenStatus)); } document.getElementById('statusViewModal').classList.add('show'); if(s.type!=='video'){ setTimeout(()=>{ if(document.getElementById('statusViewModal').classList.contains('show')&&currentStatusUser===uidView){ if(idx+1<group.length) viewStatus(uidView,idx+1); else document.getElementById('statusViewModal').classList.remove('show'); } },6000); } }
loadMessages(); loadStatuses();
sb.channel('chale-v27').on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{ loadMessages(); loadStatuses(); }).subscribe();
const presenceChannel=sb.channel('presence-v27',{config:{presence:{key:userId}}});
presenceChannel.on('presence',{event:'sync'},()=>{ const state=presenceChannel.presenceState(); onlineUsers={}; let count=0; Object.values(state).forEach(ps=>{ ps.forEach(p=>{ onlineUsers[p.userId]=p; count++; }) }); document.getElementById('onlineNum').textContent=count; const listEl=document.getElementById('onlineList'); listEl.innerHTML=''; Object.values(onlineUsers).forEach(u=>{ const row=document.createElement('div'); row.className='userRow'; row.innerHTML=`<div class="av" style="width:44px;height:44px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">${(u.name[0]||'?').toUpperCase()}</div><div style="flex:1"><b>${u.name}</b><div style="font-size:11px;color:#00d26a">Online</div></div>`; listEl.appendChild(row); }); }).subscribe(async()=>{ if(myName){ await presenceChannel.track({userId, name:myName, avatar:myAvatar, online_at:new Date().toISOString()}); } });
// STATUS TABS - FIXED TO SHOW AREAS
document.getElementById('statusTextBtn').onclick=()=>{ document.getElementById('statusTextArea').style.display='block'; document.getElementById('statusImageArea').style.display='none'; document.getElementById('statusVideoArea').style.display='none'; document.getElementById('statusTextBtn').className='btn btnOk'; document.getElementById('statusImageBtn').className='btn btnCancel'; document.getElementById('statusVideoBtn').className='btn btnCancel'; };

document.getElementById('statusVideoBtn').onclick=()=>{ document.getElementById('statusTextArea').style.display='none'; document.getElementById('statusImageArea').style.display='none'; document.getElementById('statusVideoArea').style.display='block'; document.getElementById('statusTextBtn').className='btn btnCancel'; document.getElementById('statusImageBtn').className='btn btnCancel'; document.getElementById('statusVideoBtn').className='btn btnOk'; document.getElementById('statusVideoInput').click(); };
// IMAGE PREVIEW - GUARANTEED
document.getElementById('statusImageInput').onchange=(e)=>{

 console.log('Image picked:', f.name, f.size);
 const reader=new FileReader();
 reader.onload=()=>{

  console.log('Preview shown!');
 };
 reader.onerror=()=>{ alert('Failed to read image!'); };
 reader.readAsDataURL(f);
};
// VIDEO PREVIEW - GUARANTEED

 const f=e.target.files[0]; if(!f) return;
 if(f.size>20*1024*1024){ alert('Video too big! Max 20MB. Pick shorter video.'); return; }
 const reader=new FileReader();
 reader.onload=()=>{
  const video=document.getElementById('statusPreviewVideo');
  const preview=document.getElementById('statusVideoPreview');
  video.src=reader.result;
  video.dataset.raw=reader.result;
  preview.style.display='block';
  video.load();
  preview.scrollIntoView({behavior:'smooth'});
 };
 reader.readAsDataURL(f);
};
document.getElementById('cancelStatus').onclick=()=>{ document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusImagePreview').style.display='none'; document.getElementById('statusVideoPreview').style.display='none'; };
document.getElementById('postStatus').onclick=async()=>{
 let statusObj=null;
 if(document.getElementById('statusTextArea').style.display!=='none'){
  const text=document.getElementById('statusTextInput').value.trim(); if(!text){ alert('Type something!'); return; }
  const bg=document.getElementById('statusTextInput').dataset.bg||'#FCD116'; const color=document.getElementById('statusTextInput').dataset.color||'#000';
  statusObj={type:'text', text, bg, color, avatar:myAvatar};
 } else if(document.getElementById('statusImageArea').style.display!=='none'){
  const raw=document.getElementById('statusPreviewImg').dataset.raw; if(!raw){ alert('⚠️ Pick photo first! Tap the YELLOW button!'); return; }
  const btn=document.getElementById('postStatus'); btn.textContent='⏳ Posting...'; btn.disabled=true;
  compress(raw,(compressed)=>{
   const cap=document.getElementById('statusCaption').value.trim();
   const obj={type:'image', image:compressed, caption:cap, avatar:myAvatar};
   const content=`[STATUS:${JSON.stringify(obj)}]`;
   sb.from('messages').insert({username:myName,content,user_id:userId}).then(()=>{ document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusImagePreview').style.display='none'; document.getElementById('statusPreviewImg').dataset.raw=''; btn.textContent='✓ Post Status'; btn.disabled=false; loadStatuses(); alert('✅ Photo Status Posted!'); });
  },800,0.8); return;
 } else if(document.getElementById('statusVideoArea').style.display!=='none'){
  const raw=document.getElementById('statusPreviewVideo').dataset.raw; if(!raw){ alert('⚠️ Pick video first! Tap YELLOW button!'); return; }
  const cap=document.getElementById('statusVideoCaption').value.trim();
  statusObj={type:'video', video:raw, caption:cap, avatar:myAvatar};
 }
 if(statusObj){ const content=`[STATUS:${JSON.stringify(statusObj)}]`; await sb.from('messages').insert({username:myName,content,user_id:userId}); document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusVideoPreview').style.display='none'; loadStatuses(); alert('✅ Video Status Posted!'); }
};
// OTHER MODALS
function handleAvatarFile(file){ const reader=new FileReader(); reader.onloadend=()=>{ compress(reader.result,(c)=>{ myAvatar=c; localStorage.setItem('chale_avatar',c); updateAvatarUI(); },120,0.6); }; reader.readAsDataURL(file); }
document.getElementById('avatarInput').onchange=(e)=>{ const f=e.target.files[0]; if(f) handleAvatarFile(f); };
document.getElementById('avatarInput2').onchange=(e)=>{ const f=e.target.files[0]; if(f) handleAvatarFile(f); };
document.getElementById('profileBtn').onclick=()=>{ document.getElementById('profileNameInput').value=myName; updateAvatarUI(); document.getElementById('profileModal').classList.add('show'); };
document.getElementById('closeProfile').onclick=()=>document.getElementById('profileModal').classList.remove('show');
document.getElementById('saveProfile').onclick=async()=>{ const n=document.getElementById('profileNameInput').value.trim(); if(n){ myName=n; localStorage.setItem('chale_name',n); } document.getElementById('profileModal').classList.remove('show'); await presenceChannel.track({userId, name:myName, avatar:myAvatar}); updateAvatarUI(); loadMessages(); };
document.getElementById('contactsBtn').onclick=()=>{ renderContacts(); document.getElementById('contactsModal').classList.add('show'); };
document.getElementById('closeContacts').onclick=()=>document.getElementById('contactsModal').classList.remove('show');
document.getElementById('addContactBtn').onclick=()=>document.getElementById('addContactModal').classList.add('show');
document.getElementById('cancelAddContact').onclick=()=>document.getElementById('addContactModal').classList.remove('show');
document.getElementById('saveContact').onclick=()=>{ const name=document.getElementById('newContactName').value.trim(); const phone=document.getElementById('newContactPhone').value.trim(); if(!name||!phone){ alert('Enter name & phone'); return; } if(!contacts.find(c=>c.phone===phone)){ contacts.push({name,phone,added:Date.now()}); saveContacts(); renderContacts(); } document.getElementById('newContactName').value=''; document.getElementById('newContactPhone').value=''; document.getElementById('addContactModal').classList.remove('show'); };
document.getElementById('importFileBtn').onclick=()=>document.getElementById('contactsFileInput').click();
document.getElementById('contactsFileInput').onchange=(e)=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{ const text=reader.result; let added=parseVCF(text); saveContacts(); renderContacts(); alert(`✅ ${added} imported!`); }; reader.readAsText(file); e.target.value=''; };
document.getElementById('closeOnline').onclick=()=>document.getElementById('onlineModal').classList.remove('show');
document.getElementById('usersBtn').onclick=()=>document.getElementById('onlineModal').classList.add('show');
document.getElementById('b').onclick=async()=>{ let t=document.getElementById('i').value.trim(); if(!t) return; if(!myName){ document.getElementById('nameModal').classList.add('show'); return; } document.getElementById('i').value=''; await sb.from('messages').insert({username:myName,content:t,user_id:userId}); };
document.getElementById('i').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('b').click(); });
document.getElementById('okName').onclick=async()=>{ const n=document.getElementById('nameInput').value.trim(); if(!n){ alert('Enter name'); return; } myName=n; localStorage.setItem('chale_name',myName); document.getElementById('nameModal').classList.remove('show'); await presenceChannel.track({userId, name:myName, avatar:myAvatar}); updateAvatarUI(); loadMessages(); };
document.getElementById('cancelName').onclick=()=>{ if(!myName) return; document.getElementById('nameModal').classList.remove('show'); };
setTimeout(()=>{ if(!myName){ document.getElementById('nameModal').classList.add('show'); } updateAvatarUI(); renderContacts(); },800);
</script>
</body></html>
