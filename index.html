<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD700">
<title>CHALE CHAT V99 FORCE FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:white}
.header{background:#1a1a1a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.logoBox{width:42px;height:42px;border-radius:12px;background:#000;border:2.5px solid #FFD700;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.logoBox .gf{position:absolute;inset:0;display:flex;flex-direction:column}
.logoBox .gf div{flex:1}.logoBox .gf div:nth-child(1){background:#000}.logoBox .gf div:nth-child(2){background:#FFD700}.logoBox .gf div:nth-child(3){background:#006400}
.logoBox .ct{position:relative;z-index:2;font-weight:900;font-size:24px;color:#FFD700}
.logo{font-weight:bold}.logo span{color:#FFD700}
.badge{background:#FFD700;color:black;font-size:8px;padding:3px 8px;border-radius:8px;font-weight:bold}
.chatList{padding:10px;padding-bottom:130px}
.chat{background:#1e1e1e;padding:11px;border-radius:10px;margin-bottom:7px;display:flex;gap:10px;cursor:pointer}
.avatarMini{width:38px;height:38px;border-radius:12px;background:#111;border:2px solid #FFD700;display:flex;align-items:center;justify-content:center;font-weight:900;color:#FFD700;position:relative;overflow:hidden;flex-shrink:0}
.avatarMini .gf{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0.9}
.avatarMini .gf div{flex:1}.avatarMini .gf div:nth-child(1){background:#000}.avatarMini .gf div:nth-child(2){background:#FFD700}.avatarMini .gf div:nth-child(3){background:#006400}
.avatarMini span{position:relative;z-index:2}
.inputBar{position:fixed;left:0;width:100%;background:#111;padding:10px;display:flex;gap:7px;z-index:100;align-items:center;border-top:1px solid #222}
#quickBar{bottom:58px!important;background:#1a1a1a;padding:8px 10px!important;height:58px;z-index:900}
#quickBar input{padding:11px 14px!important;border-radius:20px;background:#222;border:none;color:white;outline:none;flex:1}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;z-index:9999;display:none;overflow-y:auto;padding-bottom:20px}
.overlay.show{display:block}
.overlayHeader{background:#1a1a1a;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
#chatWindow{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;z-index:9999;display:none;flex-direction:column}
#chatWindow.show{display:flex}
.chatWinHeader{background:#111;padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333}
.msgList{flex:1;padding:14px;padding-bottom:135px;background:#0f0f0f;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.msg{max-width:84%;padding:10px 12px;border-radius:14px;font-size:15px;word-wrap:break-word;background:#1e1e1e}
.msg.me{align-self:flex-end;background:#005c4b}
.msg.other{align-self:flex-start}
.msg .time{font-size:10px;color:#a0d9c8;display:flex;justify-content:flex-end;margin-top:4px}
.msg .cleanTrans{margin-top:6px;padding:6px 0;border-top:1px solid rgba(255,215,0,.25);font-size:13.5px;color:#FFD700;display:flex;gap:6px}
.set-item{background:#1e1e1e;padding:14px;margin:8px 16px;border-radius:12px;border-left:4px solid #FFD700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.set-item.greenItem{border:2px solid #25D366;background:#0a2210}
.switch{width:52px;height:30px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.switch.on{background:#FFD700}.switch.on.green{background:#25D366}
.switch::after{content:'';position:absolute;width:24px;height:24px;background:white;border-radius:50%;top:3px;left:3px;transition:.3s}
.switch.on::after{left:25px}
.micBtn{width:42px;height:42px;border-radius:50%;border:none;background:#25D366;color:white;cursor:pointer}
.bottomNav{position:fixed;bottom:0;left:0;width:100%;background:white;display:flex;justify-content:space-around;padding:5px 0 4px 0;z-index:5000;height:58px;border-top:1px solid #e0e0e0}
.bottomNav.hide{display:none!important}
.navItem{flex:1;text-align:center;cursor:pointer;color:#666}.navItem.active{color:#000}
.navItem .iconWrap{display:inline-block;padding:2px 16px;border-radius:16px}.navItem.active .iconWrap{background:#d4f8d4}
.navItem .icon{font-size:20px;display:block}.navItem .label{font-size:9.5px;display:block}
#updatesTab,#communitiesTab,#callsTab{position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:black;z-index:100;display:none;overflow-y:auto;padding-bottom:70px}
.commTop{padding:16px;background:white;display:flex;justify-content:space-between;align-items:center}
.lang-card{background:#1e1e1e;padding:14px;border-radius:11px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #444;cursor:pointer}
.lang-card.active{border-left:4px solid #FFD700;background:#2a2a0f}
#msgInput{padding:11px 14px;border-radius:20px;background:#222;border:none;color:white;outline:none;flex:1}
.privacy-card{background:#1e1e1e;padding:16px;border-radius:12px;margin:12px 16px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid #FFD700}
.saveBtn{width:calc(100% - 32px);margin:20px 16px 0 16px;background:#FFD700;color:black;border:none;padding:16px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.backBtn{background:#FFD700;color:black;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.inputField{width:100%;background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:10px;color:white;font-size:15px;outline:none;margin:8px 0}
</style>
</head>
<body>
<div id="chatsTab">
<div class="header"><div style="display:flex;align-items:center;gap:10px"><div class="logoBox"><div class="gf"><div></div><div></div><div></div></div><div class="ct">C</div></div><div class="logo">CHALE <span>CHAT</span> <span class="badge">V99 FIXED</span></div></div><button onclick="openSettings()" style="background:#FFD700;width:36px;height:36px;border-radius:50%;border:none">⚙️</button></div>
<div class="chatList" id="chatList"></div>
<div class="inputBar" id="quickBar"><input id="quickInput" placeholder="Type..."><button class="micBtn" onclick="quickSend()">➤</button></div>
</div>
<div id="updatesTab"><div class="commTop"><h1>Updates</h1><button class="backBtn" onclick="switchTab('chats')">←</button></div></div>
<div id="communitiesTab"><div class="commTop"><h1>Communities</h1><button class="backBtn" onclick="switchTab('chats')">←</button></div><div style="padding:0 16px"><div id="groupsList"></div></div></div>
<div id="callsTab"><div class="commTop"><h1>Calls</h1><button class="backBtn" onclick="switchTab('chats')">←</button></div></div>
<div class="bottomNav" id="bottomNav">
<div class="navItem active" id="navChats" onclick="switchTab('chats')"><span class="iconWrap"><span class="icon">💬</span></span><span class="label">Chats</span></div>
<div class="navItem" id="navUpdates" onclick="switchTab('updates')"><span class="iconWrap"><span class="icon">⭕</span></span><span class="label">Updates</span></div>
<div class="navItem" id="navCommunities" onclick="switchTab('communities')"><span class="iconWrap"><span class="icon">👥</span></span><span class="label">Communities</span></div>
<div class="navItem" id="navCalls" onclick="switchTab('calls')"><span class="iconWrap"><span class="icon">📞</span></span><span class="label">Calls</span></div>
</div>
<div id="chatWindow">
<div class="chatWinHeader"><button onclick="closeChat()" style="background:#222;border:none;width:36px;height:36px;border-radius:50%;color:white">←</button><div class="logoBox" style="width:36px;height:36px"><div class="gf"><div></div><div></div><div></div></div><div class="ct" style="font-size:18px">C</div></div><div style="flex:1"><b id="chatName">Ama</b><br><small id="autoStatus" style="color:#25D366">Pidgin • Auto ON • FIXED</small></div></div>
<div class="msgList" id="msgList"></div>
<div class="inputBar" style="position:relative;height:62px"><input id="msgInput" placeholder="Type... V99 FIXED!"><button class="micBtn" onclick="sendMsg()">➤</button></div>
</div>

<div id="settingsPage" class="overlay"><div class="overlayHeader"><button class="backBtn" onclick="closeSettings()">←</button><h2>V99 FORCE FIXED</h2></div><div style="padding:16px"><button onclick="forceClearCache()" style="width:100%;background:#ff4444;color:white;border:none;padding:16px;border-radius:12px;font-weight:bold;margin-bottom:12px">🗑️ FORCE CLEAR BAD TRANSLATIONS — TAP HERE!</button><div class="set-item" onclick="editProfile()"><div><b>Profile</b><br><small id="curName">Salvation</small></div><div>></div></div><div class="set-item greenItem" onclick="openLanguage()"><div><b>Language — FIXED</b><br><small id="curLang">Pidgin • Auto ON</small></div><div>></div></div></div></div>
<div id="profilePage" class="overlay"><div class="overlayHeader"><button class="backBtn" onclick="closeProfile()">← Back</button><h2>Profile</h2></div><div style="padding:16px"><input id="profileNameInput" class="inputField" value="Salvation"><button class="saveBtn" onclick="saveProfile()">Save</button></div></div>
<div id="languagePage" class="overlay"><div class="overlayHeader"><button class="backBtn" onclick="closeLanguage()">← Back</button><h2>Language — V99 FIXED</h2></div><div style="padding:0"><div style="background:#0a2210;border:2px solid #25D366;padding:14px;margin:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center"><div><b style="color:#25D366">🌍 Auto Translate FIXED</b><br><small style="color:#888">Cache cleared • No error!</small></div><div class="switch on green" id="autoSwitch" onclick="toggleAuto()"></div></div><div style="padding:0 16px" id="langsList"></div><button onclick="forceClearCache()" style="width:calc(100% - 32px);margin:16px;background:#ff4444;color:white;border:none;padding:14px;border-radius:10px;font-weight:bold">🗑️ CLEAR BAD CACHE NOW!</button></div><button class="saveBtn" onclick="closeLanguage()">Done ✅ Fixed!</button></div>

<script>
const langs={fr:{name:"Français",flag:"🇫🇷",pair:"en|fr"},en:{name:"English",flag:"🇬🇧",pair:"fr|en"},tw:{name:"Twi (Akan)",flag:"🇬🇭",pair:"en|tw"},ga:{name:"Ga",flag:"🇬🇭",pair:"en|gaa"},pidgin:{name:"Pidgin",flag:"🇬🇭",pair:"local",local:true}};
const dict={
"it been long":{fr:"Ça fait longtemps",en:"It been long",tw:"Ɛyɛ bere tenten bi a atwam.",ga:"Etsɛɛ tsɔ",pidgin:"E don tey"},
"it not that":{fr:"Ce n'est pas ça",en:"It not that",tw:"Ɛyi nyɛ",ga:"Jeɛ enɛ",pidgin:"No be that"},
"okyena":{fr:"D'accord",en:"Okay",tw:"Yoo",ga:"Okyena",pidgin:"Okay"},
"of course we want to get our name top there":{fr:"Bien sûr, on veut que notre nom soit en haut",en:"Of course we want to get our name top there",tw:"Ampa ara, yɛpɛ sɛ yɛn din kɔ soro",ga:"Lɛ mli akɛ wɔsumɔ ni wɔgbɛi ahi shi",pidgin:"Of course we wan make our name dey top"},
"hello":{tw:"Maakye",en:"Hello",fr:"Bonjour",ga:"Atuu?",pidgin:"How for do?"}
};
let currentLang=localStorage.getItem('chale_lang')||'pidgin';
let autoTranslate=localStorage.getItem('chale_auto')!=='false';
let privacy=JSON.parse(localStorage.getItem('chale_privacy')||'{"lastseen":true,"read":true}');
let cache=JSON.parse(localStorage.getItem('chale_api_cache')||'{}');
let chatsData=JSON.parse(localStorage.getItem('chale_chats_v79')||'{"Ama":[{"text":"It been long","time":"07:58 PM","me":false},{"text":"It not that","time":"07:59 PM","me":false},{"text":"Okyena","time":"08:17 PM","me":false},{"text":"Of course we want to get our name top there","time":"09:03:42 AM","me":false}]}');

// === V99 FORCE CLEAR BAD CACHE ===
(function forceClean(){
  let cleaned=false;
  for(let k in cache){
    let v=(cache[k]||"").toString().toUpperCase();
    if(v.includes("PLEASE SELECT TWO DISTINCT LANGUAGES")||v.includes("MYMEMORY WARNING")||v.includes("SELECT TWO DISTINCT")){
      delete cache[k];cleaned=true;
    }
  }
  // also fix specific bad key
  let badKey="of course we want to get our name top there_pidgin";
  if(cache[badKey] && cache[badKey].toUpperCase().includes("PLEASE SELECT")){
    cache[badKey]="Of course we wan make our name dey top";cleaned=true;
  }
  if(cleaned||Object.keys(cache).some(k=>k.includes("PLEASE"))){
    localStorage.setItem('chale_api_cache',JSON.stringify(cache));
    console.log("V99 cache cleaned!");
  }
})();

function forceClearCache(){
  cache={};
  // keep only good dict entries
  cache["it been long_pidgin"]="E don tey";
  cache["it not that_pidgin"]="No be that";
  cache["okyena_pidgin"]="Okay";
  cache["of course we want to get our name top there_pidgin"]="Of course we wan make our name dey top";
  localStorage.setItem('chale_api_cache',JSON.stringify(cache));
  alert("✅ Bad cache cleared! Now translation will show:\n\nOf course we wan make our name dey top\n\nReloading...");
  location.reload();
}

async function translateAPI(text,target){
  let k=text.toLowerCase().trim()+'_'+target;
  if(cache[k]){
    let v=cache[k].toString().toUpperCase();
    if(v.includes("PLEASE SELECT")||v.includes("MYMEMORY WARNING")){
      delete cache[k];
      localStorage.setItem('chale_api_cache',JSON.stringify(cache));
    }else{
      return cache[k];
    }
  }
  let low=text.toLowerCase().trim();
  let d=dict[low];
  if(d && d[target]){cache[k]=d[target];localStorage.setItem('chale_api_cache',JSON.stringify(cache));return d[target];}
  if(target==='pidgin'){
    let res=d?.pidgin;
    if(!res){
      if(low.includes("of course") && low.includes("name") && low.includes("top")) res="Of course we wan make our name dey top";
      else res=text;
    }
    cache[k]=res;localStorage.setItem('chale_api_cache',JSON.stringify(cache));return res;
  }
  try{
    let url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langs[target].pair}`;
    let r=await fetch(url);let j=await r.json();let tr=j.responseData?.translatedText||"";
    if(!tr||tr.toUpperCase().includes("PLEASE SELECT")||tr.toUpperCase().includes("MYMEMORY WARNING")||tr.toUpperCase().includes("SELECT TWO DISTINCT")){
      return d?.[target]||text;
    }
    cache[k]=tr;localStorage.setItem('chale_api_cache',JSON.stringify(cache));return tr;
  }catch{return d?.[target]||text;}
}

function toggleAuto(){autoTranslate=!autoTranslate;localStorage.setItem('chale_auto',autoTranslate);document.getElementById('autoSwitch').classList.toggle('on',autoTranslate);renderMsgs(currentChat);apply();}
function selectLang(code){currentLang=code;localStorage.setItem('chale_lang',code);apply();renderLangs();renderMsgs(currentChat);renderChatList();}
function apply(){let t=langs[currentLang];document.getElementById('curLang').innerText=`${t.flag} ${t.name} • Auto ${autoTranslate?'ON':'OFF'} • V99 FIXED`;document.getElementById('autoStatus').innerText=`${t.flag} ${t.name} • Auto ${autoTranslate?'ON':'OFF'} • FIXED`;}
function renderLangs(){let l=document.getElementById('langsList');l.innerHTML='';Object.keys(langs).forEach(c=>{let t=langs[c];let a=currentLang===c?' active':'';let div=document.createElement('div');div.className='lang-card'+a;div.onclick=()=>selectLang(c);div.innerHTML=`<div><b>${t.flag} ${t.name}</b><br><small>${t.local?'Local smart — No error!':'API'}</small></div><button style="background:${currentLang===c?'#25D366':'#333'};color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:bold">${currentLang===c?'✅':'TAP'}</button>`;l.appendChild(div);});}
function switchTab(t){document.getElementById('chatsTab').style.display=t==='chats'?'block':'none';document.getElementById('updatesTab').style.display=t==='updates'?'block':'none';document.getElementById('communitiesTab').style.display=t==='communities'?'block':'none';document.getElementById('callsTab').style.display=t==='calls'?'block':'none';document.querySelectorAll('.navItem').forEach(el=>el.classList.remove('active'));let el=document.getElementById('nav'+t.charAt(0).toUpperCase()+t.slice(1));if(el)el.classList.add('active');}
function renderChatList(){let l=document.getElementById('chatList');l.innerHTML='';Object.keys(chatsData).forEach(n=>{let last=chatsData[n].slice(-1)[0];l.innerHTML+=`<div class="chat" onclick="openChat('${n}')"><div class="avatarMini"><div class="gf"><div></div><div></div><div></div></div><span>C</span></div><div style="flex:1"><b>${n}</b><br><small style="color:gray">${last?last.text:''}</small></div></div>`;});}
async function renderMsgs(n){let b=document.getElementById('msgList');b.innerHTML='';for(let m of (chatsData[n]||[])){let row=document.createElement('div');row.className=m.me?'msg me':'msg other';row.innerHTML=`<div>${m.text}</div><div class="time">${m.time||''} ✓✓ ${langs[currentLang].flag}</div>`;b.appendChild(row);if(autoTranslate){let trDiv=document.createElement('div');trDiv.className='cleanTrans';trDiv.style.color='#888';trDiv.innerText='⏳ Translating...';row.appendChild(trDiv);let tr=await translateAPI(m.text,currentLang);trDiv.style.color='#FFD700';trDiv.innerHTML=`<span>🇬🇭</span><span>➡️ ${tr}</span>`;}}b.scrollTop=b.scrollHeight;}
function openChat(n){currentChat=n;document.getElementById('bottomNav').classList.add('hide');document.getElementById('quickBar').style.display='none';document.getElementById('chatWindow').classList.add('show');document.getElementById('chatWindow').style.display='flex';document.getElementById('chatName').innerText=n;renderMsgs(n);}
function closeChat(){document.getElementById('chatWindow').classList.remove('show');document.getElementById('chatWindow').style.display='none';document.getElementById('bottomNav').classList.remove('hide');document.getElementById('quickBar').style.display='flex';}
function sendMsg(){let i=document.getElementById('msgInput');let t=i.value.trim();if(!t)return;if(!chatsData[currentChat])chatsData[currentChat]=[];chatsData[currentChat].push({text:t,time:new Date().toLocaleTimeString(),me:true});localStorage.setItem('chale_chats_v79',JSON.stringify(chatsData));i.value='';renderMsgs(currentChat);renderChatList();}
function quickSend(){let q=document.getElementById('quickInput');if(q.value.trim()){document.getElementById('msgInput').value=q.value;openChat(currentChat);sendMsg();q.value='';}}
function openSettings(){document.getElementById('bottomNav').classList.add('hide');document.getElementById('quickBar').style.display='none';document.getElementById('settingsPage').classList.add('show');document.getElementById('settingsPage').style.display='block';}
function closeSettings(){document.getElementById('settingsPage').classList.remove('show');document.getElementById('settingsPage').style.display='none';document.getElementById('bottomNav').classList.remove('hide');document.getElementById('quickBar').style.display='flex';}
function editProfile(){document.getElementById('settingsPage').style.display='none';document.getElementById('profilePage').classList.add('show');document.getElementById('profilePage').style.display='block';}
function closeProfile(){document.getElementById('profilePage').classList.remove('show');document.getElementById('profilePage').style.display='none';document.getElementById('settingsPage').style.display='block';}
function saveProfile(){let n=document.getElementById('profileNameInput').value.trim();localStorage.setItem('chale_name',n);document.getElementById('curName').innerText=n;closeProfile();}
function openLanguage(){document.getElementById('settingsPage').style.display='none';document.getElementById('languagePage').classList.add('show');document.getElementById('languagePage').style.display='block';renderLangs();document.getElementById('autoSwitch').classList.toggle('on',autoTranslate);}
function closeLanguage(){document.getElementById('languagePage').classList.remove('show');document.getElementById('languagePage').style.display='none';document.getElementById('settingsPage').style.display='block';}
window.onload=()=>{let n=localStorage.getItem('chale_name');if(n)document.getElementById('curName').innerText=n;apply();renderChatList();renderLangs();openChat(currentChat);}
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   </html>
