<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CHALECHAT LIVE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f0f0f;color:#fff;height:100dvh;display:flex;flex-direction:column}.header{background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F);padding:12px;display:flex;justify-content:space-between;align-items:center}.rooms-bar{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#151515}.room-pill{padding:8px 14px;border-radius:20px;background:#222;border:1px solid #333;cursor:pointer;white-space:nowrap}.room-pill.active{background:#FCD116;color:#000;font-weight:700}.lang-bar{display:flex;gap:8px;padding:8px;background:#101010}.lang{padding:6px 12px;border-radius:20px;border:1px solid #333;background:#1a1a1a;cursor:pointer}.lang.active{border-color:#FCD116;color:#FCD116}#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px;background:#0a0a0a}.msg{max-width:80%;padding:10px 12px;border-radius:18px;font-size:14px}.msg.me{align-self:flex-end;background:#FCD116;color:#000}.msg.other{align-self:flex-start;background:#222}.input-bar{display:flex;gap:6px;padding:10px;background:#151515;border-top:1px solid #222}.icon-btn{width:38px;height:38px;border-radius:50%;background:#222;border:none;color:#aaa;cursor:pointer}.input-wrap{flex:1;background:#222;border-radius:24px;padding:0 14px;display:flex}.input-wrap input{flex:1;background:transparent;border:none;color:#fff;padding:12px 0;outline:none}.send{width:44px;height:44px;border-radius:50%;background:#FCD116;border:none;font-size:20px;cursor:pointer}</style></head><body><div class="header"><b>CHALECHAT 🇬🇭</b><span id="status">Connecting...</span></div><div class="rooms-bar"><div class="room-pill active" data-room="Accra"># Accra 🌃</div><div class="room-pill" data-room="Twi"># Twi 🗣️</div><div class="room-pill" data-room="Music"># Music 🎵</div><div class="room-pill" data-room="Kumasi"># Kumasi</div><div class="room-pill" id="addRoomBtn">+ New</div></div><div class="lang-bar"><div class="lang active">🇬🇧 EN</div><div class="lang">🇬🇭 Twi</div><div class="lang">Pidgin</div></div><div id="chat"></div><div class="input-bar"><button class="icon-btn" id="photoBtn">📷</button><button class="icon-btn" id="micBtn">🎤</button><div class="input-wrap"><input id="msgInput" placeholder="Type in #Accra..."></div><button class="send" id="sendBtn">➤</button></div><input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*"/><script>
const SUPABASE_URL="https://gmdtjtznwsimcseurntt.supabase.co";const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);let currentRoom="Accra";let username=localStorage.getItem("chale_name")||"";if(!username){username=prompt("Enter chat name? e.g. Kofi")||"User"+Math.floor(Math.random()*999);localStorage.setItem("chale_name",username);}const chatEl=document.getElementById("chat"),input=document.getElementById("msgInput"),statusEl=document.getElementById("status");async function loadMessages(){const {data}=await supabase.from("messages").select("*").eq("room",currentRoom).order("created_at",{ascending:true}).limit(200);render(data||[]);}function render(list){chatEl.innerHTML="";list.forEach(m=>{const div=document.createElement("div");div.className="msg "+(m.username===username?"me":"other");let body=m.type==="image"?`<img src="${m.content}" style="max-width:180px;border-radius:12px">`:m.type==="video"?`<video src="${m.content}" controls style="max-width:200px;border-radius:12px"></video>`:m.type==="audio"?`<audio src="${m.content}" controls></audio>`:m.content.replace(/</g,"&lt;");div.innerHTML=`<b>${m.username}</b><br>${body}<br><small style="font-size:10px;opacity:.6">${new Date(m.created_at).toLocaleTimeString()}</small>`;chatEl.appendChild(div);});chatEl.scrollTop=chatEl.scrollHeight;statusEl.textContent=`Live • ${list.length} msgs • ${username}`;}function subscribe(){supabase.removeAllChannels();supabase.channel("room-"+currentRoom).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`room=eq.${currentRoom}`},()=>loadMessages()).subscribe();}document.querySelectorAll(".room-pill").forEach(el=>{el.addEventListener("click",()=>{if(el.id==="addRoomBtn"){const name=prompt("New room?");if(!name)return;const pill=document.createElement("div");pill.className="room-pill";pill.dataset.room=name;pill.textContent="# "+name;pill.onclick=()=>switchRoom(name,pill);document.querySelector(".rooms-bar").insertBefore(pill,el);switchRoom(name,pill);return;}switchRoom(el.dataset.room,el);});});function switchRoom(name,el){currentRoom=name;document.querySelectorAll(".room-pill").forEach(p=>p.classList.remove("active"));if(el)el.classList.add("active");input.placeholder=`Type in #${name}...`;loadMessages();subscribe();}async function send(){const text=input.value.trim();if(!text)return;input.value="";await supabase.from("messages").insert({room:currentRoom,username,content:text,type:"text"});}document.getElementById("sendBtn").onclick=send;input.addEventListener("keydown",e=>{if(e.key==="Enter")send();});const fileInput=document.getElementById("fileInput");document.getElementById("photoBtn").onclick=()=>fileInput.click();fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{const type=file.type.startsWith("image")?"image":file.type.startsWith("video")?"video":"audio";await supabase.from("messages").insert({room:currentRoom,username,content:reader.result,type});};reader.readAsDataURL(file);};let rec,chunks=[];document.getElementById("micBtn").onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();document.getElementById("micBtn").textContent="🎤";return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{const blob=new Blob(chunks,{type:"audio/webm"});const r=new FileReader();r.onload=async()=>{await supabase.from("messages").insert({room:currentRoom,username,content:r.result,type:"audio"});};r.readAsDataURL(blob);};rec.start();document.getElementById("micBtn").textContent="⏹️";setTimeout(()=>{if(rec&&rec.state==="recording")rec.stop();document.getElementById("micBtn").textContent="🎤";},15000);}catch(e){alert("Mic permission needed");}};loadMessages();subscribe();
</script></body></html>
