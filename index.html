<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHALECHAT EDIT REPLY 🇬🇭</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f1115;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(90deg,#ce1126,#ffcc00,#006b3f);padding:12px 16px;display:flex;justify-content:space-between;font-weight:900}
.tabs{display:flex;gap:8px;padding:10px;background:#1a1d25;overflow:auto}
.tab{padding:8px 14px;border-radius:20px;border:none;cursor:pointer;background:#2a2e3a;color:#ccc;white-space:nowrap}
.tab.active{background:#ffcc00;color:#000;font-weight:700}
.chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{background:#1e2a1e;border-radius:18px;padding:12px 14px;max-width:88%;align-self:flex-start;border:1px solid rgba(255,255,255,.1);position:relative}
.msg.me{align-self:flex-end;background:#2a3a2a;border:1px solid #ffcc00}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(to bottom,#ce1126 33%,#ffcc00 33%,#ffcc00 66%,#006b3f 66%);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:12px;border:2px solid #fff}
.replyQuote{background:rgba(255,204,0,.15);border-left:3px solid #ffcc00;padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px;opacity:.8}
.inputBar{display:flex;gap:8px;padding:12px;background:#1a1d25;align-items:center;position:sticky;bottom:0}
.inputBar input{flex:1;padding:14px;border-radius:24px;border:none;background:#2a2e3a;color:#fff;outline:none}
.btnMic{width:48px;height:48px;border-radius:50%;border:none;background:#2a2e3a;font-size:20px;cursor:pointer}
.btnSend{width:56px;height:48px;border-radius:50%;border:none;background:#ffcc00;font-weight:900;cursor:pointer}
#authBox{position:fixed;inset:0;background:#0f1115;display:flex;align-items:center;justify-content:center;z-index:99}
.authCard{background:#1a1d25;padding:24px;border-radius:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.authCard input{padding:12px;border-radius:10px;border:none;background:#2a2e3a;color:#fff}
.btnYellow{padding:12px;border-radius:10px;border:none;background:#ffcc00;font-weight:700;cursor:pointer}
.btnGhost{padding:12px;border-radius:10px;background:transparent;border:1px solid #444;color:#fff;cursor:pointer}
#recStatus{display:none;text-align:center;padding:8px;background:#ce1126;color:#fff;font-size:13px}
.trans{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);color:#8fdb8f;font-size:13px}
.actBtns{display:flex;gap:6px;margin-top:8px}
.smallBtn{background:#2a2e3a;color:#fff;border:none;padding:4px 8px;border-radius:8px;font-size:11px;cursor:pointer}
.smallBtn.del{background:#ce1126}
#replyPreview{display:none;background:#1a1d25;border-left:4px solid #ffcc00;padding:8px 12px;margin:0 12px;border-radius:8px;align-items:center;justify-content:space-between}
#editModal,#niceModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(6px)}
#editModal.show,#niceModal.show{display:flex}
.modalBox{background:#1e212b;border:1px solid rgba(255,204,0,.3);border-radius:24px;padding:24px;width:90%;max-width:340px;text-align:center;animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modalIcon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ce1126,#ffcc00);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
.modalTitle{font-weight:900;font-size:18px;margin-bottom:8px}
.modalSub{opacity:.7;font-size:13px;margin-bottom:16px}
.modalBtns{display:flex;gap:10px}
.mBtn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.mCancel{background:#2a2e3a;color:#fff}
.mDelete{background:#ce1126;color:#fff}
.mSave{background:#ffcc00;color:#000}
.modalInput{width:100%;padding:12px;border-radius:12px;border:none;background:#2a2e3a;color:#fff;margin-bottom:16px;outline:none}
</style>
</head>
<body>
<div class="header"><div>CHALECHAT 🌍 EDIT+REPLY</div><div>GHANA #1</div></div>
<div class="tabs">
<button class="tab active" data-lang="en">🇬🇧 EN</button>
<button class="tab" data-lang="tw">🇬🇭 Twi</button>
<button class="tab" data-lang="pcm">🇳🇬 Pidgin</button>
<button class="tab" data-lang="fr">🇫🇷 FR</button>
</div>
<div id="recStatus">🔴 Recording...</div>
<div id="chat" class="chat"></div>

<div id="replyPreview">
<div><div style="font-size:11px;color:#ffcc00;font-weight:700" id="replyName">Replying to</div><div style="font-size:12px;opacity:.8" id="replyText"></div></div>
<button onclick="cancelReply()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">✕</button>
</div>

<div class="inputBar">
<button id="micBtn" class="btnMic">🎤</button>
<input id="msgInput" placeholder="Type or hold mic...">
<button id="sendBtn" class="btnSend">➤</button>
</div>

<div id="authBox"><div class="authCard">
<h2>CHALECHAT 🇬🇭</h2>
<input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button class="btnYellow" id="signupBtn">Create Account 🔥</button><button class="btnGhost" id="loginBtn">Login</button><p id="err" style="color:#ff6b6b;font-size:12px"></p>
</div></div>

<div id="niceModal"><div class="modalBox"><div class="modalIcon">🗑️</div><div class="modalTitle">Delete this?</div><div class="modalSub">This go delete forever. You sure? 🇬🇭</div><div class="modalBtns"><button class="mBtn mCancel" onclick="closeModal()">Cancel</button><button class="mBtn mDelete" id="confirmDelBtn">Delete 🔥</button></div></div></div>

<div id="editModal"><div class="modalBox"><div class="modalIcon" style="background:linear-gradient(135deg,#ffcc00,#006b3f)">✏️</div><div class="modalTitle">Edit message</div><input id="editInput" class="modalInput" placeholder="Edit your message..."><div class="modalBtns"><button class="mBtn mCancel" onclick="closeEdit()">Cancel</button><button class="mBtn mSave" id="confirmEditBtn">Save ✅</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyB0s8MwwApN2Y3nbuD9z3sujFYLUyrIB14",authDomain:"chalechat-aa1b8.firebaseapp.com",projectId:"chalechat-aa1b8",storageBucket:"chalechat-aa1b8.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();const db=firebase.firestore();
async function translate(t,lg){return t;}
let currentLang="en";let currentUser=null;let pendingDeleteId=null;let pendingEditId=null;let replyTo=null;
document.querySelectorAll(".tab").forEach(b=>{b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentLang=b.dataset.lang;load();};});
auth.onAuthStateChanged(u=>{if(u){currentUser=u;document.getElementById("authBox").style.display="none";load();}else{document.getElementById("authBox").style.display="flex";}});
document.getElementById("signupBtn").onclick=async()=>{try{await auth.createUserWithEmailAndPassword(email.value,password.value);}catch(e){err.textContent=e.message;}};
document.getElementById("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword(email.value,password.value);}catch(e){err.textContent=e.message;}};

// VOICE
let mediaRecorder,audioChunks=[],isRecording=false;
const micBtn=document.getElementById("micBtn");const recStatus=document.getElementById("recStatus");
micBtn.onclick=async()=>{
if(!isRecording){
try{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);audioChunks=[];
mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
mediaRecorder.onstop=async()=>{
let blob=new Blob(audioChunks,{type:"audio/webm"});
let reader=new FileReader();
reader.onloadend=async()=>{let base64=reader.result;let payload={text:"🎤 Voice note",audio:base64,displayName:currentUser.email.split("@")[0],uid:currentUser.uid,timestamp:firebase.firestore.FieldValue.serverTimestamp()};if(replyTo){payload.replyToName=replyTo.name;payload.replyToText=replyTo.text;cancelReply();}await db.collection("messages").add(payload);};
reader.readAsDataURL(blob);
};
mediaRecorder.start();isRecording=true;micBtn.textContent="⏹️";micBtn.style.background="#ce1126";recStatus.style.display="block";
}catch(e){alert("Allow mic");}
}else{mediaRecorder.stop();isRecording=false;micBtn.textContent="🎤";micBtn.style.background="#2a2e3a";recStatus.style.display="none";}
};

// MODALS
const niceModal=document.getElementById("niceModal");const editModal=document.getElementById("editModal");
function closeModal(){niceModal.classList.remove("show");pendingDeleteId=null;}
function closeEdit(){editModal.classList.remove("show");pendingEditId=null;}
window.closeModal=closeModal;window.closeEdit=closeEdit;
document.getElementById("confirmDelBtn").onclick=async()=>{if(pendingDeleteId){await db.collection("messages").doc(pendingDeleteId).delete();closeModal();}};
document.getElementById("confirmEditBtn").onclick=async()=>{let nt=document.getElementById("editInput").value.trim();if(nt&&pendingEditId){await db.collection("messages").doc(pendingEditId).update({text:nt+" (edited)"});closeEdit();}};
niceModal.onclick=e=>{if(e.target===niceModal)closeModal();};editModal.onclick=e=>{if(e.target===editModal)closeEdit();};
function deleteMsg(id){pendingDeleteId=id;niceModal.classList.add("show");}
function editMsg(id,oldText){pendingEditId=id;document.getElementById("editInput").value=oldText.replace(" (edited)","");editModal.classList.add("show");}
window.deleteMsg=deleteMsg;window.editMsg=editMsg;

// REPLY
function startReply(name,text){replyTo={name,text};document.getElementById("replyName").textContent="Replying to "+name;document.getElementById("replyText").textContent=text.substring(0,40);document.getElementById("replyPreview").style.display="flex";document.getElementById("msgInput").focus();}
function cancelReply(){replyTo=null;document.getElementById("replyPreview").style.display="none";}
window.startReply=startReply;window.cancelReply=cancelReply;

let unsub=null;
function load(){
if(unsub)unsub();
unsub=db.collection("messages").orderBy("timestamp","asc").limit(100).onSnapshot(snap=>{
let chat=document.getElementById("chat");chat.innerHTML="";
snap.docs.forEach(doc=>{
let d=doc.data();
let audioHtml=d.audio?`<audio controls src="${d.audio}" style="width:100%;margin-top:8px"></audio>`:"";
let replyHtml=d.replyToText?`<div class="replyQuote"><b>${d.replyToName}</b><br>${d.replyToText}</div>`:"";
let isMe=d.uid===currentUser?.uid;
let delBtn=isMe?`<button class="smallBtn del" onclick="deleteMsg('${doc.id}')">🗑️</button><button class="smallBtn" onclick="editMsg('${doc.id}','${d.text.replace(/'/g,"\\'")}')">✏️ Edit</button>`:"";
let repBtn=`<button class="smallBtn" onclick="startReply('${(d.displayName||'').replace(/'/g,"\\'")}','${d.text.replace(/'/g,"\\'")}')">↩️ Reply</button>`;
let div=document.createElement("div");div.className="msg"+(isMe?" me":"");let initial=(d.displayName||"U")[0].toUpperCase();
div.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div class="avatar">${initial}</div><div style="font-size:11px;opacity:.7">${d.displayName} • 🇬🇭</div></div>${replyHtml}<div>${d.text}</div>${audioHtml}<div class="actBtns">${repBtn}${delBtn}</div>`;
chat.appendChild(div);
});
chat.scrollTop=chat.scrollHeight;
});
}
document.getElementById("sendBtn").onclick=async()=>{
let t=document.getElementById("msgInput").value.trim();if(!t||!currentUser)return;document.getElementById("msgInput").value="";
let payload={text:t,displayName:currentUser.email.split("@")[0],uid:currentUser.uid,timestamp:firebase.firestore.FieldValue.serverTimestamp()};
if(replyTo){payload.replyToName=replyTo.name;payload.replyToText=replyTo.text;cancelReply();}
await db.collection("messages").add(payload);
};
document.getElementById("msgInput").onkeydown=e=>{if(e.key==="Enter")document.getElementById("sendBtn").click();};
</script>
</body>
</html>
