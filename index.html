<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChaleChat V28 - Photo Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box} :root{--yellow:#FCD116;--border:#242424}
body{margin:0;background:#000;color:#fff;font-family:'Inter',system-ui;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{height:56px;padding:0 8px;background:#151515;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900} .brand span{color:var(--yellow)}
.iconTop{width:36px;height:36px;border-radius:50%;background:#1e1e1e;border:1px solid var(--border);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconTop.contactsBtn{background:var(--yellow);color:#000;font-weight:900}
#statusBar{display:flex;gap:14px;padding:12px;background:#0f0f0f;overflow-x:auto;flex-shrink:0}
.statusItem{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:62px;cursor:pointer}
.statusRing{width:60px;height:60px;border-radius:50%;padding:3px;background:conic-gradient(#FCD116,#CE1126,#00d26a,#FCD116);display:flex;align-items:center;justify-content:center;position:relative}
.statusRing.addRing{background:#222;border:2px dashed #FCD116}
.statusAv{width:54px;height:54px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;border:2px solid #000}
.plusBadge{position:absolute;bottom:-2px;right:-2px;background:var(--yellow);color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #000}
#chat{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:12px}
.m{max-width:80%;padding:8px 12px 20px;border-radius:18px;position:relative;display:flex;gap:8px}
.me{align-self:flex-end;background:var(--yellow);color:#000}
.other{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
.avatar{width:32px;height:32px;border-radius:50%;background:#111;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0}
.time{position:absolute;bottom:3px;right:10px;font-size:9px;opacity:.5}
.barWrap{flex-shrink:0;background:#151515;border-top:1px solid var(--border);padding:10px}
.bar{display:flex;gap:6px;align-items:center}
input.msg{flex:1;background:#1e1e1e;border:1px solid var(--border);color:#fff;border-radius:24px;padding:12px;outline:none}
button.send{border:0;border-radius:50%;width:44px;height:44px;background:var(--yellow);font-weight:900;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.box{background:#151515;border:1px solid var(--border);border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.box input,.box select,.box textarea{width:100%;background:#1e1e1e;border:1px solid var(--border);color:#fff;border-radius:12px;padding:12px;outline:none;margin-bottom:12px}
.btnRow{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:10px 16px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
.btnCancel{background:#1e1e1e;color:#fff;border:1px solid var(--border)}
.btnOk{background:var(--yellow);color:#000}
.picCircle{width:90px;height:90px;border-radius:50%;background:#222;border:3px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--yellow);overflow:hidden;cursor:pointer}
.picCircle img{width:100%;height:100%;object-fit:cover}
.statusView{position:relative;width:100%;max-width:380px;height:75vh;background:#000;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.statusViewTop{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
.statusProgress{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:6px}
.statusProgress div{height:3px;background:rgba(255,255,255,.3);flex:1;border-radius:2px}
.statusProgress div.active{background:#fff}
.footer{flex-shrink:0;background:#000;border-top:1px solid #111;padding:8px;text-align:center;font-size:10px;color:#555}
.footer .secret{color:var(--yellow);font-weight:900;cursor:pointer}
.bigTab{width:100%;padding:16px;border-radius:14px;border:2px solid #333;background:#1e1e1e;color:#fff;font-weight:800;font-size:15px;margin-bottom:8px;cursor:pointer;text-align:left}
.bigTab.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.previewBox{display:none;border:3px solid var(--yellow);border-radius:16px;overflow:hidden;background:#000;margin-top:12px}
.previewBox.show{display:block}
</style>
</head>
<body>
<div class="top"><div style="display:flex;gap:6px;align-items:center"><div style="width:8px;height:8px;background:#00d26a;border-radius:50%"></div><div class="brand">CHALE<span>CHAT</span></div></div><div style="display:flex;gap:4px"><button id="contactsBtn" class="iconTop contactsBtn">📇</button><button id="profileBtn" class="iconTop"><span id="topAvatarLetter">S</span></button><button id="usersBtn" class="iconTop">👥</button></div></div>
<div id="statusBar"></div>
<div id="chat"></div>
<div class="barWrap"><div class="bar"><input id="i" class="msg" placeholder="Type..."><button class="send" id="b">➤</button></div></div>
<div class="footer"><b>POWERED BY</b> <span class="secret" id="secretAdminBtn">SALVATION TECH - GHANA</span> 🇬🇭</div>

<div id="statusCreateModal" class="modal"><div class="box"><h3>📸 Add Status — V28 FINAL</h3>

<!-- BIG TABS - NO MORE SMALL BUTTONS -->
<button id="tabText" class="bigTab active" onclick="showTab('text')">📝 Text Status — Type colorful message</button>
<div id="panelText"><textarea id="statusTextInput" placeholder="What dey happen? 24hrs..." rows="4"></textarea><div style="display:flex;gap:8px;margin:8px 0"><div style="width:36px;height:36px;border-radius:50%;background:#FCD116;border:2px solid #fff;cursor:pointer" onclick="setStatusBg('#FCD116','#000')"></div><div style="width:36px;height:36px;border-radius:50%;background:#CE1126;border:2px solid #fff;cursor:pointer" onclick="setStatusBg('#CE1126','#fff')"></div><div style="width:36px;height:36px;border-radius:50%;background:#00d26a;border:2px solid #fff;cursor:pointer" onclick="setStatusBg('#00d26a','#000')"></div><div style="width:36px;height:36px;border-radius:50%;background:#000;border:2px solid #fff;cursor:pointer" onclick="setStatusBg('#000','#fff')"></div></div></div>

<button id="tabPhoto" class="bigTab" onclick="showTab('photo')">🖼️ Photo Status — Tap to pick image & preview</button>
<div id="panelPhoto" style="display:none">
<div style="background:var(--yellow);color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:16px;cursor:pointer" onclick="document.getElementById('statusImageInput').click()">📸 TAP HERE TO CHOOSE PHOTO</div>
<input type="file" id="statusImageInput" accept="image/*" hidden>
<div id="statusImagePreview" class="previewBox"><img id="statusPreviewImg" style="width:100%;max-height:380px;object-fit:contain;display:block"><div style="background:#00d26a;color:#000;padding:8px;text-align:center;font-weight:900">✅ PHOTO PREVIEW — You fit see am!</div></div>
<input id="statusCaption" placeholder="Caption..." style="margin-top:10px">
</div>

<button id="tabVideo" class="bigTab" onclick="showTab('video')">🎬 Video Status — Tap to pick video & preview</button>
<div id="panelVideo" style="display:none">
<div style="background:var(--yellow);color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:16px;cursor:pointer" onclick="document.getElementById('statusVideoInput').click()">🎬 TAP HERE TO CHOOSE VIDEO</div>
<input type="file" id="statusVideoInput" accept="video/*" hidden>
<div id="statusVideoPreview" class="previewBox"><video id="statusPreviewVideo" controls playsinline style="width:100%;max-height:380px;background:#000;display:block"></video><div style="background:#00d26a;color:#000;padding:8px;text-align:center;font-weight:900">✅ VIDEO PREVIEW — Play am!</div></div>
<input id="statusVideoCaption" placeholder="Video caption..." style="margin-top:10px">
</div>

<div class="btnRow" style="margin-top:16px"><button class="btn btnCancel" id="cancelStatus">Cancel</button><button class="btn btnOk" id="postStatus">✓ Post Status</button></div>
</div></div>

<div id="statusViewModal" class="modal"><div class="statusView"><div class="statusProgress" id="statusProgress"></div><div class="statusViewTop"><div style="display:flex;align-items:center;gap:10px"><div id="viewStatusAv" style="width:36px;height:36px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden"></div><div><div id="viewStatusName" style="font-weight:700"></div><div id="viewStatusTime" style="font-size:10px;color:#aaa"></div></div></div><button onclick="document.getElementById('statusViewModal').classList.remove('show')" style="background:rgba(0,0,0,.5);border:0;color:#fff;width:32px;height:32px;border-radius:50%">✕</button></div><div id="viewStatusContent" style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto"></div></div></div>

<div id="nameModal" class="modal"><div class="box"><h3>👤 Setup</h3><div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px"><div class="picCircle" id="picCircle" onclick="document.getElementById('avatarInput').click()"><span id="picLetter">S</span></div><input type="file" id="avatarInput" hidden accept="image/*"></div><input id="nameInput" placeholder="Your name"><div class="btnRow"><button class="btn btnOk" id="okName">Save & Join</button></div></div></div>
<div id="profileModal" class="modal"><div class="box"><h3>👤 My Profile</h3><div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px"><div class="picCircle" id="profilePicCircle" onclick="document.getElementById('avatarInput2').click()"><span id="profilePicLetter">S</span></div><input type="file" id="avatarInput2" hidden accept="image/*"></div><input id="profileNameInput" placeholder="Your name"><div class="btnRow"><button class="btn btnCancel" id="closeProfile">Close</button><button class="btn btnOk" id="saveProfile">Save</button></div></div></div>
<div id="onlineModal" class="modal"><div class="box"><h3>👥 Online</h3><div id="onlineList"></div><div class="btnRow" style="margin-top:12px"><button class="btn btnOk" id="closeOnline">Close</button></div></div></div>

<script>
const sb = supabase.createClient('https://gmdtjtznwsimcseurntt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A');
let userId=localStorage.getItem('chale_id')||'user_'+Math.random().toString(36).substr(2,9); localStorage.setItem('chale_id',userId);
let myName=localStorage.getItem('chale_name')||''; let myAvatar=localStorage.getItem('chale_avatar')||'';
let onlineUsers={}, statuses=[], seenStatus=JSON.parse(localStorage.getItem('seen_status')||'[]'), currentTab='text', currentStatusUser=null;
function compress(dataUrl,cb,max=800,q=0.8){ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>max||h>max){ if(w>h){ h*=max/w; w=max; } else { w*=max/h; h=max; } } c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',q)); }; img.src=dataUrl; }
function updateAvatarUI(){ const l=(myName||'S')[0].toUpperCase(); document.getElementById('picLetter').textContent=l; document.getElementById('profilePicLetter').textContent=l; document.getElementById('topAvatarLetter').textContent=l; if(myAvatar){ document.getElementById('picCircle').innerHTML=`<img src="${myAvatar}">`; document.getElementById('profilePicCircle').innerHTML=`<img src="${myAvatar}">`; document.getElementById('topAvatarLetter').innerHTML=`<img src="${myAvatar}">`; } }
window.setStatusBg=(bg,color)=>{ const ta=document.getElementById('statusTextInput'); ta.style.background=bg; ta.style.color=color; ta.dataset.bg=bg; ta.dataset.color=color; }
window.showTab=(which)=>{
 currentTab=which;
 document.getElementById('tabText').classList.toggle('active', which==='text');
 document.getElementById('tabPhoto').classList.toggle('active', which==='photo');
 document.getElementById('tabVideo').classList.toggle('active', which==='video');
 document.getElementById('panelText').style.display=which==='text'?'block':'none';
 document.getElementById('panelPhoto').style.display=which==='photo'?'block':'none';
 document.getElementById('panelVideo').style.display=which==='video'?'block':'none';
 if(which==='photo'){ setTimeout(()=>document.getElementById('statusImageInput').click(),200); }
 if(which==='video'){ setTimeout(()=>document.getElementById('statusVideoInput').click(),200); }
};
const chatEl=document.getElementById('chat'), inputEl=document.getElementById('i');
async function loadMessages(){ const {data}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200); chatEl.innerHTML=''; data.forEach(m=>{ if(m.content.startsWith('[STATUS:')) return; const isMe=m.user_id===userId; const div=document.createElement('div'); div.className='m '+(isMe?'me':'other'); let content=m.content; if(content.startsWith('[IMG:')){ const src=content.match(/^\[IMG:(.*?)\]/)?.[1]; content=`<img style="max-width:150px;border-radius:12px" src="${src}">`; } div.innerHTML=`<div class="avatar">${(m.username[0]||'?').toUpperCase()}</div><div style="flex:1"><b style="font-size:11px;opacity:.6">${m.username}</b><div style="font-size:14px;word-break:break-word">${content}</div></div>`; chatEl.appendChild(div); }); chatEl.scrollTop=chatEl.scrollHeight; }
async function loadStatuses(){ const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(200); const now=Date.now(); statuses=(data||[]).filter(m=>m.content.startsWith('[STATUS:')).filter(m=>(now-new Date(m.created_at).getTime())<24*60*60*1000).map(m=>{ try{ const j=m.content.replace('[STATUS:','').slice(0,-1); const o=JSON.parse(j); return {id:m.id, username:m.username, user_id:m.user_id, created_at:m.created_at, ...o}; }catch{return null;} }).filter(Boolean); renderStatusBar(); }
function renderStatusBar(){ const bar=document.getElementById('statusBar'); const grouped={}; statuses.forEach(s=>{ if(!grouped[s.user_id]) grouped[s.user_id]=[]; grouped[s.user_id].push(s); }); bar.innerHTML=''; const addItem=document.createElement('div'); addItem.className='statusItem'; addItem.onclick=()=>{ document.getElementById('statusCreateModal').classList.add('show'); showTab('text'); }; addItem.innerHTML=`<div class="statusRing addRing"><div class="statusAv">${myAvatar?`<img src="${myAvatar}">`: (myName[0]||'+').toUpperCase()}<div class="plusBadge">+</div></div></div><div class="statusName">Add Status</div>`; bar.appendChild(addItem); Object.keys(grouped).forEach(uid=>{ const g=grouped[uid]; const latest=g[0]; const isSeen=seenStatus.includes(latest.id); const it=document.createElement('div'); it.className='statusItem'; it.onclick=()=>viewStatus(uid,0); let icon=''; if(latest.type==='video') icon='🎬 '; else if(latest.type==='image') icon='🖼️ '; it.innerHTML=`<div class="statusRing ${isSeen?'seen':''}"><div class="statusAv">${latest.avatar?`<img src="${latest.avatar}">`: (latest.username[0]||'?').toUpperCase()}</div></div><div class="statusName">${icon}${latest.username}</div>`; bar.appendChild(it); }); }
function viewStatus(uidView,idx){ const group=statuses.filter(s=>s.user_id===uidView); if(!group.length) return; currentStatusUser=uidView; const s=group[idx]; document.getElementById('viewStatusName').textContent=s.username; document.getElementById('viewStatusTime').textContent=new Date(s.created_at).toLocaleString(); document.getElementById('viewStatusAv').innerHTML=s.avatar?`<img src="${s.avatar}">`: (s.username[0]||'?').toUpperCase(); const c=document.getElementById('viewStatusContent'); if(s.type==='text'){ c.innerHTML=`<div style="background:${s.bg||'#FCD116'};color:${s.color||'#000'};padding:30px;border-radius:20px;font-size:22px;font-weight:800;text-align:center">${s.text}</div>`; } else if(s.type==='image'){ c.innerHTML=`<div style="text-align:center"><img src="${s.image}" style="max-width:100%;max-height:60vh;border-radius:16px"><div style="margin-top:12px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px">${s.caption||''}</div></div>`; } else if(s.type==='video'){ c.innerHTML=`<div style="text-align:center;width:100%"><video src="${s.video}" controls autoplay playsinline style="width:100%;max-height:60vh;border-radius:16px"></video><div style="margin-top:12px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px">${s.caption||''}</div></div>`; } const prog=document.getElementById('statusProgress'); prog.innerHTML=''; group.forEach((_,i)=>{ const d=document.createElement('div'); d.className=i===idx?'active':''; prog.appendChild(d); }); if(!seenStatus.includes(s.id)){ seenStatus.push(s.id); localStorage.setItem('seen_status',JSON.stringify(seenStatus)); } document.getElementById('statusViewModal').classList.add('show'); if(s.type!=='video'){ setTimeout(()=>{ if(document.getElementById('statusViewModal').classList.contains('show')&&currentStatusUser===uidView){ if(idx+1<group.length) viewStatus(uidView,idx+1); else document.getElementById('statusViewModal').classList.remove('show'); } },6000); } }
loadMessages(); loadStatuses();
sb.channel('chale-v28').on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{ loadMessages(); loadStatuses(); }).subscribe();
const presenceChannel=sb.channel('presence-v28',{config:{presence:{key:userId}}});
presenceChannel.on('presence',{event:'sync'},()=>{ const state=presenceChannel.presenceState(); onlineUsers={}; Object.values(state).forEach(ps=>{ ps.forEach(p=>{ onlineUsers[p.userId]=p; }) }); const listEl=document.getElementById('onlineList'); listEl.innerHTML=''; Object.values(onlineUsers).forEach(u=>{ const row=document.createElement('div'); row.className='userRow'; row.style.cssText='display:flex;gap:10px;padding:12px;background:#1a1a1a;border-radius:12px;margin-bottom:8px'; row.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">${(u.name[0]||'?').toUpperCase()}</div><div><b>${u.name}</b><div style="font-size:11px;color:#00d26a">Online</div></div>`; listEl.appendChild(row); }); }).subscribe(async()=>{ if(myName){ await presenceChannel.track({userId, name:myName, avatar:myAvatar}); } });

// IMAGE PICK + PREVIEW - FINAL FIX
document.getElementById('statusImageInput').onchange=(e)=>{
 const f=e.target.files[0]; 
 if(!f){ return; }
 const reader=new FileReader();
 reader.onload=()=>{
  const img=document.getElementById('statusPreviewImg');
  const box=document.getElementById('statusImagePreview');
  img.src=reader.result;
  img.dataset.raw=reader.result;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'center'});
  alert('✅ Photo loaded! You fit see preview now! Scroll down small!');
 };
 reader.onerror=()=>alert('Failed to read photo!');
 reader.readAsDataURL(f);
};
// VIDEO PICK + PREVIEW - FINAL FIX
document.getElementById('statusVideoInput').onchange=(e)=>{
 const f=e.target.files[0]; if(!f) return;
 if(f.size>25*1024*1024){ alert('Video too big! Max 25MB. Choose shorter video.'); return; }
 const reader=new FileReader();
 reader.onload=()=>{
  const video=document.getElementById('statusPreviewVideo');
  const box=document.getElementById('statusVideoPreview');
  video.src=reader.result;
  video.dataset.raw=reader.result;
  box.classList.add('show');
  video.load();
  box.scrollIntoView({behavior:'smooth', block:'center'});
  alert('✅ Video loaded! You fit play preview now!');
 };
 reader.readAsDataURL(f);
};
document.getElementById('cancelStatus').onclick=()=>{ document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusImagePreview').classList.remove('show'); document.getElementById('statusVideoPreview').classList.remove('show'); };
document.getElementById('postStatus').onclick=async()=>{
 let statusObj=null;
 if(currentTab==='text'){
  const text=document.getElementById('statusTextInput').value.trim(); if(!text){ alert('Type something!'); return; }
  const bg=document.getElementById('statusTextInput').dataset.bg||'#FCD116'; const color=document.getElementById('statusTextInput').dataset.color||'#000';
  statusObj={type:'text', text, bg, color, avatar:myAvatar};
 } else if(currentTab==='photo'){
  const raw=document.getElementById('statusPreviewImg').dataset.raw; if(!raw){ alert('⚠️ No photo! Tap the YELLOW button to choose photo first!'); showTab('photo'); return; }
  const btn=document.getElementById('postStatus'); btn.textContent='⏳ Posting...'; btn.disabled=true;
  compress(raw,(compressed)=>{
   const cap=document.getElementById('statusCaption').value.trim();
   const obj={type:'image', image:compressed, caption:cap, avatar:myAvatar};
   const content=`[STATUS:${JSON.stringify(obj)}]`;
   sb.from('messages').insert({username:myName,content,user_id:userId}).then(()=>{ document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusImagePreview').classList.remove('show'); document.getElementById('statusPreviewImg').dataset.raw=''; btn.textContent='✓ Post Status'; btn.disabled=false; loadStatuses(); alert('✅ Photo Status Posted!'); showTab('text'); });
  },900,0.85); return;
 } else if(currentTab==='video'){
  const raw=document.getElementById('statusPreviewVideo').dataset.raw; if(!raw){ alert('⚠️ No video! Tap YELLOW button to choose video!'); showTab('video'); return; }
  const cap=document.getElementById('statusVideoCaption').value.trim();
  statusObj={type:'video', video:raw, caption:cap, avatar:myAvatar};
 }
 if(statusObj){ const content=`[STATUS:${JSON.stringify(statusObj)}]`; await sb.from('messages').insert({username:myName,content,user_id:userId}); document.getElementById('statusCreateModal').classList.remove('show'); document.getElementById('statusVideoPreview').classList.remove('show'); loadStatuses(); alert('✅ Status Posted!'); showTab('text'); }
};
function handleAvatarFile(file){ const reader=new FileReader(); reader.onloadend=()=>{ compress(reader.result,(c)=>{ myAvatar=c; localStorage.setItem('chale_avatar',c); updateAvatarUI(); },120,0.6); }; reader.readAsDataURL(file); }
document.getElementById('avatarInput').onchange=(e)=>{ const f=e.target.files[0]; if(f) handleAvatarFile(f); };
document.getElementById('avatarInput2').onchange=(e)=>{ const f=e.target.files[0]; if(f) handleAvatarFile(f); };
document.getElementById('profileBtn').onclick=()=>{ document.getElementById('profileNameInput').value=myName; updateAvatarUI(); document.getElementById('profileModal').classList.add('show'); };
document.getElementById('closeProfile').onclick=()=>document.getElementById('profileModal').classList.remove('show');
document.getElementById('saveProfile').onclick=async()=>{ const n=document.getElementById('profileNameInput').value.trim(); if(n){ myName=n; localStorage.setItem('chale_name',n); } document.getElementById('profileModal').classList.remove('show'); await presenceChannel.track({userId, name:myName, avatar:myAvatar}); updateAvatarUI(); loadMessages(); };
document.getElementById('usersBtn').onclick=()=>document.getElementById('onlineModal').classList.add('show');
document.getElementById('closeOnline').onclick=()=>document.getElementById('onlineModal').classList.remove('show');
document.getElementById('contactsBtn').onclick=()=>document.getElementById('contactsModal').classList.add('show');
document.getElementById('closeContacts').onclick=()=>document.getElementById('contactsModal').classList.remove('show');
document.getElementById('b').onclick=async()=>{ let t=document.getElementById('i').value.trim(); if(!t) return; if(!myName){ document.getElementById('nameModal').classList.add('show'); return; } document.getElementById('i').value=''; await sb.from('messages').insert({username:myName,content:t,user_id:userId}); };
document.getElementById('i').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('b').click(); });
document.getElementById('okName').onclick=async()=>{ const n=document.getElementById('nameInput').value.trim(); if(!n){ alert('Enter name'); return; } myName=n; localStorage.setItem('chale_name',myName); document.getElementById('nameModal').classList.remove('show'); await presenceChannel.track({userId, name:myName, avatar:myAvatar}); updateAvatarUI(); loadMessages(); };
setTimeout(()=>{ if(!myName){ document.getElementById('nameModal').classList.add('show'); } updateAvatarUI(); },800);
</script>
</body></html>
