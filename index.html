<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHALECHAT UPGRADED 🇬🇭</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f1115;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(90deg,#006b3f,#ffcc00,#ce1126);padding:12px 16px;display:flex;justify-content:space-between;font-weight:900}
.tabs{display:flex;gap:8px;padding:10px;background:#1a1d25}
.tab{padding:8px 14px;border-radius:20px;border:none;cursor:pointer;background:#2a2e3a;color:#ccc}
.tab.active{background:#ffcc00;color:#000;font-weight:700}
.chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{background:#1e2a1e;border-radius:18px;padding:12px 14px;max-width:85%}
.msg.me{align-self:flex-end;background:#2a3a2a}
.trans{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1);color:#8fdb8f;font-size:13px}
.inputBar{display:flex;gap:10px;padding:12px;background:#1a1d25;position:sticky;bottom:0}
.inputBar input{flex:1;padding:14px;border-radius:24px;border:none;background:#2a2e3a;color:#fff;outline:none}
.inputBar button{width:56px;height:48px;border-radius:50%;border:none;background:#ffcc00;font-weight:900;cursor:pointer}
#authBox{position:fixed;inset:0;background:#0f1115;display:flex;align-items:center;justify-content:center;z-index:99}
.authCard{background:#1a1d25;padding:24px;border-radius:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.authCard input{padding:12px;border-radius:10px;border:none;background:#2a2e3a;color:#fff}
.btnYellow{padding:12px;border-radius:10px;border:none;background:#ffcc00;font-weight:700;cursor:pointer}
.btnGhost{padding:12px;border-radius:10px;background:transparent;border:1px solid #444;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div>CHALECHAT 🌍 UPGRADED</div><div>GHANA #1 🔥</div></div>
<div class="tabs">
<button class="tab active" data-lang="en">🇬🇧 English</button>
<button class="tab" data-lang="tw">🇬🇭 Twi</button>
<button class="tab" data-lang="pcm">🇳🇬 Pidgin</button>
<button class="tab" data-lang="fr">🇫🇷 French</button>
</div>
<div id="chat" class="chat"></div>
<div class="inputBar"><input id="msgInput" placeholder="Type in any language..."><button id="sendBtn">➤</button></div>
<div id="authBox"><div class="authCard">
<h2>CHALECHAT 🇬🇭</h2><p style="opacity:.6;font-size:13px">UPGRADED with Correct Twi!</p>
<input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button class="btnYellow" id="signupBtn">Create Account 🔥</button><button class="btnGhost" id="loginBtn">Login</button><p id="err" style="color:#ff6b6b;font-size:12px"></p>
</div></div>
<script>
// ==== YOUR FIREBASE CONFIG - API KEY INSERTED ====
const firebaseConfig = {
  apiKey: "AIzaSyB0s8MwwApN2Y3nbuD9z3sujFYLUyrIB14",
  authDomain: "chalechat-aa1b8.firebaseapp.com",
  projectId: "chalechat-aa1b8",
  storageBucket: "chalechat-aa1b8.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123def456"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();

// ==== CORRECT TWI - NO MORE FAKE TWI ====
const DICTS={
tw:{
"how are you":"Wo ho te sɛn?","how are you doing":"Wo ho te sɛn?","i am fine":"Me ho yɛ","i am good":"Me ho yɛ","good morning":"Maakye","good afternoon":"Maaha","good evening":"Maadwo","good night":"Da mu","thank you":"Medaase","thanks":"Medaase pii","i love you":"Me dɔ wo","i love ghana":"Me dɔ Ghana","what is your name":"Wo din de sɛn?","where are you":"Wo wɔ he?","i am coming":"Mereba","come here":"Bra ha","please":"Mesrɛ wo","sorry":"Kafra","welcome":"Akwaaba","yes":"Aane","no":"Daabi","money":"Sika","food":"Aduane","water":"Nsuo","house":"Fie","friend":"Adamfo","brother":"Nua","god bless you":"Nyame nhyira wo","beautiful":"Ahoɔfɛ","how much":"Yɛ sɛn?","i understand":"Mate aseɛ"},
pcm:{"how are you":"How you dey?","i am fine":"I dey fine","good morning":"Morning o","thank you":"Thank you o","where are you":"Where you dey?","i am coming":"I dey come","please":"Abeg","food":"Chop","i love you":"I love you die"},
fr:{"how are you":"Comment ça va?","i am fine":"Je vais bien","good morning":"Bonjour","thank you":"Merci","i love you":"Je t'aime"}
};
function getCorrect(t,lang){let l=t.toLowerCase().trim();if(DICTS[lang]&&DICTS[lang][l])return DICTS[lang][l];return null;}
async function translate(text,target){
if(target==="en") return text;
let fix=getCorrect(text,target); if(fix) return fix;
try{let tt=target==="tw"?"ak":target;let url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${tt}`;let r=await fetch(url);let j=await r.json();if(j.responseData&&j.responseData.translatedText)return j.responseData.translatedText;}catch(e){}
return text;
}
let currentLang="en"; let currentUser=null;
document.querySelectorAll(".tab").forEach(b=>{b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentLang=b.dataset.lang;load();};});
auth.onAuthStateChanged(u=>{if(u){currentUser=u;document.getElementById("authBox").style.display="none";load();}else{document.getElementById("authBox").style.display="flex";}});
document.getElementById("signupBtn").onclick=async()=>{try{await auth.createUserWithEmailAndPassword(email.value,password.value);}catch(e){err.textContent=e.message;}};
document.getElementById("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword(email.value,password.value);}catch(e){err.textContent=e.message;}};
let unsub=null;
function load(){if(unsub)unsub();unsub=db.collection("messages").orderBy("timestamp","asc").limit(100).onSnapshot(async snap=>{
let chat=document.getElementById("chat");chat.innerHTML="";
for(let doc of snap.docs){let d=doc.data();let trans="";if(currentLang!=="en"){let tt=await translate(d.text,currentLang);if(tt!==d.text)trans=`<div class="trans">↳ ${tt} [${currentLang}]</div>`;}
let div=document.createElement("div");div.className="msg"+(d.uid===currentUser?.uid?" me":"");div.innerHTML=`<div style="font-size:11px;opacity:.6">${d.displayName}</div><div>${d.text}</div>${trans}`;chat.appendChild(div);}
chat.scrollTop=chat.scrollHeight;
});}
sendBtn.onclick=async()=>{let t=msgInput.value.trim();if(!t||!currentUser)return;msgInput.value="";await db.collection("messages").add({text:t,displayName:currentUser.email.split("@")[0],uid:currentUser.uid,timestamp:firebase.firestore.FieldValue.serverTimestamp()});};
msgInput.onkeydown=e=>{if(e.key==="Enter")sendBtn.click();};
</script>
</body>
</html>
