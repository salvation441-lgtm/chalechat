<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHALECHAT GH</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{padding:12px 14px;background:linear-gradient(90deg,#CE1126 0%,#FCD116 50%,#006B3F 100%);color:#000;font-weight:900;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #000}
.top b{font-size:18px;letter-spacing:1px}
#stat{font-size:11px;background:#000;color:#FCD116;padding:5px 12px;border-radius:20px}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(#111 1px,transparent 1px);background-size:20px 20px}
.m{max-width:78%;padding:10px 12px 18px;border-radius:18px;position:relative;animation:pop .2s ease;word-break:break-word;line-height:1.3}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.me{align-self:flex-end;background:#FCD116;color:#000;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.m b{font-size:11px;opacity:.7;display:block;margin-bottom:2px}
.m span.time{position:absolute;bottom:3px;right:10px;font-size:9px;opacity:.6}
.bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;border-top:1px solid #222;align-items:center}
input{flex:1;background:#222;border:1px solid #333;color:#fff;border-radius:24px;padding:14px 18px;outline:none;font-size:15px}
input:focus{border-color:#FCD116}
button{border:0;border-radius:50%;width:50px;height:50px;background:#FCD116;font-weight:900;font-size:22px;cursor:pointer;transition:.1s}
button:active{transform:scale(.92)}
</style>
</head>
<body>
<div class="top"><b>CHALECHAT 🇬🇭</b><span id="stat">Connecting...</span></div>
<div id="chat"></div>
<div class="bar"><input id="i" placeholder="Type message..." autocomplete="off"><button id="b">➤</button></div>
<script>
const URL='https://gmdtjtznwsimcseurntt.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A';
const sb = window.supabase.createClient(URL,KEY);
let myName = localStorage.getItem('chale_name') || prompt('Enter your name:') || ('User'+Math.floor(Math.random()*90+10));
localStorage.setItem('chale_name',myName);

const chat=document.getElementById('chat'), stat=document.getElementById('stat');
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-GH',{hour:'numeric',minute:'2-digit'}); }

async function load(){
 const {data,error}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
 if(error){ stat.textContent='Error: '+error.message; return; }
 chat.innerHTML='';
 data.forEach(m=>{
   const div=document.createElement('div');
   div.className='m '+(m.username===myName?'me':'other');
   div.innerHTML=`<b>${m.username||'Anon'}</b>${m.content||''}<span class="time">${fmtTime(m.created_at)}</span>`;
   chat.appendChild(div);
 });
 chat.scrollTop=chat.scrollHeight;
}
load();
sb.channel('messages-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},load).subscribe();

// Presence - online count
const presenceChannel = sb.channel('online-users', {config:{presence:{key:myName}}});
presenceChannel.on('presence',{event:'sync'},()=>{
  const count=Object.keys(presenceChannel.presenceState()).length;
  stat.textContent = `${count} online • ${myName}`;
});
presenceChannel.subscribe(async (s)=>{
  if(s==='SUBSCRIBED') await presenceChannel.track({online_at:new Date().toISOString()});
});

async function send(){
 const inp=document.getElementById('i'); const txt=inp.value.trim(); if(!txt) return;
 inp.value='';
 await sb.from('messages').insert({username:myName, content:txt});
}
document.getElementById('b').onclick=send;
document.getElementById('i').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
</script>
<!-- vPRO-2026 -->
</body>
</html>
