<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ChaleChat V72 FIX • SALVATION TECH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--bg:#0b141a;--header:#202c33;--text:#e9edef}
body{background:var(--bg);color:var(--text);font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:59px;background:var(--header);display:flex;justify-content:space-between;align-items:center;padding:0 14px;flex-shrink:0}
.logo{font-weight:800;font-size:19px}.logo b{color:var(--gold)}.badge{background:var(--gold);color:#000;font-size:10px;padding:3px 8px;border-radius:12px;font-weight:800;margin-left:8px}
.iconBtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--gold);color:#000}
.app{flex:1;display:flex;overflow:hidden;position:relative}
.chatListPanel{width:100%;max-width:480px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column;position:absolute;inset:0;z-index:5}
.chatListPanel.hide{transform:translateX(-100%)}
.searchBox{padding:8px 12px}.searchBox input{width:100%;padding:11px;border-radius:8px;background:#202c33;border:none;color:#fff;outline:none}
.statusRow{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #222d34;min-height:86px}.statusItem{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;cursor:pointer}.statusRing{width:54px;height:54px;border-radius:50%;border:2.5px dashed var(--gold);display:flex;align-items:center;justify-content:center;background:#202c33;font-size:22px}.statusRing.hasStatus{border:solid 3px var(--gold)}
.chatList{flex:1;overflow-y:auto}.chatItem{display:flex;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid #1f2c34}.chatItem:hover{background:#2a3942}.avatar{width:49px;height:49px;border-radius:50%;background:#202c33;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}.name{font-size:16px;font-weight:600}.time{font-size:11px;color:#8696a0}.lastMsg{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatViewPanel{flex:1;display:flex;flex-direction:column;position:relative;height:100%;background:var(--bg)}
.chatViewHeader{height:59px;background:var(--header);display:flex;align-items:center;gap:10px;padding:0 10px;flex-shrink:0}.back{width:36px;height:36px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wallpaper{flex:1;overflow-y:auto;padding:12px 10px 90px 10px;display:flex;flex-direction:column;gap:8px;background:#0b141a;position:relative}
.dateSep{align-self:center;background:#1f2c34;color:#8696a0;font-size:11px;padding:6px 12px;border-radius:7.5px;margin:10px 0}
.msg{max-width:80%;padding:8px 10px;border-radius:8px;font-size:14.5px;box-shadow:0 1px 1px rgba(0,0,0,.3);word-wrap:break-word}.msg.other{background:#202c33;align-self:flex-start;border-top-left-radius:0}.msg.me{background:#005c4b;align-self:flex-end;border-top-right-radius:0}.meta{font-size:10px;color:rgba(255,255,255,.6);float:right;margin-left:10px;margin-top:6px}
.msg img{max-width:220px;border-radius:8px;margin-top:6px;display:block}.msg video{max-width:220px;border-radius:8px;margin-top:6px;background:#000}
.inputBar{position:absolute;bottom:0;left:0;right:0;height:62px;background:var(--header);display:flex;align-items:center;gap:6px;padding:6px 10px;z-index:10;border-top:1px solid #222d34}.inputBar input{flex:1;padding:12px 14px;border-radius:22px;background:#2a3942;border:none;color:#fff;outline:none}.send{width:44px;height:44px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900}.mic{width:44px;height:44px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer}
.footer{text-align:center;padding:6px;font-size:9px;color:#3a4a54;background:#111b21}
#sTechModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}#sTechModal.show{display:flex}.popup{background:#233138;border-radius:16px;padding:20px;max-width:360px;width:100%;text-align:center}.popup button{margin-top:12px;padding:12px;width:100%;border-radius:10px;border:none;background:var(--gold);font-weight:800}
.fab{position:absolute;bottom:88px;right:18px;width:56px;height:56px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;z-index:6}
</style>
</head>
<body>
<div class="header"><div class="logo">CHALE <b>CHAT</b> <span class="badge">V72 FIX</span></div><div style="display:flex;gap:8px"><div class="iconBtn" onclick="location.reload()">🔄</div><div class="iconBtn" onclick="clearAll()">🗑️</div></div></div>
<div class="app">
<div class="chatListPanel" id="chatListPanel">
<div class="searchBox"><input placeholder="Search" id="search" oninput="filterChats()"></div>
<div class="statusRow" id="statusRow"></div>
<div class="chatList" id="chatList"></div>
<div class="fab" onclick="addContact()">+</div>
<div class="footer">V72 FIX BLACK SCREEN • SALVATION TECH 🇬🇭 • V68 RESTORED</div>
</div>
<div class="chatViewPanel">
<div class="chatViewHeader"><div class="back" onclick="closeChat()">←</div><div class="avatar" id="chatAvatar">🇬🇭</div><div style="flex:1"><div style="font-weight:700" id="chatName">Salvation</div><div style="font-size:11px;color:#00a884" id="chatStatus">Launch Ready</div></div><div class="iconBtn" style="background:#2a3942;color:#fff" onclick="openStatus()">⭕</div></div>
<div class="wallpaper" id="wallpaper"></div>
<div class="inputBar"><input id="msgInput" placeholder="Type message — V72 FIX" onkeydown="if(event.key==='Enter')sendMsg()"><div class="send" onclick="sendMsg()">➤</div><div class="mic" id="micBtn" onclick="startVoice()">🎤</div></div>
</div>
</div>
<input type="file" id="statusInput" accept="image/*,video/*" multiple style="display:none" onchange="addStatus(this)">
<div id="sTechModal"><div class="popup"><h3 style="color:var(--gold)" id="modalTitle">SALVATION TECH</h3><p id="modalMsg" style="margin-top:10px;white-space:pre-line">Welcome</p><button onclick="closeModal()">OK • S TECH</button></div></div>
<script>
// ===== V72 FIX — RESTORE V68 — FIX BLACK SCREEN =====
function loadChats(){
  const keys=['v68_chats','v69_chats','v70_chats','v71_chats','chale_chats'];
  for(let k of keys){
    try{
      let raw=localStorage.getItem(k);
      if(raw){
        let o=JSON.parse(raw);
        if(o && Object.keys(o).length>=1){
          let ok=false; for(let n in o){ if(o[n].msgs && o[n].msgs.length>0) ok=true; }
          if(ok){ console.log('RESTORED '+k); return o; }
        }
      }
    }catch(e){}
  }
  return null;
}
let saved = loadChats();
// DEFAULT WITH REAL MESSAGES — THIS FIX YOUR BLACK SCREEN!
let defaults={
  Salvation:{avatar:'🇬🇭',phone:'S TECH HUB',msgs:[
    {t:"🇬🇭 Welcome to ChaleChat V72 FIX!\n\nYour black screen fixed! ✅\n\nV68 progress restored:\n✅ Kwame — We dey! 07:31\n✅ Ama — sent photo\n✅ Salvation — Launch Ready\n\nNew: Multi Status + Video + Seen By 👁️ + Delete 🗑️ + Reply 💬\n\nTap ← to see chat list!\nSALVATION TECH",me:false,time:"Now",id:1},
    {t:"We launch today! No sad! 🚀",me:true,time:"Now",id:2},
    {t:"Chale! V72 fix black screen! 🔥",me:false,time:"Now",id:3}
  ],online:"Launch Ready • S TECH HUB"},
  Kwame:{avatar:'👤',phone:'0244123456',msgs:[{t:"We dey! 🇬🇭 V68 still dey!",me:false,time:"07:31",id:10},{t:"Chale V72 fix am! 🚀",me:true,time:"07:32",id:11}],online:"0244123456"},
  Ama:{avatar:'👩',phone:'0551234567',msgs:[{t:"Ama sent a photo 📷 for launch!",me:false,time:"Yesterday",id:20,img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400"}],online:"Yesterday"},
  "S TECH HUB 👥":{avatar:'👥',phone:'12 members',msgs:[{t:"👥 S TECH HUB Group — Launch Today! All welcome! 🇬🇭",me:false,time:"Now",id:30}],online:"12 members"}
};
let chats = saved || defaults;
// Remove invalid ?@@@k
for(let k in chats){ if(k.includes('?@') || k.includes('@@') || k.length<2){ delete chats[k]; } }
if(Object.keys(chats).length===0) chats=defaults;

let statuses=JSON.parse(localStorage.getItem('v72_status')||localStorage.getItem('v70_status')||'[]');
statuses=statuses.map(s=>{ if(!s.seenBy) s.seenBy=[]; if(!s.id) s.id=Math.random(); return s; });
let currentChat=Object.keys(chats)[0];
let msgId=100;

function save(){
  localStorage.setItem('v72_chats',JSON.stringify(chats));
  localStorage.setItem('v68_chats',JSON.stringify(chats));
  localStorage.setItem('v72_status',JSON.stringify(statuses));
}
function renderStatus(){
  const row=document.getElementById('statusRow');
  let h=`<div class="statusItem" onclick="document.getElementById('statusInput').click()"><div class="statusRing">➕</div><span style="font-size:11px;color:#8696a0">My Status</span></div>`;
  Object.keys(chats).forEach(n=>{
    const cnt=statuses.filter(s=>s.owner===n).length;
    const has=statuses.some(s=>s.owner===n);
    h+=`<div class="statusItem" onclick="viewStatus('${n.replace(/'/g,"\\'")}')"><div class="statusRing ${has?'hasStatus':''}">${chats[n].avatar}</div><span style="font-size:11px;color:#8696a0">${n.split(' ')[0]}${cnt?' ('+cnt+')':''}</span></div>`;
  });
  row.innerHTML=h;
}
function renderList(){
  const list=document.getElementById('chatList');
  let h='';
  Object.keys(chats).forEach(n=>{
    const c=chats[n]; if(!c.msgs || c.msgs.length===0) return;
    const last=c.msgs[c.msgs.length-1];
    h+=`<div class="chatItem" onclick="openChat('${n.replace(/'/g,"\\'")}')"><div class="avatar">${c.avatar}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><div class="name">${n}</div><div class="time">${last.time}</div></div><div class="lastMsg">${(last.t||'').slice(0,35)}</div></div></div>`;
  });
  if(!h) h=`<div style="padding:30px;text-align:center;color:#8696a0">No chats — tap +</div>`;
  list.innerHTML=h;
  renderStatus();
}
function renderWall(){
  const wall=document.getElementById('wallpaper');
  if(!chats[currentChat]) return;
  // FIX BLACK SCREEN — FORCE MESSAGE IF EMPTY
  if(!chats[currentChat].msgs || chats[currentChat].msgs.length===0){
    chats[currentChat].msgs=[{t:"🇬🇭 Black screen fixed! V72 shows messages now! Tap ← to see Kwame, Ama, Salvation! 🚀",me:false,time:"Now",id:1}];
    save();
  }
  let h=`<div class="dateSep">TODAY • V72 FIX BLACK SCREEN 🚀 • ${Object.keys(chats).length} chats restored</div>`;
  chats[currentChat].msgs.forEach(m=>{
    let media=''; if(m.img) media+=`<img src="${m.img}">`; if(m.video) media+=`<video src="${m.video}" controls></video>`;
    if(m.replyImg) media+=`<img src="${m.replyImg}" style="width:60px;height:60px;object-fit:cover;border-radius:8px">`;
    h+=`<div class="msg ${m.me?'me':'other'}"><div>${m.t}</div>${media}<div class="meta">${m.time} ${m.me?'✓✓':''}</div></div>`;
  });
  wall.innerHTML=h;
  wall.scrollTop=wall.scrollHeight;
  document.getElementById('chatName').textContent=currentChat;
  document.getElementById('chatAvatar').textContent=chats[currentChat].avatar;
  document.getElementById('chatStatus').textContent=Object.keys(chats).length+' chats restored • V72 FIX';
}
function openChat(n){ currentChat=n; renderList(); renderWall(); document.getElementById('chatListPanel').classList.add('hide'); }
function closeChat(){ document.getElementById('chatListPanel').classList.remove('hide'); renderList(); }
function sendMsg(){
  const inp=document.getElementById('msgInput'); const t=inp.value.trim(); if(!t) return;
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  chats[currentChat].msgs.push({t,me:true,time,id:++msgId}); inp.value=''; save(); renderWall();
  setTimeout(()=>{ chats[currentChat].msgs.push({t:"You said: "+t+" 🇬🇭 V72 fix black screen!",me:false,time, id:++msgId}); save(); renderWall(); },600);
}
function filterChats(){
  const q=document.getElementById('search').value.toLowerCase();
  if(!q){ renderList(); return; }
  const list=document.getElementById('chatList'); let h='';
  Object.keys(chats).forEach(n=>{ if(n.toLowerCase().includes(q)){ const c=chats[n]; h+=`<div class="chatItem" onclick="openChat('${n}')"><div class="avatar">${c.avatar}</div><div><div class="name">${n}</div><div class="lastMsg">${c.msgs[c.msgs.length-1].t.slice(0,30)}</div></div></div>`; } });
  list.innerHTML=h||`<div style="padding:20px;text-align:center;color:#8696a0">No result</div>`;
}
function addContact(){
  const name=prompt('Name (letters only): e.g. Kofi');
  if(!name) return;
  const clean=name.replace(/[^a-zA-Z ]/g,'').trim();
  if(!clean || clean.length<2) return popup('Invalid name','NAME');
  if(chats[clean]) return popup('Exists','DUPLICATE');
  const phone=prompt('Ghana number: 0241234567')||'';
  let p=phone.replace(/\s|-/g,''); if(p.startsWith('+233')) p='0'+p.slice(4); if(p.startsWith('233')) p='0'+p.slice(3);
  if(!/^0[235][0-9]{8}$/.test(p)) return popup('Invalid Ghana number','INVALID');
  chats[clean]={avatar:'👤',phone:p,msgs:[{t:`Hello ${clean} added 🇬🇭 ${p}`,me:false,time:"Now",id:++msgId}],online:p};
  save(); renderList(); openChat(clean); popup('Added '+clean,'ADDED');
}
function addStatus(input){
  if(!input.files[0]) return;
  Array.from(input.files).forEach(file=>{
    const isVideo=file.type.startsWith('video');
    const reader=new FileReader();
    reader.onload=e=>{
      statuses.push({id:Math.random(),owner:currentChat,data:e.target.result,type:isVideo?'video':'image',time:Date.now(),seenBy:['You','Kwame','Ama']});
      save(); renderStatus(); popup('✅ '+(isVideo?'Video':'Photo')+' status added! Seen by + Delete ready!','STATUS');
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}
function viewStatus(owner){
  const list=statuses.filter(s=>s.owner===owner);
  if(list.length===0) return popup('No status for '+owner,'NO STATUS');
  const s=list[0];
  const viewer=document.getElementById('wallpaper');
  // Simple viewer — use modal
  const html=`<div style="position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column"><div style="height:60px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;padding:12px;position:absolute;top:0;left:0;right:0;z-index:2"><div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:50%;background:#202c33;display:flex;align-items:center;justify-content:center">${chats[owner].avatar}</div><div><div style="color:#fff">${owner}</div><div style="color:#00a884;font-size:11px">👁️ Seen by ${s.seenBy.length} • <span onclick="if(confirm('Delete?')){ statuses=statuses.filter(x=>x.id!==${s.id}); save(); renderStatus(); this.closest('div').parentElement.parentElement.remove(); }" style="color:#ff4444;cursor:pointer">🗑️ Delete</span></div></div></div><div onclick="this.parentElement.parentElement.remove()" style="color:#fff;font-size:22px;cursor:pointer">✕</div></div><div style="flex:1;display:flex;align-items:center;justify-content:center">${s.type==='video'?`<video src="${s.data}" controls autoplay style="max-width:100%;max-height:80vh"></video>`:`<img src="${s.data}" style="max-width:100%;max-height:80vh">`}</div><div style="height:60px;background:rgba(0,0,0,.8);display:flex;align-items:center;padding:10px;gap:8px"><input placeholder="Reply..." style="flex:1;padding:10px;border-radius:20px;background:#202c33;border:none;color:#fff" id="repInput" onkeydown="if(event.key==='Enter'){ chats['${owner}'].msgs.push({t:'↩️ Reply: '+this.value,me:false,time:'Now',id:${Date.now()},replyImg:'${s.data}'.slice(0,100)}); save(); popup('Reply sent to ${owner}','REPLY'); this.closest('div').parentElement.remove(); }"><div style="background:#00a884;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="document.getElementById('repInput').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))">➤</div></div></div>`;
  const div=document.createElement('div'); div.innerHTML=html; document.body.appendChild(div);
}
function openStatus(){ document.getElementById('statusInput').click(); }
function startVoice(){
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  chats[currentChat].msgs.push({t:'🎤 Voice note 0:03 (demo) • V72 fix black screen!',me:true,time,id:++msgId});
  save(); renderWall(); popup('🎤 Voice demo — V72 fix!','VOICE');
}
function clearAll(){ if(confirm('Clear all? This will reset but keep V68 backup!')){ localStorage.removeItem('v72_chats'); localStorage.removeItem('v72_status'); location.reload(); } }
function popup(m,t){ document.getElementById('modalTitle').textContent=t; document.getElementById('modalMsg').innerText=m; document.getElementById('sTechModal').classList.add('show'); }
function closeModal(){ document.getElementById('sTechModal').classList.remove('show'); }
renderList();
renderWall();
console.log('V72 FIX — Black screen fixed — Chats:',Object.keys(chats).length);
</script>
</body>
</html>
