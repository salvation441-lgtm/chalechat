<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChaleChat - Ghana to the World</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial}body{background:#0b1120;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 16px;background:linear-gradient(135deg,#0b2a5b,#0d8f85);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo span{color:#facc15}
.lang-bar{background:#111827;padding:10px 12px;display:flex;gap:6px;overflow:auto;border-bottom:1px solid #1f2937}
.lang{padding:7px 12px;border-radius:20px;background:#1f2937;color:#9ca3af;font-size:11px;font-weight:800;border:1px solid #374151;white-space:nowrap;cursor:pointer}
.lang.active{background:#facc15;color:#111827;border-color:#facc15}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#0b1120 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.02"><path d="M0 0h100v100H0z" fill="none"/><circle cx="50" cy="50" r="2" fill="white"/></svg>')}
.bubble{max-width:78%;padding:12px 14px;border-radius:18px;position:relative;cursor:pointer;animation:pop .2s}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#0b2a5b,#2563eb);border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:#1f2937;border-bottom-left-radius:6px}
.orig{font-size:14px;font-weight:600;line-height:1.3}.trans{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.2);font-size:11px;color:#a7f3d0;font-weight:600;display:flex;gap:4px}
.meta{font-size:9px;opacity:.6;margin-top:4px;display:flex;justify-content:space-between}
.input-bar{padding:12px;background:#111827;border-top:1px solid #1f2937;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;background:#1f2937;border:1px solid #374151;border-radius:24px;padding:12px 16px;color:#fff;outline:none;font-size:14px}
.send{width:44px;height:44px;background:linear-gradient(135deg,#facc15,#eab308);border:none;border-radius:50%;font-size:18px;cursor:pointer;color:#111827;font-weight:900}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.badge{font-size:8px;background:rgba(250,204,21,.2);color:#facc15;padding:3px 6px;border-radius:10px;margin-left:6px}
</style></head><body>
<div class="header">
<div class="logo">CHALECHAT <span>🌍</span><div style="font-size:10px;font-weight:600;opacity:.8;letter-spacing:.3px">TWI • PIDGIN • ENGLISH • FRENCH • WORLD</div></div>
<div style="font-size:10px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:20px;font-weight:800">GHANA #1</div>
</div>
<div class="lang-bar" id="langBar"></div>
<div class="chat" id="chat"></div>
<div class="input-bar">
<input id="msg" placeholder="Type in Twi, English, French...">
<button class="send" id="sendBtn">↑</button>
</div>

<script>
const langs=[
{id:'en',name:'🇬🇧 English',code:'en'},
{id:'tw',name:'🇬🇭 Twi',code:'ak'},
{id:'pg',name:'🇬🇭 Pidgin',code:'en'},
{id:'fr',name:'🇫🇷 French',code:'fr'},
{id:'es',name:'🇪🇸 Spanish',code:'es'},
{id:'sw',name:'🇹🇿 Swahili',code:'sw'},
{id:'yo',name:'🇳🇬 Yoruba',code:'yo'},
{id:'ar',name:'🇸🇦 Arabic',code:'ar'}
];
let myLang='en';
let messages=JSON.parse(localStorage.getItem('chalechat_msgs')||'[]');

// Custom Twi/Pidgin dictionary for demo (since APIs don't support Twi well)
const ghDict={
"how are you":{"tw":"Wo ho te sɛn?","pg":"How you dey?","fr":"Comment ça va?","es":"¿Cómo estás?","sw":"Habari yako?","yo":"Bawo ni?","ar":"كيف حالك؟"},
"good morning":{"tw":"Mema wo akye","pg":"Good morning chale","fr":"Bonjour","es":"Buenos días","sw":"Habari za asubuhi","yo":"E kaaro","ar":"صباح الخير"},
"i love ghana":{"tw":"Me dɔ Ghana","pg":"I love Ghana die","fr":"J'aime le Ghana","es":"Amo Ghana","sw":"Ninapenda Ghana","yo":"Mo fẹ Ghana","ar":"أحب غانا"},
"how much":{"tw":"Ɛyɛ ahe?","pg":"How much be this?","fr":"Combien?","es":"¿Cuánto?","sw":"Bei gani?","yo":"Elo ni?","ar":"بكم؟"},
"come let's chat":{"tw":"Bra yɛn nkasa","pg":"Come make we chat","fr":"Viens on discute","es":"Vamos a charlar","sw":"Njoo tuongee","yo":"Wa jẹ ki a sọrọ","ar":"تعال نتحدث"}
};

function renderLangs(){
document.getElementById('langBar').innerHTML=langs.map(l=>`<div class="lang ${myLang===l.id?'active':''}" onclick="setLang('${l.id}')">${l.name}</div>`).join('');
}
function setLang(id){myLang=id; renderLangs(); document.getElementById('msg').placeholder=`Type in ${langs.find(l=>l.id===id).name}...`; renderChat()}

async function translate(text, to){
let key=text.toLowerCase().trim();
if(ghDict[key] && ghDict[key][to]) return ghDict[key][to];
if(to==='pg') return text+" chale";
if(to==='tw') return "[Twi] "+text;
// Use free MyMemory API for world languages
try{
let toCode=langs.find(l=>l.id===to).code;
let res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${toCode}`);
let data=await res.json();
if(data.responseData && data.responseData.translatedText) return data.responseData.translatedText;
}catch(e){}
return text;
}

async function renderChat(){
let c=document.getElementById('chat'); c.innerHTML='';
for(let m of messages){
let showTrans = m.lang!==myLang;
let transText = showTrans ? (m.translations[myLang]|| await translate(m.text,myLang)) : '';
// cache translation
if(showTrans && !m.translations[myLang]){m.translations[myLang]=transText; localStorage.setItem('chalechat_msgs',JSON.stringify(messages))}
let isMe=m.lang===myLang && m.isMe!==false;
let langName=langs.find(l=>l.id===m.lang).name.split(' ')[1];
c.innerHTML+=`<div class="bubble ${isMe?'me':'them'}" onclick="this.querySelector('.trans').style.display=this.querySelector('.trans').style.display==='none'?'flex':'none'">
<div class="orig">${m.text}<span class="badge">${langName}</span></div>
${showTrans?`<div class="trans">↳ ${transText} <span style="opacity:.6">(${langs.find(l=>l.id===myLang).name})</span></div>`:''}
<div class="meta"><span>${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><span>${isMe?'✓✓':''}</span></div>
</div>`;
}
c.scrollTop=c.scrollHeight;
}

async function send(){
let input=document.getElementById('msg'); let t=input.value.trim(); if(!t)return;
input.value='';
let msgObj={id:Date.now(),text:t,lang:myLang,time:Date.now(),isMe:true,translations:{}};
messages.push(msgObj);
localStorage.setItem('chalechat_msgs',JSON.stringify(messages));
await renderChat();
// Simulate reply in different language for demo
setTimeout(async()=>{
let otherLangs=langs.filter(l=>l.id!==myLang);
let randLang=otherLangs[Math.floor(Math.random()*otherLangs.length)];
let replies={
"en":["Nice! Ghana to the world 🌍","Chale you dey speak well!","We go shock the world!"],
"tw":["Eyɛ nokware!","Yɛ bɛ yɛ kɛse!"],
"fr":["Incroyable le Ghana!","On va choquer le monde!"],
"es":["¡Ghana va a sorprender al mundo!"],
"sw":["Ghana itashangaza dunia!"]
};
let replyText=(replies[randLang.id]||replies["en"])[Math.floor(Math.random()*3)];
let reply={id:Date.now()+1,text:replyText,lang:randLang.id,time:Date.now(),isMe:false,translations:{}};
reply.translations[myLang]=await translate(replyText,myLang);
messages.push(reply);
localStorage.setItem('chalechat_msgs',JSON.stringify(messages));
renderChat();
},1200);
}

document.getElementById('sendBtn').addEventListener('click',send);
document.getElementById('msg').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
window.setLang=setLang;

// init
if(messages.length===0){
messages=[
{id:1,text:"Mema wo akye - Welcome to ChaleChat 🌍",lang:"tw",time:Date.now()-60000,isMe:false,translations:{en:"Good morning - Welcome to ChaleChat 🌍",fr:"Bonjour - Bienvenue sur ChaleChat 🌍",es:"Buenos días - Bienvenido a ChaleChat 🌍"}},
{id:2,text:"We go shock the world chale! Type in any language",lang:"pg",time:Date.now()-30000,isMe:false,translations:{en:"We will shock the world! Type in any language",tw:"Yɛ bɛ bɔ wiase hu! Kyerɛw wɔ kasa biara mu"}}
];
localStorage.setItem('chalechat_msgs',JSON.stringify(messages));
}
renderLangs(); renderChat();
</script></body></html>
