<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHALECHAT GH</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{padding:12px 14px;background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F);color:#000;font-weight:900;display:flex;justify-content:space-between;align-items:center}
#stat{font-size:11px;background:#000;color:#FCD116;padding:5px 12px;border-radius:20px}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 12px 18px;border-radius:18px;position:relative;word-break:break-word;line-height:1.3}
.me{align-self:flex-end;background:#FCD116;color:#000;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.m b{font-size:11px;opacity:.7;display:block;margin-bottom:2px}
.time{position:absolute;bottom:3px;right:10px;font-size:9px;opacity:.6}
.bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;border-top:1px solid #222}
input{flex:1;background:#222;border:1px solid #333;color:#fff;border-radius:24px;padding:14px 18px;outline:none}
button{border:0;border-radius:50%;width:50px;height:50px;background:#FCD116;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>CHALECHAT 🇬🇭</b><span id="stat">Connecting...</span></div>
<div id="chat"></div>
<div class="bar"><input id="i" placeholder="Type message..."><button id="b">➤</button></div>
<script>
const sb = supabase.createClient('https://gmdtjtznwsimcseurntt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A');
let myName = localStorage.getItem('chale_name') || 'salvation';
const chatEl=document.getElementById('chat'), statEl=document.getElementById('stat');
function fmt(d){try{return new Date(d).toLocaleTimeString('en-GH',{hour:'numeric',minute:'2-digit'})}catch{return''}}
async function load(){
 try{
  const {data,error}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(error){statEl.textContent=error.message;return}
  chatEl.innerHTML='';
  data.forEach(m=>{
   const div=document.createElement('div');
   div.className='m '+(m.username===myName?'me':'other');
   div.innerHTML=`<b>${m.username}</b>${m.content}<span class="time">${fmt(m.created_at)}</span>`;
   chatEl.appendChild(div);
  });
  chatEl.scrollTop=chatEl.scrollHeight;
  statEl.textContent=`Live • ${data.length} • ${myName}`;
 }catch(e){statEl.textContent=e.message}
}
load();
sb.channel('chale2').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},load).subscribe();
async function send(){
 const inp=document.getElementById('i'); const t=inp.value.trim(); if(!t) return;
 inp.value='';
 await sb.from('messages').insert({username:myName,content:t});
}
document.getElementById('b').onclick=send;
document.getElementById('i').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
<!-- vPRO2-FIXED -->
</body>
</html>
