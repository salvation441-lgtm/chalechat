<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0b141a;color:#e9edef;height:100dvh;display:flex;flex-direction:column}
.header{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#111;border:2px solid #00a88433}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:800}.sub{font-size:11px;color:#8696a0}
.badge{margin-left:auto;background:#0a332c;border:1px solid #00a884;color:#00a884;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800}

.tabs button.active{color:#00a884;border-color:#00a884}
.screen{flex:1;overflow-y:auto;position:relative}
.card{background:#202c33;margin-bottom:10px;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;min-height:82px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:20px;width:58px;height:58px;border-radius:18px;background:#00a884;color:white;border:none;font-size:30px;display:grid;place-items:center;z-index:30}
.chat-area{padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:10px 12px;border-radius:16px;font-size:15px;word-break:break-word}
.bubble.me{align-self:flex-end;background:#005c4b;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:#202c33;border-bottom-left-radius:4px}
.bubble img{width:100%;height:auto;max-height:380px;border-radius:12px;object-fit:contain;background:#000;display:block}
.bubble video{width:100%;height:auto;max-height:380px;border-radius:12px;background:#000;display:block}
.meta{font-size:10px;color:#ffffff99;margin-top:6px;text-align:right}
.orig{margin-top:6px;padding-top:6px;border-top:1px dashed #ffffff20;font-size:11px;color:#8696a0}
.live-preview{background:#182026;border-left:3px solid #00a884;padding:10px 12px;font-size:13px;color:#00e6a0;display:none;position:sticky;bottom:58px;z-index:34}
.reply-bar{background:#182026;padding:8px 12px;display:flex;align-items:center;gap:10px;border-left:3px solid #00a884;display:none;position:sticky;bottom:58px;z-index:35}
.input-bar{background:#202c33;padding:6px 8px;display:flex;align-items:flex-end;gap:6px;position:sticky;bottom:0;z-index:40}
.input-wrap{flex:1;background:#2a3942;border-radius:24px;display:flex;align-items:flex-end;padding:5px 6px 5px 14px}
.input-wrap textarea{flex:1;background:transparent;border:none;color:white;outline:none;resize:none;max-height:100px;min-height:22px;padding:8px 0;font-size:15px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;font-size:20px;cursor:pointer;touch-action:none}
.mic{background:#00a884;color:white}.mic.recording{background:#f15c6d;animation:pulse 1s infinite}.send{background:#00a884;color:white;display:none}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#111b21;border:1px solid #2a3942;border-bottom:none;border-radius:24px 24px 0 0;padding:18px 16px 32px 16px;z-index:100;display:none;max-height:90vh;overflow-y:auto}
.sheet-handle{height:4px;width:40px;background:#2a3942;border-radius:10px;margin:0 auto 14px}
.sheet-opt{padding:18px 10px;border-bottom:1px solid #202c33;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.attach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.attach-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:16px;background:#202c33}
.attach-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:white}
.input-field{width:100%;background:#202c33;border:1px solid #2a3942;border-radius:12px;padding:14px;color:white;font-size:15px;margin-top:10px;outline:none}
.btn-primary{width:100%;background:#00a884;color:white;border:none;border-radius:12px;padding:14px;font-weight:800;margin-top:14px}
.btn-dash{width:100%;background:#1f2c34;border:1px dashed #00a884;color:#00a884;border-radius:12px;padding:14px;font-weight:800;margin-top:14px}
.btn-ghost{width:100%;background:transparent;color:#8696a0;border:none;padding:12px;margin-top:8px}
.context-menu{position:fixed;background:#233138;border-radius:14px;overflow:hidden;z-index:200;min-width:240px;display:none}
.context-menu div{padding:16px 18px}
</style>

</div>

<div class="bottom-sheet" id="contactModal"><div class="sheet-handle"></div><h4 style="font-weight:900">New Contact 🇬🇭</h4><button class="btn-dash" onclick="autoPickContact()">📱 Pick from Phone</button><input id="cName" class="input-field normal" placeholder="Name"><input id="cNumber" class="input-field normal" placeholder="Phone"><input id="cLang" class="input-field normal" value="Twi"><button class="btn-primary" onclick="saveContact()">Save ✓</button><button class="btn-ghost" onclick="closeContactModal()">Cancel</button><div id="autoStatus" style="font-size:12px;color:#8696a0;margin-top:10px;text-align:center"></div></div>

<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="vidInput" accept="video/*" hidden>

<input type="file" id="audInput" accept="audio/*" hidden>

<script>
// IndexedDB for big video/audio — fix same chat upload
let db=null;
function openDB(){
 return new Promise((res,rej)=>{
  const req=indexedDB.open('chalechat_media',1);
  req.onupgradeneeded=e=>{ e.target.result.createObjectStore('videos',{keyPath:'id'}); };
  req.onsuccess=e=>{ db=e.target.result; res(db); };
  req.onerror=()=>rej();
 });
}
async function saveMedia(id, blob, name, type){
 await openDB();
 return new Promise((res,rej)=>{
  const tx=db.transaction('videos','readwrite');
  tx.objectStore('videos').put({id, blob, name, type, time:Date.now()});
  tx.oncomplete=()=>res(); tx.onerror=()=>rej();
 });
}
async function getMedia(id){
 await openDB();
 return new Promise((res)=>{
  const tx=db.transaction('videos','readonly');
  const req=tx.objectStore('videos').get(id);
  req.onsuccess=()=>res(req.result);
  req.onerror=()=>res(null);
 });
}

let transON=true;
let currentContactId=localStorage.getItem('cc_current_v159')||'1l1p';
let allChats=JSON.parse(localStorage.getItem('cc_allChats_v159')||'{}');
let contacts=JSON.parse(localStorage.getItem('cc_contacts_v159')||'[{"id":"1l1p","name":"? 1l1p","number":"0550000000","lang":"Twi","flag":"🇬🇭","avatar":"https://i.pravatar.cc/100?img=12"}]');
let replyTo=null, longPressId=null;
const LANGS=[{id:'twi',name:'Twi',flag:'🇬🇭',code:'tw'},{id:'fante',name:'Fante',flag:'🇬🇭',code:'ak'},{id:'english',name:'English',flag:'🇬🇧',code:'en'}];
function getLang(){return localStorage.getItem('cc_lang')||'twi';}
function getLangCode(){return LANGS.find(x=>x.id===getLang())?.code||'tw';}
function getMsgs(id){id=id||currentContactId; if(!allChats[id]) allChats[id]=[]; allChats[id]=allChats[id].filter(m=>m&&(m.type||m.text)); if(allChats[id].length===0){ allChats[id]=[{id:1,text:"Am good and you",displayText:"Me ho yɛ, na wo nso?",original:"Am good and you",time:"02:07 AM",from:"them"}]; saveAll(); } return allChats[id];}
function saveAll(){ try{ localStorage.setItem('cc_allChats_v159',JSON.stringify(allChats)); localStorage.setItem('cc_contacts_v159',JSON.stringify(contacts)); localStorage.setItem('cc_current_v159',currentContactId); }catch(e){ console.log('Storage full but media in IndexedDB'); localStorage.setItem('cc_allChats_v159',JSON.stringify(allChats)); } }

async function googleTranslate(text, targetCode){
  try{ const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetCode}&dt=t&q=${encodeURIComponent(text)}`; const res=await fetch(url); const data=await res.json(); let out=''; if(data&&data[0]){ data[0].forEach(s=>{ if(s[0]) out+=s[0]; }); } if(out&&out.toLowerCase()!==text.toLowerCase()) return out; }catch(e){}
  return null;
}
const OFFLINE={"Am good and you":{twi:"Me ho yɛ, na wo nso?"},"This is not fante":{twi:"Eyi nyɛ fante",fante:"Eyi nyɛ fante"}};
function offlineTranslate(text, langId){ const k=text.trim(); if(OFFLINE[k]&&OFFLINE[k][langId]) return OFFLINE[k][langId]; return null; }

async function renderMsgs(){
 const c=document.getElementById('msgs');c.innerHTML='';const langId=getLang();const msgs=getMsgs();
 for(const m of msgs){
  const d=document.createElement('div');d.className='bubble '+(m.from==='me'?'me':'them');
  let html=''; if(m.reply){html+=`<div style="border-left:3px solid #00a884;background:#00000030;padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:12.5px"><b>${m.reply.name}</b><br>${m.reply.text}</div>`;}
  if(m.type==='image'){ html+=`<img src="${m.url}" alt="pic"><div class="meta">${m.time} ✓✓</div>`; }
  else if(m.type==='video'){
    let src=m.url;
    if(m.mediaId && !m.url.startsWith('blob:')){
      const media=await getMedia(m.mediaId);
      if(media && media.blob){ src=URL.createObjectURL(media.blob); m.url=src; }
    }
    if(!src && m.mediaId){
      const media=await getMedia(m.mediaId);
      if(media && media.blob){ src=URL.createObjectURL(media.blob); m.url=src; }
    }
    if(src){ html+=`<video src="${src}" controls playsinline></video><div class="meta">${m.time} ✓✓ • Video picked same chat</div>`; }
    else { html+=`<div>📹 Loading video... ${m.name}</div><div class="meta">${m.time} ✓✓</div>`; }
  }
  else if(m.type==='audio'||m.type==='voice'){
    let src=m.url;
    if(m.mediaId && !src.startsWith('blob:')){
      const media=await getMedia(m.mediaId);
      if(media && media.blob){ src=URL.createObjectURL(media.blob); m.url=src; }
    }
    html+=`<audio src="${src}" controls style="width:200px"></audio><div class="meta">${m.dur||''} • ${m.time} ✓✓</div>`;
  }
  else if(m.type==='doc'){ html+=`📄 ${m.name}<div class="meta">${m.time} ✓✓</div>`; }
  else{
    const mainText = transON && m.displayText ? m.displayText : m.text;
    html+=`${mainText}<div class="meta">${m.time} ${m.from==='me'?'✓✓':''}</div>`;
    if(transON && m.original && m.original!==mainText){ html+=`<div class="orig">Original: ${m.original} • ${langId.toUpperCase()}</div>`; }
  }
  d.innerHTML=html; let timer; d.addEventListener('touchstart',()=>{timer=setTimeout(()=>openMsgMenu(m.id),500);}); d.addEventListener('touchend',()=>clearTimeout(timer)); d.addEventListener('contextmenu',e=>{e.preventDefault();openMsgMenu(m.id);}); c.appendChild(d);
 }
 c.scrollTop=c.scrollHeight;
}
function renderContacts(){
 const c=document.getElementById('contactList');c.innerHTML='';
 contacts.forEach(con=>{
  const div=document.createElement('div');div.className='card';
  div.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div class="avatar"><img src="${con.avatar}"></div><div><b>${con.name}</b><p>${con.number} • ${con.lang} • ${getMsgs(con.id).length} msgs</p></div></div><span style="color:#00a884;font-weight:800">›</span>`;
  div.onclick=()=>{ currentContactId=con.id; localStorage.setItem('cc_current_v159',con.id); document.getElementById('hName').textContent=con.name; document.getElementById('hSub').textContent=`${con.flag} ${con.lang} • Pick To Chat`; localStorage.setItem('cc_lang',con.lang.toLowerCase()); showScreen('chat'); renderMsgs(); };
  c.appendChild(div);
 });
}
renderContacts(); renderMsgs();

let typingTimer=null;
function onTyping(){
 const inp=document.getElementById('msgInput'); const val=inp.value.trim(); const has=val.length>0;
 document.getElementById('micBtn').style.display=has?'none':'grid'; document.getElementById('sendBtn').style.display=has?'grid':'none';
 inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,100)+'px';
 const live=document.getElementById('livePreview'); if(!has||!transON){ live.style.display='none'; return; }
 if(typingTimer) clearTimeout(typingTimer);
 live.style.display='block'; live.innerHTML=`🌍 Translating "${val}"...`;
 typingTimer=setTimeout(async()=>{
   let tr=offlineTranslate(val, getLang()); if(tr){ live.innerHTML=`🌍 Live ${getLang().toUpperCase()}: <b>${tr}</b> • will pick`; return; }
   const online=await googleTranslate(val, getLangCode()); if(online) live.innerHTML=`🌍 Live GOOGLE: <b>${online}</b> — will pick`;
 },400);
}
async function sendText(){
 const inp=document.getElementById('msgInput'); const raw=inp.value.trim(); if(!raw)return;
 let tr=offlineTranslate(raw, getLang()); if(!tr) tr=await googleTranslate(raw, getLangCode());
 const msgs=getMsgs();
 const newMsg={id:Date.now(),text:raw,displayText:tr||raw,original:raw,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:'me',translated:tr,lang:getLang()};
 if(replyTo){newMsg.reply={name:replyTo.from==='me'?'You':document.getElementById('hName').textContent,text:replyTo.text};cancelReply();}
 msgs.push(newMsg); allChats[currentContactId]=msgs; saveAll(); inp.value=''; onTyping(); renderMsgs(); document.getElementById('livePreview').style.display='none';
}
function toggleTrans(){transON=!transON;localStorage.setItem('cc_trans',transON?'ON':'OFF');document.getElementById('transBtn').textContent=transON?'🌍 ON':'🌍 OFF';renderMsgs();}

// RECORDING FIXED — NO BLOCK
let rec=null,chunks=[],st=0,tmr=null,isCancelled=false,startX=0;
const mic=document.getElementById('micBtn');
async function rStart(e){
  if(rec && rec.state==='recording') return;
  isCancelled=false; startX=e.touches?e.touches[0].clientX:e.clientX||0;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); chunks=[]; st=Date.now();
    rec.ondataavailable=ev=>{ if(ev.data.size>0) chunks.push(ev.data); };
    rec.onstop=async()=>{
      if(!isCancelled){
        const blob=new Blob(chunks,{type:'audio/webm'});
        const id=Date.now();
        await saveMedia(id, blob, 'voice.webm','audio');
        const url=URL.createObjectURL(blob);
        const msgs=getMsgs();
        msgs.push({id,mediaId:id,type:'voice',url,dur:Math.round((Date.now()-st)/1000),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:'me'});
        allChats[currentContactId]=msgs; saveAll(); renderMsgs();
      }
      stream.getTracks().forEach(t=>t.stop());
      mic.classList.remove('recording'); mic.textContent='🎙️';
      document.getElementById('livePreview').style.display='none';
      clearInterval(tmr); rec=null;
    };
    rec.start(); mic.classList.add('recording'); mic.textContent='🔴';
    tmr=setInterval(()=>{
      const sec=Math.round((Date.now()-st)/1000);
      const lp=document.getElementById('livePreview');
      lp.style.display='block'; lp.innerHTML=`🔴 Recording ${sec}s — release to send`;
      if(sec>90) rStop();
    },400);
  }catch{ alert('Allow mic'); mic.classList.remove('recording'); mic.textContent='🎙️'; }
}
function rStop(){
  if(!rec || rec.state!=='recording'){
    mic.classList.remove('recording'); mic.textContent='🎙️';
    document.getElementById('livePreview').style.display='none';
    clearInterval(tmr); rec=null; return;
  }
  rec.stop();
}
mic.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; });
mic.addEventListener('touchmove',e=>{
  if(!rec) return;
  const curX=e.touches[0].clientX;
  if(startX-curX>80){ document.getElementById('livePreview').innerHTML='❌ Cancel'; isCancelled=true; }
  else{ isCancelled=false; }
});
mic.addEventListener('pointerdown', rStart);
window.addEventListener('pointerup', rStop);

function openSheet(type){
 const opt=document.getElementById('sheetOptions');const title=document.getElementById('sheetTitle');opt.innerHTML='';
 if(type==='language'){title.textContent='Language';LANGS.forEach(l=>{const d=document.createElement('div');d.className='sheet-opt';d.innerHTML=`<div><b>${l.flag} ${l.name}</b></div><span style="color:#00a884">›</span>`;d.onclick=()=>{localStorage.setItem('cc_lang',l.id);document.getElementById('vLang').textContent=l.name;document.getElementById('hSub').textContent=`${l.flag} ${l.name} • Pick To Chat`;renderMsgs();closeSheet();};opt.appendChild(d);});}
 else if(type==='attach'){title.textContent='Attach — Pic/Video Picks Same Chat';opt.innerHTML=`<div class="attach-grid">
   <div class="attach-item" onclick="pick('img')"><div class="attach-icon" style="background:#007bfc">🖼️</div><small>Gallery</small></div>
   <div class="attach-item" onclick="pick('cam')"><div class="attach-icon" style="background:#00a884">📷</div><small>Camera</small></div>
   <div class="attach-item" onclick="pick('vid')"><div class="attach-icon" style="background:#a884ff">🎥</div><small>Video</small></div>
   <div class="attach-item" onclick="pick('doc')"><div class="attach-icon" style="background:#5f66cd">📄</div><small>Doc</small></div>
   <div class="attach-item" onclick="pick('aud')"><div class="attach-icon" style="background:#ff7f50">🎵</div><small>Audio</small></div>
 </div>`;}
 document.getElementById('sheet').style.display='block';
}
function closeSheet(){document.getElementById('sheet').style.display='none';}
function pick(k){closeSheet(); setTimeout(()=>{ if(k==='img') document.getElementById('imgInput').click(); if(k==='cam') document.getElementById('camInput').click(); if(k==='vid') document.getElementById('vidInput').click(); if(k==='doc') document.getElementById('docInput').click(); if(k==='aud') document.getElementById('audInput').click(); },120);}

async function handleFile(e,type){
  const f=e.target.files[0]; if(!f){ e.target.value=''; return; }
  const id=Date.now();
  if(type==='img'||type==='cam'){
    // compress image — no stretch
    const reader=new FileReader();
    reader.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        const max=720; let w=img.width,h=img.height;
        if(w>h){ if(w>max){ h=h*max/w; w=max; } }
        else{ if(h>max){ w=w*max/h; h=max; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.65);
        const msgs=getMsgs();
        msgs.push({id,type:'image',url:compressed,name:f.name,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:'me'});
        allChats[currentContactId]=msgs; saveAll(); renderMsgs();
        e.target.value='';
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  } else if(type==='vid'){
    // VIDEO FIX: save to IndexedDB — not localStorage
    if(f.size>80*1024*1024){ alert('Video too big — max 80MB'); e.target.value=''; return; }
    await saveMedia(id, f, f.name, 'video');
    const url=URL.createObjectURL(f);
    const msgs=getMsgs();
    msgs.push({id,mediaId:id,type:'video',url,name:f.name,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:'me'});
    allChats[currentContactId]=msgs; saveAll(); renderMsgs();
    e.target.value='';
  } else {
    await saveMedia(id, f, f.name, type);
    const url=URL.createObjectURL(f);
    const msgs=getMsgs();
    let obj={id,mediaId:id,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),from:'me',url,name:f.name};
    if(type==='doc') obj.type='doc'; else obj.type='audio';
    msgs.push(obj); allChats[currentContactId]=msgs; saveAll(); renderMsgs();
    e.target.value='';
  }
}
document.getElementById('imgInput').addEventListener('change',e=>handleFile(e,'img'));
document.getElementById('camInput').addEventListener('change',e=>handleFile(e,'cam'));
document.getElementById('vidInput').addEventListener('change',e=>handleFile(e,'vid'));
document.getElementById('docInput').addEventListener('change',e=>handleFile(e,'doc'));
document.getElementById('audInput').addEventListener('change',e=>handleFile(e,'aud'));

function openContactModal(){document.getElementById('contactModal').style.display='block';}
function closeContactModal(){document.getElementById('contactModal').style.display='none';}
async function autoPickContact(){const s=document.getElementById('autoStatus');s.textContent='Opening...';try{if('contacts' in navigator&&'ContactsManager' in window){const p=await navigator.contacts.select(['name','tel'],{multiple:false});if(p.length>0){document.getElementById('cName').value=p[0].name[0]||'';document.getElementById('cNumber').value=(p[0].tel[0]||'').replace(/\s/g,'');s.textContent='✓ Auto-filled';return;}}s.textContent='Not supported';}catch{s.textContent='Cancelled';}}
function saveContact(){const n=document.getElementById('cName').value.trim();const num=document.getElementById('cNumber').value.trim();const lang=document.getElementById('cLang').value.trim()||'Twi';if(!n||!num)return;const flag=LANGS.find(l=>l.name.toLowerCase()===lang.toLowerCase())?.flag||'🇬🇭';const id=n.toLowerCase().replace(/\s/g,'').slice(0,6)+Date.now().toString().slice(-3);contacts.push({id,name:n,number:num,lang,flag,avatar:`https://i.pravatar.cc/100?u=${Date.now()}`});allChats[id]=[{id:1,text:"Am good and you",displayText:"Me ho yɛ, na wo nso?",original:"Am good and you",time:"02:07 AM",from:"them"}];saveAll();renderContacts();closeContactModal();}
function openMsgMenu(id){longPressId=id;const m=document.getElementById('msgMenu');m.style.display='block';m.style.left='50%';m.style.top='45%';m.style.transform='translateX(-50%)';}
function closeMsgMenu(){document.getElementById('msgMenu').style.display='none';}
function replyMsg(){const msgs=getMsgs();const m=msgs.find(x=>x.id===longPressId);if(!m)return;replyTo=m;document.getElementById('replyBar').style.display='flex';document.getElementById('replyName').textContent=m.from==='me'?'You':document.getElementById('hName').textContent;document.getElementById('replyText').textContent=m.displayText||m.text||m.name;closeMsgMenu();document.getElementById('msgInput').focus();}
function cancelReply(){replyTo=null;document.getElementById('replyBar').style.display='none';}
function deleteMsg(){let msgs=getMsgs();msgs=msgs.filter(x=>x.id!==longPressId);allChats[currentContactId]=msgs;saveAll();renderMsgs();closeMsgMenu();}
function showScreen(s){document.getElementById('sChats').style.display=s==='chats'?'block':'none';document.getElementById('sChat').style.display=s==='chat'?'flex':'none';document.getElementById('sSettings').style.display=s==='settings'?'block':'none';document.getElementById('inputBar').style.display=s==='chat'?'flex':'none';document.getElementById('tChats').classList.toggle('active',s==='chats');document.getElementById('tChat').classList.toggle('active',s==='chat');document.getElementById('tSet').classList.toggle('active',s==='settings');if(s==='chat') renderMsgs();}
showScreen('chat'); renderContacts(); renderMsgs();
</script>
