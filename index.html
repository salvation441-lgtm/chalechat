<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHALECHAT GH</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{padding:12px 14px;background:linear-gradient(90deg,#CE1126,#FCD116,#006B3F);color:#000;font-weight:900;display:flex;justify-content:space-between;align-items:center}
#stat{font-size:11px;background:#000;color:#FCD116;padding:6px 12px;border-radius:20px;cursor:pointer}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 12px 20px;border-radius:18px;position:relative;word-break:break-word;user-select:none;cursor:pointer}
.me{align-self:flex-end;background:#FCD116;color:#000;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.m b{font-size:11px;opacity:.7;display:block}
.time{position:absolute;bottom:3px;right:10px;font-size:9px;opacity:.6}
.del{display:none;position:absolute;top:-8px;right:-8px;background:#ff3b30;color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;align-items:center;justify-content:center;cursor:pointer;border:2px solid #000}
.m.me.show-del .del{display:flex}
#typing{padding:0 14px 6px;font-size:12px;color:#FCD116;height:16px}
.bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;border-top:1px solid #222}
input.msg{flex:1;background:#222;border:1px solid #333;color:#fff;border-radius:24px;padding:14px 18px;outline:none}
button.send{border:0;border-radius:50%;width:50px;height:50px;background:#FCD116;font-size:22px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#151515;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:320px}
.box h3{margin:0 0 8px;font-size:16px}
.box p{margin:0 0 16px;color:#aaa;font-size:13px}
.box input{width:100%;background:#222;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;outline:none;margin-bottom:12px}
.box div{display:flex;gap:10px;justify-content:flex-end}
.box button{padding:10px 18px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btnCancel{background:#222;color:#fff}
.btnOk{background:#FCD116;color:#000}
.btnDel{background:#ff3b30;color:#fff}
</style>
</head>
<body>
<div class="top"><b>CHALECHAT 🇬🇭</b><span id="stat">Live • salvation</span></div>
<div id="chat"></div>
<div id="typing"></div>
<div class="bar"><input id="i" class="msg" placeholder="Type message..."><button class="send" id="b">➤</button></div>

<div id="nameModal" class="modal"><div class="box"><h3>Change your name</h3><input id="nameInput" placeholder="Enter new name"><div><button class="btnCancel" id="cancelName">Cancel</button><button class="btnOk" id="okName">Save</button></div></div></div>

<div id="delModal" class="modal"><div class="box"><h3>Delete message?</h3><p>This go delete am forever.</p><div><button class="btnCancel" id="cancelDel">Cancel</button><button class="btnDel" id="okDel">Delete</button></div></div></div>

<script>
const sb = supabase.createClient('https://gmdtjtznwsimcseurntt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZHRqdHpud3NpbWNzZXVybnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjgyMzUsImV4cCI6MjEwNzkwNDIzNX0.Atz_aml41ZXiAYSG0UFLpQLRqRpMsdVzauMpSuw-L8A');
let myName = localStorage.getItem('chale_name') || 'salvation';
let pendingDelId=null;
const chatEl=document.getElementById('chat'), statEl=document.getElementById('stat'), typingEl=document.getElementById('typing'), inputEl=document.getElementById('i');
const nameModal=document.getElementById('nameModal'), delModal=document.getElementById('delModal'), nameInput=document.getElementById('nameInput');

function fmt(d){try{return new Date(d).toLocaleTimeString('en-GH',{hour:'numeric',minute:'2-digit'})}catch{return''}}

async function load(){
 const {data}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
 chatEl.innerHTML='';
 data.forEach(m=>{
  const div=document.createElement('div'); 
  div.className='m '+(m.username===myName?'me':'other');
  div.innerHTML=`<b>${m.username}</b>${m.content}<span class="time">${fmt(m.created_at)}</span>${m.username===myName?`<button class="del" onclick="askDel('${m.id}')">×</button>`:''}`;
  chatEl.appendChild(div);
 });
 chatEl.scrollTop=chatEl.scrollHeight;
 // FIXED: No more fake "2 online" - just show you are live
 statEl.textContent=`Live • ${myName} ✏️`;
}
window.askDel=(id)=>{ pendingDelId=id; delModal.classList.add('show'); }
load();
sb.channel('chale-final4').on('postgres_changes',{event:'*',schema:'public',table:'messages'},load).subscribe();

// Typing - proper
const typeChannel = sb.channel('typing-chale4');
typeChannel.on('broadcast',{event:'typing'},p=>{ if(p.payload.user!==myName){ typingEl.textContent=`${p.payload.user} is typing...`; setTimeout(()=>typingEl.textContent='',2000); } }).subscribe();
inputEl.addEventListener('input',()=>{ typeChannel.send({type:'broadcast',event:'typing',payload:{user:myName}}); });

// Tap bubble to show X - like WhatsApp
chatEl.addEventListener('click',e=>{
 const bubble=e.target.closest('.m.me');
 if(e.target.classList.contains('del')) return;
 if(!bubble){ document.querySelectorAll('.m.show-del').forEach(b=>b.classList.remove('show-del')); return; }
 const isShowing=bubble.classList.contains('show-del');
 document.querySelectorAll('.m.show-del').forEach(b=>b.classList.remove('show-del'));
 if(!isShowing) bubble.classList.add('show-del');
});

// Modals - no browser popup
statEl.onclick=()=>{ nameInput.value=myName; nameModal.classList.add('show'); nameInput.focus(); };
document.getElementById('cancelName').onclick=()=>nameModal.classList.remove('show');
document.getElementById('okName').onclick=()=>{
 const n=nameInput.value.trim(); if(n){ myName=n; localStorage.setItem('chale_name',myName); load(); } nameModal.classList.remove('show');
};
document.getElementById('cancelDel').onclick=()=>{ delModal.classList.remove('show'); pendingDelId=null; };
document.getElementById('okDel').onclick=async()=>{
 if(pendingDelId){ await sb.from('messages').delete().eq('id',pendingDelId); pendingDelId=null; }
 delModal.classList.remove('show');
};
nameModal.onclick=e=>{ if(e.target===nameModal) nameModal.classList.remove('show'); };
delModal.onclick=e=>{ if(e.target===delModal){ delModal.classList.remove('show'); pendingDelId=null; } };

async function send(){
 const t=inputEl.value.trim(); if(!t) return;
 inputEl.value='';
 await sb.from('messages').insert({username:myName,content:t});
}
document.getElementById('b').onclick=send;
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
<!-- vFINAL4 - CLEAN -->
</body>
</html>
