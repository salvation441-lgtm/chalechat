<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChaleDAW V1 — Ghana Mobile DAW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;color:white;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#151515;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
.logo{font-weight:900;letter-spacing:1px}.logo span{color:#00e676}
.transport{display:flex;gap:8px;align-items:center}
.btn{padding:10px 18px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.play{background:#00e676;color:black}.stop{background:#333;color:white}.rec{background:#ff1744;color:white}.rec.on{animation:pulse .8s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.bpm{display:flex;align-items:center;gap:6px;background:#222;padding:6px 10px;border-radius:8px}
.bpm input{width:50px;background:transparent;border:none;color:white;font-weight:800;text-align:center}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tracks{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.track{background:#1a1a1a;border-radius:14px;padding:12px;border:1px solid #2a2a2a}
.track-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.track-name{font-weight:800;font-size:13px}.track-name.drums{color:#ffab40}.track-name.bass{color:#40c4ff}.track-name.keys{color:#b388ff}.track-name.vocals{color:#00e676}
.vol{width:80px}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.step{height:36px;border-radius:6px;background:#2a2a2a;border:none;cursor:pointer}
.step.active{background:#00e676}.step.active.kick{background:#ffab40}.step.active.snare{background:#40c4ff}.step.active.hihat{background:#fff}
.keys-grid{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}
.key{flex:0 0 44px;height:90px;border-radius:0 0 6px 6px;border:none;font-weight:800}
.white{background:white;color:black}.black{background:#111;color:white;height:60px;margin-left:-10px;margin-right:-10px;z-index:2;flex:0 0 26px}
.key.pressed{background:#00e676!important}
.vocal-wave{height:50px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px;border:1px dashed #333}
.piano-wrap{background:#111;border-top:1px solid #222;padding:10px}
.row{display:flex;justify-content:space-between;padding:6px 0}
</style>
</head>
<body>
<div class="header">
<div class="logo">CHALE<span>DAW</span> 🇬🇭</div>
<div class="transport">
<button class="btn play" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
<button class="btn stop" onclick="stopAll()">■ STOP</button>
<button class="btn rec" id="recBtn" onclick="toggleVocalRec()">● REC VOCAL</button>
<div class="bpm">BPM <input id="bpm" type="number" value="108" min="60" max="180" onchange="setBPM()"> </div>
</div>
</div>

<div class="screen">
<div class="tracks">
<div class="track">
<div class="track-head"><span class="track-name drums">🥁 DRUMS — 808</span><input class="vol" type="range" min="0" max="1" step="0.05" value="0.8" oninput="setVol('drums',this.value)"></div>
<div style="font-size:11px;color:#888;margin-bottom:6px">KICK</div><div class="steps" id="kickSteps"></div>
<div style="font-size:11px;color:#888;margin:6px 0">SNARE</div><div class="steps" id="snareSteps"></div>
<div style="font-size:11px;color:#888;margin:6px 0">HIHAT</div><div class="steps" id="hatSteps"></div>
</div>

<div class="track">
<div class="track-head"><span class="track-name bass">🎸 BASS</span><input class="vol" type="range" min="0" max="1" step="0.05" value="0.7" oninput="setVol('bass',this.value)"></div>
<div class="keys-grid" id="bassKeys"></div>
</div>

<div class="track">
<div class="track-head"><span class="track-name keys">🎹 KEYS — Amapiano</span><input class="vol" type="range" min="0" max="1" step="0.05" value="0.6" oninput="setVol('keys',this.value)"></div>
<div class="keys-grid" id="keysGrid"></div>
</div>

<div class="track">
<div class="track-head"><span class="track-name vocals">🎙️ VOCALS — Record</span><button class="btn" style="background:#222;color:#00e676;font-size:12px" onclick="playVocal()">PLAY VOCAL</button></div>
<div class="vocal-wave" id="vocalWave">No vocal yet — hit REC VOCAL and sing</div>
<audio id="vocalPlayer" controls style="width:100%;margin-top:8px;display:none"></audio>
</div>
</div>

<div class="piano-wrap">
<div class="row"><small style="color:#666">ChaleDAW V1 — Ghana Afrobeats DAW — 4 tracks • Web Audio • No laptop needed</small><small style="color:#00e676" id="beatPos">Bar 1 • Step 1</small></div>
</div>
</div>

<script>
let audioCtx=null;
let isPlaying=false, currentStep=0, timer=null;
let bpm=108;
let gains={drums:0.8,bass:0.7,keys:0.6,vocals:0.8};
let patterns={kick:Array(16).fill(0),snare:Array(16).fill(0),hat:Array(16).fill(0)};
patterns.kick[0]=1; patterns.kick[4]=1; patterns.kick[8]=1; patterns.kick[10]=1;
patterns.snare[4]=1; patterns.snare[12]=1;
patterns.hat=[1,0,1,0,1,0,1,0];

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }

function setVol(t,v){ gains[t]=parseFloat(v); }
function setBPM(){ bpm=parseInt(document.getElementById('bpm').value)||108; if(isPlaying){ stopAll(); togglePlay(); } }

function makeSteps(id, type){
 const c=document.getElementById(id); c.innerHTML='';
 for(let i=0;i<16;i++){
  const b=document.createElement('button'); b.className='step'+(patterns[type][i]?' active '+type:'');
  b.onclick=()=>{ patterns[type][i]=patterns[type][i]?0:1; b.classList.toggle('active'); b.classList.toggle(type); if(patterns[type][i]) playSound(type); };
  c.appendChild(b);
 }
}
makeSteps('kickSteps','kick'); makeSteps('snareSteps','snare'); makeSteps('hatSteps','hihat');

function playSound(type, note=0){
 initAudio();
 const g=audioCtx.createGain(); g.gain.value=gains.drums; g.connect(audioCtx.destination);
 if(type==='kick'){
  const o=audioCtx.createOscillator(); const gg=audioCtx.createGain();
  o.frequency.setValueAtTime(150,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
  gg.gain.setValueAtTime(1,audioCtx.currentTime); gg.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
  o.connect(gg); gg.connect(g); o.start(); o.stop(audioCtx.currentTime+0.4);
 }
 if(type==='snare'){
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*0.2,audioCtx.sampleRate);
  const data=buffer.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  const src=audioCtx.createBufferSource(); src.buffer=buffer; src.connect(g); src.start();
 }
 if(type==='hihat'){
  const o=audioCtx.createOscillator(); o.type='square'; o.frequency.value=8000;
  const gg=audioCtx.createGain(); gg.gain.setValueAtTime(0.3,audioCtx.currentTime); gg.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.08);
  o.connect(gg); gg.connect(g); o.start(); o.stop(audioCtx.currentTime+0.08);
 }
}

function playKeys(freq, type='keys'){
 initAudio();
 const g=audioCtx.createGain(); g.gain.value=type==='bass'?gains.bass:gains.keys; g.connect(audioCtx.destination);
 const o=audioCtx.createOscillator(); o.type=type==='bass'?'sawtooth':'triangle'; o.frequency.value=freq;
 const gg=audioCtx.createGain(); gg.gain.setValueAtTime(0.7,audioCtx.currentTime); gg.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8);
 o.connect(gg); gg.connect(g); o.start(); o.stop(audioCtx.currentTime+0.8);
}

const NOTES=[{n:'C3',f:130.81},{n:'D3',f:146.83},{n:'E3',f:164.81},{n:'F3',f:174.61},{n:'G3',f:196},{n:'A3',f:220},{n:'B3',f:246.94},{n:'C4',f:261.63},{n:'D4',f:293.66},{n:'E4',f:329.63},{n:'F4',f:349.23},{n:'G4',f:392}];
function buildKeys(id, type){
 const c=document.getElementById(id); c.innerHTML='';
 NOTES.forEach(o=>{
  const b=document.createElement('button'); b.className='key white'; b.textContent=o.n;
  b.onpointerdown=()=>{ b.classList.add('pressed'); playKeys(o.f,f*2); };
  b.onpointerup=()=>b.classList.remove('pressed');
  c.appendChild(b);
 });
}
buildKeys('bassKeys','bass'); buildKeys('keysGrid','keys');

function togglePlay(){
 initAudio();
 if(isPlaying){ isPlaying=false; clearInterval(timer); document.getElementById('playBtn').textContent='▶ PLAY'; return; }
 isPlaying=true; document.getElementById('playBtn').textContent='⏸ PAUSE';
 const interval=60000/bpm/4;
 timer=setInterval(()=>{
  if(patterns.kick[currentStep]) playSound('kick');
  if(patterns.snare[currentStep]) playSound('snare');
  if(patterns.hat[currentStep]) playSound('hihat');
  document.getElementById('beatPos').textContent=`Bar ${Math.floor(currentStep/4)+1} • Step ${currentStep+1}`;
  document.querySelectorAll('.steps').forEach(g=>{ [...g.children].forEach((el,i)=>{ el.style.outline=i===currentStep?'2px solid #00e676':''; }); });
  currentStep=(currentStep+1)%16;
 },interval);
}
function stopAll(){ isPlaying=false; clearInterval(timer); currentStep=0; document.getElementById('playBtn').textContent='▶ PLAY'; document.getElementById('beatPos').textContent='Bar 1 • Step 1'; document.querySelectorAll('.step').forEach(el=>el.style.outline=''); }

// VOCAL REC — use your previous fix
let mediaRec=null, chunks=[], vocalBlob=null;
async function toggleVocalRec(){
 const btn=document.getElementById('recBtn'); const wave=document.getElementById('vocalWave');
 if(mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); btn.classList.remove('on'); btn.textContent='● REC VOCAL'; wave.textContent='Processing vocal...'; return; }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec=new MediaRecorder(stream); chunks=[];
  mediaRec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  mediaRec.onstop=()=>{
   vocalBlob=new Blob(chunks,{type:'audio/webm'});
   const url=URL.createObjectURL(vocalBlob);
   const player=document.getElementById('vocalPlayer'); player.src=url; player.style.display='block';
   wave.textContent='🔥 Vocal recorded — hit PLAY VOCAL';
   stream.getTracks().forEach(t=>t.stop());
  };
  mediaRec.start(); btn.classList.add('on'); btn.textContent='■ STOP REC'; wave.textContent='🔴 Recording vocal — sing now!';
 }catch{ alert('Allow mic'); }
}
function playVocal(){ const p=document.getElementById('vocalPlayer'); if(p.src) p.play(); }
</script>
</body>
</html>
