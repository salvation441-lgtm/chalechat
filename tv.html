<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Real Fix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:10}
.logo-s{width:48px;height:48px;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px gold;font-weight:900;font-size:22px}
.video-wrap{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:52vh}
.video-wrap iframe{width:100%;height:100%;border:0}
.tabs{display:flex;gap:10px;padding:12px;overflow:auto}
.tab{padding:10px 22px;border-radius:24px;background:#121612;color:#9aa79a;border:1px solid #333;cursor:pointer;white-space:nowrap}
.tab.active{background:#00FF88;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.14);border-radius:16px;padding:12px;cursor:pointer;text-align:center}
.thumb{height:60px;background:#1e341e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px}
.note{padding:8px 16px;font-size:11px;color:#00FF88;text-align:center}
</style>
</head>
<body>
<div class="header">
<div class="logo-s">S</div>
<div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">GHANA INSIDE APP - REAL FIX</p></div>
<div style="margin-left:auto;border:1px solid #00FF88;color:#00FF88;padding:6px 14px;border-radius:20px;font-size:12px">● LIVE</div>
</div>

<div class="video-wrap">
<iframe id="player" src="https://www.youtube-nocookie.com/embed/JGwWNGJdvx8?autoplay=1&mute=1&origin=https://on441-lgtm.github.io&modestbranding=1&rel=0" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>
<p class="note" id="status">Playing: FIFA TV • No Block Mode</p>

<div class="tabs">
<div class="tab active" onclick="showTab('all',this)">All</div>
<div class="tab" onclick="showTab('ghana',this)">Ghana (No Block)</div>
<div class="tab" onclick="showTab('sports',this)">Sports</div>
</div>

<div class="grid" id="grid"></div>

<script>
const origin = "https://on441-lgtm.github.io";
const yt = (id) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&origin=${origin}&modestbranding=1&rel=0&enablejsapi=1`;

const ghanaChannels=[
{name:"UTV Ghana",icon:"📡",type:"ghana",embed:"https://liveghanatv.com/embed/utv-ghana/",isYT:false},
{name:"GTV Ghana",icon:"📺",type:"ghana",embed:"https://liveghanatv.com/embed/gtv-ghana/",isYT:false},
{name:"Adom TV",icon:"🎬",type:"ghana",embed:"https://liveghanatv.com/embed/adom-tv/",isYT:false},
{name:"TV3 Ghana",icon:"🌟",type:"ghana",embed:"https://liveghanatv.com/embed/tv3-ghana/",isYT:false},
{name:"GHOne TV",icon:"🔥",type:"ghana",embed:"https://liveghanatv.com/embed/gh-one-tv/",isYT:false},
];

const sportsChannels=[
{name:"FIFA TV",icon:"⚽",type:"sports",embed:yt("JGwWNGJdvx8"),isYT:true},
{name:"SuperSport",icon:"🏆",type:"sports",embed:yt("86YLFOog4GM"),isYT:true},
{name:"ESPN Africa",icon:"🏈",type:"sports",embed:yt("5qap5aO4i9A"),isYT:true},
];

let current='all';
function showTab(cat,el){
 current=cat;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
 render();
}
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 let list = current==='ghana'? ghanaChannels : current==='sports'? sportsChannels : [...ghanaChannels,...sportsChannels];
 list.forEach(ch=>{
  const d=document.createElement('div');d.className='card';
  d.onclick=()=>{
    document.getElementById('player').src=ch.embed;
    document.getElementById('status').textContent = ch.isYT ? `Playing: ${ch.name} • YouTube No-Cookie (No Block)` : `Playing: ${ch.name} • LiveGhanaTV (No Block)`;
    window.scrollTo({top:0,behavior:'smooth'});
  };
  d.innerHTML=`<div class="thumb">${ch.icon}</div><h3 style="font-size:13px">${ch.name}</h3><p style="font-size:10px;color:#7a8a7a">${ch.type==='ghana'?'Real Live • No Block':'Sports • No Block'}</p>`;
  g.appendChild(d);
 });
}
render();
</script>
</body>
</html>
