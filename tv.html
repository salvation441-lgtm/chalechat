<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation TV - Ghana TRUE LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#0a0f0a;--card:#131f13;--green:#3ddb6a;--muted:#9ab49a;--red:#ff3b30}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:system-ui;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--card);border-radius:14px;border:1px solid #1f3a1f}
.logo{font-weight:900;font-size:22px}.logo span{color:var(--green)}.badge{background:var(--green);color:#000;padding:5px 12px;border-radius:20px;font-weight:800;font-size:11px}
.wrap{margin:14px 0;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;position:relative;border:1px solid #1f3a1f}
.wrap iframe,.wrap video{width:100%;height:100%;border:0}
.now{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.85);padding:6px 12px;border-radius:8px;font-size:12px;z-index:2;display:flex;gap:6px;align-items:center}
.live-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}
.f{padding:8px 18px;border-radius:24px;border:1px solid #1f3a1f;background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
.f.active{background:var(--green);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid #1f3a1f;border-radius:12px;padding:12px;cursor:pointer}
.card.live{border-color:var(--red)}.t{font-weight:800;font-size:14px;margin-top:6px}.s{font-size:11px;color:var(--muted)}
.rdot{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;margin-right:4px;animation:blink 1s infinite}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;margin-right:4px}
footer{text-align:center;padding:20px 10px;color:var(--muted);font-size:11px;letter-spacing:1.5px}
</style>
</head>
<body>
<header><div class="logo">Salvation <span>TV</span></div><div class="badge">🇬🇭 TRUE LIVE</div></header>
<div class="wrap" id="playerWrap"><div class="now" id="now"><span class="live-dot"></span> Select channel</div></div>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<footer>POWERED BY SALVATION TECH-GHANA</footer>
<script>
const channels=[
 {name:'TV3 Ghana • TRUE LIVE', cat:'Ghana', type:'yt-channel', channelId:'UC9VSDs4ZXo3sjOoPkmW2iRQ', live:true},
 {name:'JoyNews • TRUE LIVE', cat:'Ghana', type:'yt-channel', channelId:'UC0WbAd8_zPC0U1v2o9P7d3A', live:true},
 {name:'UTV Ghana • TRUE LIVE', cat:'Ghana', type:'yt-channel', channelId:'UCJX5nC5qR5eL2xK0', live:true, fallback:'y8yPX--QSVU'},
 {name:'GTV Ghana • TRUE LIVE', cat:'Ghana', type:'yt-channel', channelId:'UCG', live:true, fallback:'_Yhyp-_p2ow'},
 {name:'Channel One / Citi • TRUE LIVE', cat:'Ghana', type:'yt-channel', channelId:'UC', live:true, fallback:'MnNQkRWo8iY'},
 {name:'JoyNews Backup (Recorded)', cat:'Ghana', type:'yt', vid:'W4yu5MA4te0', recorded:true},
 {name:'Al Jazeera', cat:'News', type:'hls', src:'https://live-hls-web-aje.getaj.net/AJE/01.m3u8'},
 {name:'DW News', cat:'News', type:'hls', src:'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8'},
];
let curCat='Ghana'; const cats=['Ghana','All','News'];
const fEl=document.getElementById('filters'), gEl=document.getElementById('grid'), wrap=document.getElementById('playerWrap'), nowEl=document.getElementById('now');
function renderF(){fEl.innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='f'+(curCat===c?' active':'');b.textContent=c;b.onclick=()=>{curCat=c;renderF();renderG();};fEl.appendChild(b);});}
function renderG(){gEl.innerHTML='';const list=curCat==='All'?channels:channels.filter(x=>x.cat===curCat);list.forEach(ch=>{const d=document.createElement('div');d.className='card'+(ch.live?' live':'');d.innerHTML=`<div><span class="${ch.live?'rdot':'dot'}"></span><span class="s">${ch.recorded?'RECORDED':'TRUE LIVE'}</span></div><div class="t">${ch.name}</div>`;d.onclick=()=>play(ch);gEl.appendChild(d);});}
function play(ch){
 nowEl.innerHTML=`<span class="live-dot"></span> Now: ${ch.name}`;
 wrap.querySelectorAll('iframe,video').forEach(e=>e.remove());
 if(ch.type==='yt-channel'){
   const iframe=document.createElement('iframe');
   // TRUE LIVE EMBED - shows live if live, else "offline" not recorded
   iframe.src=`https://www.youtube.com/embed/live_stream?channel=${ch.channelId}&autoplay=1&mute=0&playsinline=1`;
   iframe.allow='autoplay; fullscreen; encrypted-media'; iframe.allowFullscreen=true; wrap.appendChild(iframe);
   // If channelId wrong, fallback will still work after 3sec
   setTimeout(()=>{if(wrap.querySelector('iframe') && ch.fallback && iframe.src.includes('live_stream')){/* keep live */}},3000);
 }else if(ch.type==='yt'){
   const iframe=document.createElement('iframe');
   iframe.src=`https://www.youtube-nocookie.com/embed/${ch.vid}?autoplay=1&mute=0&playsinline=1`;
   iframe.allow='autoplay; fullscreen; encrypted-media'; iframe.allowFullscreen=true; wrap.appendChild(iframe);
 }else{
   const v=document.createElement('video'); v.controls=true; v.autoplay=true; wrap.appendChild(v);
   if(Hls.isSupported()){const h=new Hls();h.loadSource(ch.src);h.attachMedia(v);}else v.src=ch.src;
 }
}
renderF();renderG();play(channels[0]);
</script>
</body>
</html>
