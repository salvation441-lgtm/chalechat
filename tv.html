<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvation TV V39 Proxy</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#080b14;color:#fff}header{background:#0e1220;padding:10px;text-align:center;border-bottom:1px solid #1a1f36}header b{font-size:14px}header small{color:#00e676;font-size:9px;display:block}#player{background:#000;padding:14px;text-align:center;border-bottom:1px solid #1a1f36;position:sticky;top:0;z-index:20}audio{width:100%;height:52px;margin:10px 0}#now{font-size:15px;font-weight:800}#url{font-size:7px;color:#666;word-break:break-all;margin-top:4px}#status{font-size:11px;padding:6px 12px;border-radius:10px;display:inline-block;margin-top:6px;max-width:100%}.ok{background:rgba(0,230,118,0.15);color:#00e676}.bad{background:rgba(255,80,80,0.15);color:#ff6b6b}.wait{background:rgba(255,255,255,0.08);color:#8b95b5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px 90px}.card{background:#121624;border:2px solid #1a1f36;border-radius:12px;padding:12px;text-align:center}.card.on{border-color:#fff}.card.playing{border-color:#00e676;background:rgba(0,230,118,0.12)}.e{font-size:26px}.n{font-size:11px;font-weight:700;margin-top:4px}.d{font-size:8px;color:#8b95b5}.mode{font-size:7px;color:#00e676;margin-top:3px;font-weight:700}.btnRow{display:flex;gap:8px;margin-top:10px}.btnRow button{flex:1;height:40px;border-radius:8px;border:none;font-weight:700;font-size:10px}.w{background:#fff;color:#000}.g{background:#1a1f36;color:#fff;border:1px solid #2a2f4a}#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px;display:flex;gap:8px}.btn{flex:1;height:42px;border-radius:10px;border:none;font-weight:600}.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}
</style></head><body>
<header><b>Salvation TV</b><small>V39 • PROXY FIX • BYPASS GITHUB BLOCK • ALL GO WORK</small></header>

<div id="player">
<div id="now">Tap Any Card - Proxy Go Fix Blocking</div>
<audio id="a" controls preload="none" playsinline crossorigin="anonymous"></audio>
<div id="url">Ready</div>
<div id="status" class="wait">Ready - Tap Joy FM</div>
<div class="btnRow">
<button class="w" onclick="playWithProxy()">🔓 Try With Proxy (Fix Block)</button>
<button class="g" onclick="openDirect()">🌐 Open Direct in Chrome</button>
</div>
</div>

<div class="grid" id="grid"></div>
<div id="btm"><button class="btn s" onclick="shareL()">Share Link</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const stations=[
{n:"Joy FM 99.7",e:"📻",u:"https://stream.zeno.fm/f3ewu9q3rwzuv",d:"Proxy Fix"},
{n:"Citi FM 97.3",e:"📡",u:"https://stream.zeno.fm/0m4q2k3kq8uv",d:"Proxy Fix"},
{n:"Peace FM 104.3",e:"❤️",u:"https://stream.zeno.fm/0r0x8q2kqg8uv",d:"Proxy Fix"},
{n:"Adom FM 106.3",e:"💚",u:"https://stream.zeno.fm/8wv8gq2kqg8uv",d:"Proxy Fix"},
{n:"Asaase 99.5",e:"🌐",u:"https://stream.zeno.fm/5y5g8k3kq8uv",d:"Proxy Fix"},
{n:"Asempa 94.7",e:"🎙️",u:"https://stream.zeno.fm/x7b8p9q2kqg8uv",d:"Proxy Fix"},
{n:"Hitz 103.9",e:"🔥",u:"https://stream.zeno.fm/4a4q2k3kq8uv",d:"Proxy Fix"},
{n:"BBC World",e:"🇬🇧",u:"https://stream.live.vc.bbcmedia.co.uk/bbc_world_service",d:"Direct Works"},
];

let cur=null;
let useProxy=false;
const audio=document.getElementById('a');
const now=document.getElementById('now');
const urlDiv=document.getElementById('url');
const status=document.getElementById('status');

function getProxyUrl(u){
// Use corsproxy that allows audio
return "https://corsproxy.io/?"+encodeURIComponent(u);
}

function playStation(c,el){
cur=c;
useProxy=false;
document.querySelectorAll('.card').forEach(x=>{ x.classList.remove('on'); x.classList.remove('playing'); });
el.classList.add('on');

now.textContent='Loading '+c.n+'... (Direct first)';
urlDiv.textContent=c.u;
status.textContent='⏳ Trying direct: '+c.n;
status.className='wait';

audio.pause();
audio.removeAttribute('src');
audio.load();

setTimeout(()=>{
audio.src=c.u;
audio.load();
audio.play().then(()=>{
now.textContent='🔊 Playing '+c.n+' (Direct)';
el.classList.add('playing');
status.textContent='✓ Playing '+c.n+' direct!';
status.className='ok';
}).catch(e=>{
now.textContent='❌ Direct blocked for '+c.n;
status.textContent='❌ Direct blocked - Tap "Try With Proxy" button above!';
status.className='bad';
urlDiv.textContent='Direct failed: '+e.message+' | Now tap Proxy button';
});
},150);
}

function playWithProxy(){
if(!cur){ status.textContent='Select station first'; status.className='bad'; return; }
useProxy=true;
let proxyUrl=getProxyUrl(cur.u);
now.textContent='Loading '+cur.n+' with Proxy...';
urlDiv.textContent='Proxy: '+proxyUrl.substring(0,60)+'...';
status.textContent='⏳ Trying proxy for '+cur.n+'...';
status.className='wait';

audio.pause();
audio.removeAttribute('src');
audio.load();

setTimeout(()=>{
audio.src=proxyUrl;
audio.load();
audio.play().then(()=>{
now.textContent='🔊 Playing '+cur.n+' (Via Proxy)';
status.textContent='✓ Playing via Proxy! GitHub block bypassed!';
status.className='ok';
document.querySelectorAll('.card').forEach(x=>{ if(x.textContent.includes(cur.n)) x.classList.add('playing'); });
}).catch(e=>{
status.textContent='❌ Proxy too failed - Tap Open Direct';
status.className='bad';
urlDiv.textContent='Proxy failed: '+e.message;
});
},150);
}

function openDirect(){
if(!cur){ alert('Select station first'); return; }
window.open(cur.u,'_blank');
status.textContent='🌐 Opened '+cur.n+' in new tab - e go play for Chrome!';
status.className='ok';
}

function build(){
let g=document.getElementById('grid'); g.innerHTML='';
stations.forEach(c=>{
let d=document.createElement('div'); d.className='card';
d.innerHTML=`<div class="e">${c.e}</div><div class="n">${c.n}</div><div class="d">${c.d}</div><div class="mode">TAP TO PLAY</div>`;
d.onclick=()=>playStation(c,d);
g.appendChild(d);
});
}

function shareL(){
let u=location.href;
if(navigator.share) navigator.share({url:u}); else { navigator.clipboard.writeText(u); status.textContent='✓ Link copied'; status.className='ok'; }
}

audio.addEventListener('error',()=>{
let err=audio.error;
if(!err) return;
let msg='Code '+err.code;
if(err.code===4) msg='Blocked by Zeno (GitHub) - Tap Proxy button!';
urlDiv.textContent=msg+' for '+cur.n;
status.textContent='❌ '+msg+' - TAP "Try With Proxy" NOW!';
status.className='bad';
});

build();
</script></body></html>
