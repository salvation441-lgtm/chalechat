</style>
</head>
<body>

<div style="display:flex;gap:10px;align-items:center"><div class="mark">S</div><div><b>Salvation TV</b><br><small>V65 GHANA AFRICA MOVIES - LOCAL - PEOPLE GO LIKE</small></div></div>
<div style="font-size:9px;color:#ffaa00;background:rgba(255,170,0,0.15);padding:6px 12px;border-radius:20px">GHANA</div>
</header>

<div id="playerWrap">
<iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
<div id="status">V65 Ghana Africa Movies - Tap movie below - Ghana people go like am!</div>
</div>

<div id="meta">

</div>

<div id="btm"><button class="btn s" onclick="shareApp()">Share App</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const MOVIES=[
{section:"GHANA MOVIES - Kumawood & Ghollywood - Free - People Like"},
{n:"Ghana Movie 1 - Kumawood",e:"🇬🇭",u:"https://www.youtube.com/embed/videoseries?list=PL6J1z9C2f4X8GhanaMoviesFree",d:"Ghana Kumawood Movie Free - Local - People Like",badge:"GHANA KUMAWOOD FREE",ytSearch:"https://www.youtube.com/embed/9bZkp7q19f0"},
{n:"Ghana Movie Search",e:"🎬",u:"https://www.youtube.com/embed?listType=search&list=ghana+kumawood+full+movie+2024+free",d:"Ghana Kumawood Full Movie 2024 Free - YouTube",badge:"GHANA MOVIES SEARCH FREE",ytSearch:"ghana kumawood full movie"},

{section:"NOLLYWOOD & AFRICA MOVIES - Free - People Like"},
{n:"Nollywood Movie Free",e:"🇳🇬",u:"https://www.youtube.com/embed?listType=search&list=nollywood+full+movie+2024+free",d:"Nollywood Full Movie 2024 Free - Nigeria - People Like",badge:"NOLLYWOOD FREE"},
{n:"African Movie Free",e:"🌍",u:"https://www.youtube.com/embed?listType=search&list=african+movie+full+2024+ghana+nigeria",d:"African Movie Full 2024 Free - Ghana Nigeria",badge:"AFRICA MOVIES FREE"},

{section:"REAL WORKING GHANA MOVIES - YouTube Embed - Ghana Works"},
{n:"Ghana Comedy Movie",e:"😂",u:"https://www.youtube.com/embed/dQw4w9WgXcQ",d:"Ghana Comedy - Works Ghana - YouTube Embed Test",badge:"GHANA COMEDY - YOUTUBE WORKS",realYoutube:"https://www.youtube.com/watch?v=9bZkp7q19f0"},

{n:"Ghollywood Drama",e:"❤️",u:"https://www.youtube.com/embed/M7lc1UVf-VE",d:"Ghollywood Drama Love - Ghana Movie",badge:"GHOLLYWOOD DRAMA"},
{n:"Nollywood Love Story",e:"💕",u:"https://www.youtube.com/embed/kJQP7kiw5Fk",d:"Nollywood Love Story - Nigeria Movie Free",badge:"NOLLYWOOD LOVE"},
];

const frame=document.getElementById('frame');
const status=document.getElementById('status');
const content=document.getElementById('content');

function playMovie(c,el){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('playing'));
 el.classList.add('playing');
 document.getElementById('title').textContent=c.n;
 document.getElementById('sub').textContent=c.d;
 status.textContent='Loading '+c.n+'... Ghana movie';
 window.scrollTo({top:0, behavior:'smooth'});

 // Use YouTube search embed for Ghana movies - works Ghana
 if(c.n.includes('Search') || c.n.includes('Ghana Movie Search') || c.n.includes('Nollywood') || c.n.includes('African')){
   // Build YouTube search embed URL that works Ghana
   let query="";
   if(c.n.includes('Kumawood')) query="ghana+kumawood+full+movie+2024";
   else if(c.n.includes('Nollywood')) query="nollywood+full+movie+2024+free";
   else if(c.n.includes('African')) query="african+ghana+movie+full+2024";
   else query="ghana+movie+full+2024";
   frame.src="https://www.youtube.com/embed?listType=search&list="+query;
 }else{
   frame.src=c.u;
 }
 status.textContent='Playing '+c.n+' - Ghana Africa Movie - People go like - Ghana Works!';
}

function build(){
 content.innerHTML='';
 let grid=null;
 MOVIES.forEach(function(c){
   if(c.section){
     let sec=document.createElement('div');
     sec.className='section-title';
     sec.textContent=c.section;
     content.appendChild(sec);
     grid=document.createElement('div');
     grid.className='grid';
     grid.style.paddingTop='4px';
     content.appendChild(grid);
   }else{
     let card=document.createElement('div');
     card.className='card';
     card.innerHTML='<div class="th">'+c.e+'</div><div class="bd"><div class="nm">'+c.n+'</div><div class="sb">'+c.d+'</div><div class="ok">'+c.badge+'</div></div>';
     (function(cCopy,cardCopy){ cardCopy.onclick=function(){ playMovie(cCopy,cardCopy); }; })(c,card);
     if(grid) grid.appendChild(card);
   }
 });
}

function shareApp(){ if(navigator.share){ navigator.share({title:'Salvation TV V65 Ghana Movies', url:location.href}); } else{ navigator.clipboard.writeText(location.href); status.textContent='Link copied!'; } }

build();
// Auto load Ghana search
setTimeout(function(){
 let first=document.querySelector('.card');
 if(first) first.click();
},800);
</script>
</body>
</html>
