<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation TV V52 General Football Clean</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080b14;color:#fff}
header{background:#0e1220;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1f36}
.mark{width:30px;height:30px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
header b{font-size:13px}header small{font-size:8px;color:#8b95b5}
#player{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center}
iframe{width:100%;height:100%;background:#000;border:none}
#meta{padding:10px 12px;background:#0e1220;border-bottom:1px solid #1a1f36}
#meta h2{font-size:14px}#meta p{font-size:10px;color:#8b95b5;margin-top:3px}
#tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #1a1f36}
.tab{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #1a1f36;background:#121624;color:#8b95b5;font-size:10px;cursor:pointer;flex-shrink:0}
.tab.on{color:#fff;font-weight:700;background:#00ff88;color:#000;border-color:#00ff88}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 90px}
.card{background:#121624;border:2px solid #1a1f36;border-radius:12px;overflow:hidden;cursor:pointer}
.card.playing{border-color:#00ff88;background:rgba(0,255,136,0.12)}
.th{height:42px;background:#1a1f36;display:flex;align-items:center;justify-content:center;font-size:18px}
.bd{padding:7px}.nm{font-size:10px;font-weight:700}.sb{font-size:8px;color:#8b95b5}.ok{font-size:7px;font-weight:700;margin-top:2px;color:#00ff88}
#status{position:absolute;bottom:6px;left:8px;right:8px;font-size:9px;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:8px;text-align:center;z-index:10}
#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px 12px;display:flex;gap:8px}
.btn{flex:1;height:42px;border-radius:10px;border:none;font-weight:600;font-size:11px}
.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}
.section-title{padding:12px 12px 4px;font-size:11px;font-weight:700;color:#00ff88;text-transform:uppercase}
</style>
</head>
<body>
<header>
<div style="display:flex;gap:8px;align-items:center"><div class="mark">S</div><div><b>Salvation TV</b><br><small>V52 CLEAN GENERAL FOOTBALL GHANA WORKS</small></div></div>
<div style="font-size:9px;color:#00ff88;background:rgba(0,255,136,0.15);padding:5px 10px;border-radius:12px">FOOTBALL</div>
</header>

<div id="player">
<iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.fifa.com/fifaplus/en/live"></iframe>
<div id="status">V52 Clean - General Football - No hidden unicode</div>
</div>

<div id="meta"><h2 id="title">General Football - All Leagues</h2><p id="sub">Not only Black Stars - Premier League, La Liga, Serie A, UCL, GPL - All Free - Ghana Works</p></div>

<div id="tabs">
<button class="tab on">Football General</button>
</div>

<div id="content"></div>

<div id="btm"><button class="btn s" onclick="navigator.clipboard.writeText(location.href)">Share Link</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const DB=[
  {section:"LIVE MATCHES FREE - Works Ghana"},
  {n:"FIFA+ Live",e:"TROPHY",u:"https://www.fifa.com/fifaplus/en/live",d:"FIFA Official - World Cup Qualifiers LIVE FREE",badge:"FIFA+ LIVE FREE OFFICIAL"},
  {n:"CAF TV Live",e:"AFRICA",u:"https://www.cafonline.com/caf-tv/",d:"AFCON, CHAN, Champions League Africa FREE",badge:"AFRICA LIVE FREE"},
  {n:"Ghana FA",e:"GHANA",u:"https://ghanafa.org/",d:"Ghana Premier League, Black Stars FREE",badge:"GPL & BLACK STARS FREE"},

  {section:"PREMIER LEAGUE, LA LIGA, SERIE A - Highlights Free"},
  {n:"Premier League",e:"EPL",u:"https://www.premierleague.com/en/news",d:"EPL Official - Highlights FREE",badge:"EPL FREE"},
  {n:"LaLiga",e:"LALIGA",u:"https://www.laliga.com/en-GB/laliga-easports",d:"Real Madrid, Barca Highlights FREE",badge:"LALIGA FREE"},
  {n:"Serie A",e:"SERIEA",u:"https://www.legaseriea.it/en",d:"Inter, Juventus Highlights FREE",badge:"SERIE A FREE"},
  {n:"Bundesliga",e:"BUNDES",u:"https://www.bundesliga.com/en/bundesliga",d:"Bayern, Dortmund FREE",badge:"BUNDESLIGA FREE"},

  {section:"CHAMPIONS LEAGUE & EUROPE"},
  {n:"UEFA UCL",e:"UCL",u:"https://www.uefa.com/uefachampionsleague/",d:"Champions League Highlights FREE",badge:"UCL FREE"},
  {n:"BBC Football News",e:"NEWS",u:"https://www.bbc.com/sport/football",d:"Transfer News, General Matters FREE",badge:"BBC NEWS FREE"},
  {n:"Live Scores",e:"SCORES",u:"https://www.goal.com/en/live-scores",d:"Live Scores All Leagues FREE",badge:"LIVE SCORES FREE"}
];

const frame=document.getElementById('frame');
const status=document.getElementById('status');
const content=document.getElementById('content');

function autoPlay(c,el){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('playing'));
 el.classList.add('playing');
 document.getElementById('title').textContent=c.n;
 document.getElementById('sub').textContent=c.d;
 status.textContent='Loading '+c.n+'... General Football';
 frame.src=c.u;
 window.scrollTo({top:0, behavior:'smooth'});
}

function build(){
 content.innerHTML='';
 let grid=null;
 DB.forEach((c)=>{
   if(c.section){
     let sec=document.createElement('div');
     sec.className='section-title';
     sec.textContent=c.section;
     content.appendChild(sec);
     grid=document.createElement('div');
     grid.className='grid';
     grid.style.paddingTop='4px';
     content.appendChild(grid);
   }else{
     let card=document.createElement('div');
     card.className='card';
     card.innerHTML='<div class="th">'+c.e+'</div><div class="bd"><div class="nm">'+c.n+'</div><div class="sb">'+c.d+'</div><div class="ok">'+c.badge+'</div></div>';
     card.onclick=function(){ autoPlay(c,card); };
     if(grid) grid.appendChild(card);
   }
 });
}

build();
</script>
</body>
</html>
