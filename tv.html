<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvation TV V10 Lite</title><style>body{margin:0;background:#070a12;color:#fff;font-family:sans-serif}header{padding:14px;background:#000;border-bottom:3px solid #00e676;text-align:center}#card{margin:12px;background:#131c37;border-radius:16px;padding:16px;text-align:center;border:1px solid #1e2f5a}h2{color:#00e676;margin:0 0 8px}.btn{display:block;background:#ff0000;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:900;margin:8px 0}.btn2{background:#00e676;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}button{padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-weight:800;font-size:12px}</style></head><body>

<script>
function setCh(name,handle){
