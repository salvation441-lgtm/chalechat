<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Real Ghana TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:20}
.logo-s{width:48px;height:48px;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px gold;font-weight:900;color:gold;font-size:22px}
.player-box{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:52vh}
.player-box iframe{width:100%;height:100%;border:0}
.tabs{display:flex;gap:10px;padding:12px;overflow:auto}
.tab{padding:10px 22px;border-radius:24px;background:#121612;color:#9aa79a;border:1px solid #333;white-space:nowrap;cursor:pointer}
.tab.active{background:#00FF88;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.14);border-radius:16px;padding:12px;cursor:pointer;text-align:center}
.thumb{height:60px;background:#1e341e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px}
.note{padding:8px 16px;font-size:11px;color:#00FF88;text-align:center;background:#0f1a0f}
</style>
</head>
<body>
<div class="header">
<div class="logo-s">S</div>
<div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">GHANA REAL TV - NO BUNNY</p></div>
<div style="margin-left:auto;border:1px solid #00FF88;color:#00FF88;padding:6px 14px;border-radius:20px;font-size:12px">● LIVE</div>
</div>

<div class="player-box">
<iframe id="player" src="https://www.youtube-nocookie.com/embed/WZl6xCiT0LE?autoplay=1&mute=1&origin=https://on441-lgtm.github.io&modestbranding=1&rel=0" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>
<div class="note" id="status">Playing: JoyNews REAL LIVE - Inside App ✓</div>

<div class="tabs">
<div class="tab active" onclick="filterTab('all',this)">All Real</div>
<div class="tab" onclick="filterTab('ghana',this)">Ghana Real</div>
<div class="tab" onclick="filterTab('sports',this)">Sports</div>
</div>

<div class="grid" id="grid"></div>

<script>
const origin="https://on441-lgtm.github.io";
const yt=(id)=>`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&origin=${origin}&modestbranding=1&rel=0`;

// REAL GHANA TV - NO MORE BUNNY
const channels=[
{name:"JoyNews REAL LIVE",icon:"📰",cat:"ghana",id:"WZl6xCiT0LE",desc:"Real JoyNews Prime"},
{name:"UTV Ghana REAL",icon:"📡",cat:"ghana",id:"l9AzO1FmSxQ",desc:"UTV United Showbiz - Real"},
{name:"GTV Ghana REAL",icon:"📺",cat:"ghana",id:"2OEL4P1Rz04",desc:"GTV News - Real Ghana"},
{name:"Adom TV REAL",icon:"🎬",cat:"ghana",id:"hruD7fS563M",desc:"Adom TV Telenovela - Real"},
{name:"TV3 Ghana REAL",icon:"🌟",cat:"ghana",id:"IQ2a1aKz6dQ",desc:"TV3 News - Real"},
{name:"GHOne TV REAL",icon:"🔥",cat:"ghana",id:"k9o2b3u4v5w",desc:"GHOne - Real"},
{name:"FIFA TV",icon:"⚽",cat:"sports",id:"JGwWNGJdvx8",desc:"FIFA Official"},
{name:"SuperSport",icon:"🏆",cat:"sports",id:"86YLFOog4GM",desc:"SuperSport"},
];

let filter='all';
function filterTab(cat,el){
 filter=cat;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
 render();
}
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 channels.filter(c=>filter==='all'||c.cat===filter).forEach(ch=>{
  const d=document.createElement('div');d.className='card';
  d.onclick=()=>{
    document.getElementById('player').src=yt(ch.id);
    document.getElementById('status').textContent=`Playing: ${ch.name} • ${ch.desc} • REAL ✓`;
    window.scrollTo({top:0,behavior:'smooth'});
  };
  d.innerHTML=`<div class="thumb">${ch.icon}</div><h3 style="font-size:13px">${ch.name}</h3><p style="font-size:10px;color:#00FF88">REAL TV ✓</p>`;
  g.appendChild(d);
 });
}
render();
</script>
</body>
</html>
