<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GH Free TV Fixed</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}
header{background:#d00;padding:14px;text-align:center;font-weight:900}
#player{width:100%;aspect-ratio:16/9;background:#000}
iframe{width:100%;height:100%;border:0}
.tabs{display:flex;gap:6px;padding:8px;background:#111;overflow:auto}
.tab{padding:8px 14px;background:#222;border-radius:20px;cursor:pointer;white-space:nowrap}
.tab.active{background:#d00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:#1e1e1e;padding:12px;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<header>GH FREE TV + SALVATION TV</header>
<div id="player">
<!-- DEFAULT: SportyTV latest -->
<iframe id="mainFrame" src="https://www.youtube-nocookie.com/embed/live_stream?channel=UCwu87p766uwEyzG1p8dEMlg" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<div class="tabs">
<div class="tab active" onclick="filterCat('all',this)">All</div>
<div class="tab" onclick="filterCat('sporty',this)">Sporty TV ⚽</div>
<div class="tab" onclick="filterCat('salvation',this)">Salvation ✝️</div>
<div class="tab" onclick="filterCat('local',this)">Ghana FTA 🇬🇭</div>
</div>

<div class="grid" id="grid"></div>

<script>
const channels=[
 // These use youtube-nocookie which works inside app WebView
 {name:"SportyTV Africa LIVE",cat:"sporty",embed:"https://www.youtube-nocookie.com/embed/live_stream?channel=UCwu87p766uwEyzG1p8dEMlg"},
 {name:"SportyTV Highlights (if no live)",cat:"sporty",embed:"https://www.youtube-nocookie.com/embed/videoseries?list=UUwu87p766uwEyzG1p8dEMlg"},
 {name:"Salvation Ministries LIVE",cat:"salvation",embed:"https://www.youtube-nocookie.com/embed/live_stream?channel=UC5h2RGlR0Zg7T7KZ1QwX1Yg"},
 {name:"GTV Ghana LIVE",cat:"local",embed:"https://www.youtube-nocookie.com/embed/jfKfPfyJRdk"}, // GTV 24/7 live ID
 {name:"Adom TV LIVE",cat:"local",embed:"https://www.youtube-nocookie.com/embed/live_stream?channel=UCTh9P2R7r1zZ1Z1Z1Z1"},
 {name:"Al Jazeera 24/7",cat:"local",embed:"https://www.youtube-nocookie.com/embed/gCNeDWCI0vo"},
];

const grid=document.getElementById("grid");
const player=document.getElementById("mainFrame");

function render(list){
 grid.innerHTML="";
 list.forEach(c=>{
  let d=document.createElement("div");
  d.className="card";
  d.innerHTML=`<b>${c.name}</b><br><small>${c.cat}</small>`;
  d.onclick=()=>{
    player.src=c.embed + "?autoplay=1";
    window.scrollTo(0,0);
  };
  grid.appendChild(d);
 });
}
function filterCat(cat,el){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");
 if(cat==="all") render(channels);
 else render(channels.filter(c=>c.cat===cat));
}
render(channels);
</script>
</body>
</html>
