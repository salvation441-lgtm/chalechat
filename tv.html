<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Unlimited Rada</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060a06;color:#fff;font-family:system-ui;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.header{padding:14px;background:#0a140a;border-bottom:1px solid #222;font-weight:900}.header span{color:#00ff88}
.player-box{margin:10px;border-radius:16px;background:#000;height:38vh;min-height:260px;border:1px solid #333;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player-box video,.player-box iframe{width:100%;height:100%;border:0;position:absolute;inset:0;background:#000}
#status{position:absolute;z-index:10;background:#111;padding:8px 14px;border-radius:20px;font-size:11px;border:1px solid #333;font-weight:700;text-align:center}
.tabs{display:flex;gap:5px;padding:8px;overflow-x:auto}.tab{padding:9px 11px;border-radius:20px;font-size:8.5px;font-weight:800;border:1px solid #333;background:#111;white-space:nowrap}.tab.active{background:#fff;color:#000}
.content{flex:1;overflow-y:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#111;border-radius:14px;padding:14px 4px;text-align:center;border:1px solid #222}.card h3{font-size:7px;margin-top:4px}
.badge{font-size:5px;padding:3px 7px;border-radius:10px;margin-top:5px;display:inline-block;font-weight:900}
.badge.inside{background:#00ff88;color:#000}.badge.music{background:#a855f7;color:#fff}.badge.unlimited{background:#ff00ff;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header">Salvation <span>TV - Unlimited Rada</span></div>
<div class="player-box"><div id="status">TAP UNLIMITED RADA</div><video id="v" controls autoplay muted playsinline></video><iframe id="yt" class="hidden" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div class="tabs">
<div class="tab active" id="t-ent" onclick="st('ent')">Entertainment</div>
<div class="tab" id="t-ghana" onclick="st('ghana')">Ghana</div>
<div class="tab" id="t-sports" onclick="st('sports')">Sports</div>
</div>
<div class="content">
<div class="grid" id="g-ent"></div>
<div class="grid hidden" id="g-ghana"></div>
<div class="grid hidden" id="g-sports"></div>
</div>
<script>
const v=document.getElementById('v'), yt=document.getElementById('yt'), stt=document.getElementById('status'); let h=null;
function show(t){stt.textContent=t; stt.classList.remove('hidden');} function hide(){stt.classList.add('hidden');}
function playHLS(u){ yt.classList.add('hidden'); yt.src=''; v.classList.remove('hidden'); if(h){h.destroy();h=null;} show('CONNECTING...'); if(Hls.isSupported()){ h=new Hls(); h.loadSource(u); h.attachMedia(v); h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().then(hide)); } else{v.src=u; v.play().then(hide);} }

// UNLIMITED RADA - plays all uploads from 4Syte TV channel non-stop
function playUnlimited4Syte(){
  if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden');
  show('UNLIMITED 4SYTE RADA - LOADING...');
  // listType=user_uploads&list=4sytetv = plays ALL videos from @4sytetv channel unlimited
  yt.src = `https://www.youtube-nocookie.com/embed?listType=user_uploads&list=4sytetv&autoplay=1&mute=0&playsinline=1&rel=0&modestbranding=1&origin=https://on441-lgtm.github.io`;
  yt.onload=hide;
}

function playUnlimitedGhana(){
  if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden');
  show('UNLIMITED GHANA HITS...');
  // Search playlist for Ghana music - unlimited
  yt.src = `https://www.youtube-nocookie.com/embed?listType=search&list=Ghana+music+videos+2024+Black+Sherif+Shatta+Wale+Stonebwoy&autoplay=1&mute=0&rel=0&origin=https://on441-lgtm.github.io`;
  yt.onload=hide;
}

function playPlaylistOnly2(){
  if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden');
  show('ONLY 2 - Lyrical Joe > Blacko');
  yt.src = `https://www.youtube-nocookie.com/embed/MSMsWkC6Rro?autoplay=1&mute=0&playsinline=1&playlist=Hb6I7GoTvzI&rel=0&origin=https://on441-lgtm.github.io`;
  yt.onload=hide;
}

function openLink(u){ window.open(u, '_blank'); }
function mk(g,fn,name,type){const d=document.createElement('div'); d.className='card'; d.style.borderColor=type==='unlimited'?'#ff00ff':type==='inside'?'#00ff88':'#333'; d.onclick=fn; d.innerHTML=`<div style="font-weight:900;font-size:18px">${type==='unlimited'?'♾️':name[0]}</div><h3>${name}</h3><span class="badge ${type}">${type}</span>`; g.appendChild(d);}

const ent=document.getElementById('g-ent');
// UNLIMITED RADA SECTION
mk(ent, ()=>playUnlimited4Syte(), "4Syte Unlimited ♾️", "unlimited"); // MAIN - UNLIMITED - all @4sytetv videos
mk(ent, ()=>playUnlimitedGhana(), "Ghana Hits Unlimited ♾️", "unlimited"); // Ghana music unlimited
mk(ent, ()=>playPlaylistOnly2(), "Only 2 - No Loop", "inside");
mk(ent, ()=>{if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden'); yt.src="https://4sytetv.com/"; show('4Syte Official 24/7 HD'); setTimeout(hide,2000);}, "4Syte Official 24/7", "music");
mk(ent, ()=>openLink("https://www.youtube.com/@4sytetv"), "4Syte @4sytetv YT", "music");

const gh=document.getElementById('g-ghana');
mk(gh, ()=>playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8"), "MAX TV", "inside");
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=TV3+Ghana+live"), "TV3 Ghana", "inside");

const sp=document.getElementById('g-sports');
mk(sp, ()=>playHLS("https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8"), "Red Bull TV", "inside");

function st(t){['ghana','ent','sports'].forEach(id=>{document.getElementById('g-'+id).classList.toggle('hidden', id!==t); document.getElementById('t-'+id).classList.toggle('active', id===t);});}
st('ent');
show('TAP ♾️ UNLIMITED - E GO PLAY NON-STOP');
</script>
</body>
</html>
