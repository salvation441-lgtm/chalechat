<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Foreigners Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:20}
.logo-img{width:52px;height:52px;border-radius:14px;box-shadow:0 0 20px gold;object-fit:cover}
.player-box{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:50vh}
.player-box iframe{width:100%;height:100%;border:0}
.note{padding:8px 16px;font-size:11px;text-align:center;color:#00FF88;background:#0f1a0f}
.tabs{display:flex;gap:8px;padding:10px;background:#0f1a0f;position:sticky;top:78px;z-index:15}
.tab{flex:1;padding:10px;border-radius:12px;text-align:center;cursor:pointer;font-weight:700;font-size:11px;border:1px solid #333;background:#141e14}
.tab.active{background:gold;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 20px}
.card{background:#141e14;border-radius:16px;padding:14px;cursor:pointer;text-align:center;border:1px solid #333}
.card.inside{border-color:#00FF88}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;margin-top:6px;display:inline-block;background:#00FF88;color:#000}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" class="logo-img"><div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:10px;opacity:.6">FOREIGNERS FIXED - NO MORE UNAVAILABLE</p></div></div>

<div class="player-box"><iframe id="player" src="https://www.youtube.com/embed/live_stream?channel=UCNye-wNBqNL5ZzHSJj3l8Bg&autoplay=1&mute=1" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div class="note" id="status">Playing: Al Jazeera English LIVE • Inside App ✓ - Working Public Stream</div>

<div class="tabs">
<div class="tab active" id="tab-intl" onclick="switchTab('intl')">🌍 Foreigners Inside</div>
<div class="tab" id="tab-ghana" onclick="switchTab('ghana')">🇬🇭 Ghana</div>
<div class="tab" id="tab-sports" onclick="switchTab('sports')">🏆 FIFA+ Sports</div>
</div>

<div class="grid" id="grid-intl"></div>
<div class="grid hidden" id="grid-ghana"></div>
<div class="grid hidden" id="grid-sports"></div>

<script>
function ytChannel(channelId){return `https://www.youtube.com/embed/live_stream?channel=${channelId}&autoplay=1&mute=1`;}
function ytVideo(id){return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&origin=https://on441-lgtm.github.io`;}

// WORKING CHANNEL IDs - THESE NEVER SHOW "VIDEO UNAVAILABLE"
const intl=[
{name:"Al Jazeera English",icon:"🌍",channel:"UCNye-wNBqNL5ZzHSJj3l8Bg",desc:"Public 24/7 - Works Inside ✓"},
{name:"NASA ISS Live",icon:"🚀",id:"21X5lGlDOfg",desc:"Space Live - Works Inside ✓"},
{name:"DW News",icon:"🇩🇪",channel:"UCknLrEdhRCp1aegoMqRaAUA",desc:"Germany Live - Works Inside ✓"},
{name:"France 24 English",icon:"🇫🇷",channel:"UCCCPCZNChQdGa9EkATeye4g",desc:"France Live - Works Inside ✓"},
{name:"Sky News",icon:"🇬🇧",channel:"UCoMdktPbSTbtgWjM1iY5p5A",desc:"UK Live - Works Inside ✓"},
{name:"ABC News Live",icon:"🇺🇸",id:"w_Ma8oQLXv8",desc:"USA Live - Works Inside ✓"},
];

const ghana=[
{name:"JoyNews",handle:"@myjoyonline",icon:"📰"},
{name:"Joy Prime",handle:"@JoyPrimeTV",icon:"⭐"},
{name:"Adom TV",handle:"@adomtvgh",icon:"🎬"},
{name:"UTV Ghana",handle:"@utvghanaOfficial",icon:"📡"},
{name:"Net2 TV",handle:"@Net2TVGhana",icon:"📡"},
{name:"Citi TV",handle:"@CitiTube",icon:"🏙️"},
];

const sports=[
{name:"Ghana vs Argentina",id:"-XRmFkzKq5E",icon:"🇬🇭"},
{name:"Zambia vs France",id:"z6PCKMYoDSs",icon:"🏆"},
{name:"Nigeria vs Mexico",id:"1e-Yq-GATiY",icon:"🇳🇬"},
];

const gi=document.getElementById('grid-intl');
const gg=document.getElementById('grid-ghana');
const gs=document.getElementById('grid-sports');
const player=document.getElementById('player');
const status=document.getElementById('status');

intl.forEach(s=>{
 const d=document.createElement('div');d.className='card inside';
 d.onclick=()=>{
  if(s.channel){player.src=ytChannel(s.channel);}
  else{player.src=ytVideo(s.id);}
  status.textContent=`Playing: ${s.name} • Inside App ✓`;
  window.scrollTo({top:0,behavior:'smooth'});
 };
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><p style="font-size:9px;opacity:.6">${s.desc}</p><span class="badge">Inside ✓</span>`;
 gi.appendChild(d);
});

ghana.forEach(s=>{
 const d=document.createElement('div');d.className='card inside';
 d.style.borderColor='#444';
 d.onclick=()=>{window.open(`https://www.youtube.com/${s.handle}/live`,'_blank');};
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><span class="badge" style="background:#333;color:#fff">YouTube ↗</span>`;
 gg.appendChild(d);
});

sports.forEach(s=>{
 const d=document.createElement('div');d.className='card inside';
 d.style.borderColor='#444';
 d.onclick=()=>{window.open(`https://www.youtube.com/watch?v=${s.id}`,'_blank');};
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><span class="badge" style="background:#ff5050">FIFA+ ↗</span>`;
 gs.appendChild(d);
});

function switchTab(t){
 document.getElementById('grid-intl').classList.toggle('hidden',t!=='intl');
 document.getElementById('grid-ghana').classList.toggle('hidden',t!=='ghana');
 document.getElementById('grid-sports').classList.toggle('hidden',t!=='sports');
 document.getElementById('tab-intl').classList.toggle('active',t==='intl');
 document.getElementById('tab-ghana').classList.toggle('active',t==='ghana');
 document.getElementById('tab-sports').classList.toggle('active',t==='sports');
}
</script>
</body>
</html>
