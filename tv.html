<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvation TV - Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060a06;color:#fff;font-family:system-ui;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.header{padding:12px;background:#0a140a;border-bottom:1px solid #222;font-weight:900}
.header span{color:#00ff88}
.player-box{margin:10px;border-radius:16px;background:#000;height:32vh;min-height:220px;border:1px solid #333;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player-box video,.player-box iframe{width:100%;height:100%;border:0;position:absolute;inset:0;background:#000}
#status{position:absolute;z-index:10;background:#111;padding:8px 14px;border-radius:20px;font-size:11px;border:1px solid #333;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:20px;font-size:10px;font-weight:800;border:1px solid #333;background:#111;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.content{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#111;border-radius:14px;padding:12px 4px;text-align:center;border:1px solid #222}
.card h3{font-size:8px;margin-top:4px}
.badge{font-size:6px;padding:4px 8px;border-radius:10px;margin-top:5px;display:inline-block;font-weight:900}
.badge.hls{background:#ffcc00;color:#000}
.badge.inside{background:#00ff88;color:#000}
.badge.yt{background:#ff0000;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header">Salvation <span>TV</span></div>
<div class="player-box" id="pbox">
<div id="status" class="hidden">CONNECTING...</div>
<video id="v" controls autoplay muted playsinline></video>
<iframe id="yt" class="hidden" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>
<div class="tabs"><div class="tab active" id="t-ghana" onclick="st('ghana')">Ghana</div><div class="tab" id="t-foreign" onclick="st('foreign')">Foreign</div><div class="tab" id="t-sports" onclick="st('sports')">Sports</div><div class="tab" id="t-movies" onclick="st('movies')">Movies</div></div>
<div class="content"><div class="grid" id="g-ghana"></div><div class="grid hidden" id="g-foreign"></div><div class="grid hidden" id="g-sports"></div><div class="grid hidden" id="g-movies"></div></div>
<script>
const v=document.getElementById('v'), yt=document.getElementById('yt'), stt=document.getElementById('status');
let h=null;
function show(t){stt.textContent=t; stt.classList.remove('hidden');} function hide(){stt.classList.add('hidden');}
function playHLS(url){
  yt.classList.add('hidden'); yt.src=''; v.classList.remove('hidden');
  if(h){h.destroy();h=null;}
  show('CONNECTING...');
  if(Hls.isSupported()){
    h=new Hls({enableWorker:true, lowLatencyMode:true});
    h.loadSource(url);
    h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,()=>{ v.play().then(hide).catch(()=>{hide();}); });
    h.on(Hls.Events.ERROR,(e,data)=>{
      if(data.fatal){
        if(data.type==='networkError'){ show('OFFLINE - TAP ANOTHER'); setTimeout(hide,2000); }
        else{ h.destroy(); show('STREAM OFFLINE'); }
      }
    });
  }else{v.src=url; v.play().then(hide).catch(()=>show('TAP PLAY'));}
}
function playYTInside(id){
  if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden');
  show('LOADING...');
  yt.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&origin=https://on441-lgtm.github.io`;
  yt.onload=()=>hide();
}
function openYT(handle){ window.open(`https://www.youtube.com/${handle}/live`, '_blank'); }
function mk(g,fn,name,type){
  const d=document.createElement('div'); d.className='card';
  d.style.borderColor=type==='hls'?'#ffcc00':type==='inside'?'#00ff88':'#ff4444';
  d.onclick=fn; d.innerHTML=`<div style="font-weight:900;font-size:18px">${name[0]}</div><h3>${name}</h3><span class="badge ${type}">${type==='hls'?'INSIDE':type==='inside'?'INSIDE':'YOUTUBE APP'}</span>`;
  g.appendChild(d);
}

const gh=document.getElementById('g-ghana');
// WORKING HLS - TESTED
mk(gh, ()=>playHLS("https://adesa.tv/live/tv3_AdesaAdb.m3u8"), "TV3 Ghana", "hls"); // confirmed via iptv-org
mk(gh, ()=>playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8"), "MAX TV", "hls");
// OPEN IN YOUTUBE APP - NO MORE SPINNER INSIDE
mk(gh, ()=>openYT("@myjoyonline"), "JoyNews LIVE", "yt");
mk(gh, ()=>openYT("@Channel1TVGHA"), "Channel One", "yt");
mk(gh, ()=>openYT("@UTVGhanaOfficial"), "UTV Ghana", "yt");
mk(gh, ()=>openYT("@GHOneTV"), "GHOne", "yt");
mk(gh, ()=>openYT("@adomtvgh"), "Adom TV", "yt");
mk(gh, ()=>openYT("@OnuaTV"), "Onua TV", "yt");

const fo=document.getElementById('g-foreign');
mk(fo, ()=>playHLS("https://live-hls-web-aje.getaj.net/AJE/01.m3u8"), "Al Jazeera", "hls");
mk(fo, ()=>playHLS("https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8"), "France 24", "hls");
mk(fo, ()=>playYTInside("gCNeDWCI0vo"), "Al Jazeera YT", "inside");
mk(fo, ()=>playYTInside("21X5lGlDOfg"), "NASA", "inside");
mk(fo, ()=>playYTInside("W3ODvWk0y0g"), "DW News", "inside");

const sp=document.getElementById('g-sports');
mk(sp, ()=>playHLS("https://dms.redbull.tv/v5/destination/streams/linear-borb-linear.m3u8"), "Red Bull TV", "hls");

const mo=document.getElementById('g-movies');
mk(mo, ()=>{ if(h){h.destroy();h=null;} v.classList.add('hidden'); yt.classList.remove('hidden'); yt.src='https://watch.plex.tv/movies'; hide(); }, "Plex Movies", "inside");

function st(t){['ghana','foreign','sports','movies'].forEach(id=>{document.getElementById('g-'+id).classList.toggle('hidden', id!==t); document.getElementById('t-'+id).classList.toggle('active', id===t);});}
// Start with TV3 - most stable
playHLS("https://adesa.tv/live/tv3_AdesaAdb.m3u8");
</script>
</body>
</html>
