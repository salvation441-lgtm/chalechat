<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060a1a"><title>Salvation TV - Free Live TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#060a1a;color:#fff}header{position:sticky;top:0;z-index:100;background:rgba(6,10,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.h-left{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#000}.h-left b{font-size:15px;font-weight:800}.h-left small{font-size:9px;color:#7a8ab0;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}video{width:100%;height:100%;background:#000}.v-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.85));padding:40px 18px 14px;pointer-events:none}.v-info h2{font-size:16px;font-weight:800}.v-info p{font-size:11px;color:rgba(255,255,255,0.7);margin-top:3px}.badge{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:800}.badge.live{background:#ff1a1a;color:#fff}.badge.movie{background:#fff;color:#000}.badge.radio{background:#ff9800;color:#000}#tabs{position:sticky;top:71px;z-index:90;background:rgba(6,10,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:12px 14px;display:flex;gap:8px;overflow-x:auto}#tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;padding:10px 18px;border-radius:24px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);font-size:11px;font-weight:700;transition:0.25s}.tab.on{background:#fff;color:#000;border-color:#fff;box-shadow:0 4px 20px rgba(255,255,255,0.15)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 14px 110px}.card{background:linear-gradient(145deg,#121a33,#0e152e);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px 12px;text-align:center;transition:0.25s;cursor:pointer}.card.on{background:#fff;color:#000;transform:translateY(-2px) scale(1.02);box-shadow:0 12px 30px rgba(255,255,255,0.15)}.card-emoji{font-size:30px}.card-name{font-size:12px;font-weight:800;margin-top:8px}.card-desc{font-size:9px;opacity:0.6;margin-top:3px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}.dot.live{background:#ff1a1a}.dot.movie{background:#000}.dot.radio{background:#ff9800}#bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(6,10,26,0.92);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:12px 14px;display:flex;gap:10px}.btn{flex:1;padding:13px;border-radius:14px;border:none;font-weight:800;font-size:12px;cursor:pointer}.btn.s{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.1)}.btn.p{background:#fff;color:#000}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:11px;font-weight:700;display:none;z-index:200}
</style></head><body>
<header><div class="h-left"><div class="logo">S</div><div><b>Salvation TV</b><br><small>Free Live TV</small></div></div><div style="font-size:18px">📺</div></header>

<div class="video-wrap">
<video id="video" controls playsinline></video>
<div class="badge live" id="badge">● LIVE</div>
<div class="v-info"><h2 id="chName">DW English</h2><p id="chStat">Live News 24/7</p></div>
</div>

<div id="tabs">
<button class="tab on" onclick="setCat('live',this)">Live News</button>
<button class="tab" onclick="setCat('movies',this)">Free Movies</button>
<button class="tab" onclick="setCat('radio',this)">Radio</button>
<button class="tab" onclick="setCat('all',this)">All</button>
</div>

<div class="grid" id="grid"></div>

<div id="bottom"><button class="btn s" onclick="shareApp()">Share</button><button class="btn p" onclick="installApp()">Add to Home</button></div>
<div id="toast"></div>

<script>
const DB={
live:[
{n:"Al Jazeera",e:"📰",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"World News 24/7",type:"LIVE"},
{n:"France 24",e:"🇫🇷",u:"https://live.france24.com/hls/live/2037218/F24_EN_LO_HLS/master.m3u8",d:"France Live",type:"LIVE"},
{n:"DW English",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"Germany News",type:"LIVE"},
{n:"NASA TV",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"Space Live",type:"LIVE"},
{n:"Red Bull TV",e:"🏎️",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",d:"Sports Live",type:"LIVE"},
{n:"CGTN",e:"🌍",u:"https://news.cgtn.com/resource/live/english/cgtn-news.m3u8",d:"China News",type:"LIVE"},
],
movies:[
{n:"Sintel",e:"🎬",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",d:"Animation Free",type:"MOVIE"},
{n:"Big Buck Bunny",e:"🐰",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",d:"Comedy Free",type:"MOVIE"},
{n:"Tears of Steel",e:"💥",u:"https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8",d:"Sci-Fi Free",type:"MOVIE"},
],
radio:[
{n:"Joy FM 99.7",e:"📻",u:"https://stream.zeno.fm/4x2b8q2kqg8uv",d:"Hit Music",type:"RADIO",t:"audio"},
{n:"Citi FM",e:"🎙️",u:"https://citi973.radioca.st/stream",d:"News & Talk",type:"RADIO",t:"audio"},
{n:"Peace FM",e:"🔥",u:"https://peacefmonline.radioca.st/stream",d:"Twi Music",type:"RADIO",t:"audio"},
{n:"Adom FM",e:"💚",u:"https://adom1063fm.radioca.st/stream",d:"Entertainment",type:"RADIO",t:"audio"},
],
};
DB.all=[...DB.live,...DB.movies,...DB.radio];

let hls;
const video=document.getElementById('video');

function toast(msg){
let t=document.getElementById('toast');
t.innerText=msg;
t.style.display='block';
setTimeout(()=>t.style.display='none',2500);
}

function play(c,el){
document.querySelectorAll('.card').forEach(b=>b.classList.remove('on'));
el.classList.add('on');
document.getElementById('chName').innerText=c.n;
document.getElementById('chStat').innerText=c.d;
let bdg=document.getElementById('badge');
bdg.innerText=c.type==='LIVE'?'● LIVE':c.type==='RADIO'?'📻 RADIO':'▶️ MOVIE';
bdg.className='badge '+c.type.toLowerCase();
if(hls){hls.destroy();}
if(c.t==='audio'){
video.src=c.u;
video.play().then(()=>toast('Playing '+c.n)).catch(()=>toast('Tap play'));
return;
}
if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
}else{
video.src=c.u;
video.play().catch(()=>{});
}
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
let dotClass=c.type.toLowerCase();
d.innerHTML=`<div class="card-emoji">${c.e}</div><div class="card-name">${c.n}</div><div class="card-desc">${c.d}</div><div style="margin-top:8px;font-size:9px;font-weight:700;opacity:0.6"><span class="dot ${dotClass}"></span>${c.type}</div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function setCat(cat,btn){
document.querySelectorAll('.tab').forEach(b=>b.className='tab');
btn.className='tab on';
build(DB[cat]);
}
function shareApp(){
if(navigator.share){navigator.share({title:'Salvation TV',text:'Free Live TV',url:location.href});}
else{navigator.clipboard.writeText(location.href);toast('Link copied!');}
}
function installApp(){toast('Tap ⋮ → Add to Home screen');}

build(DB.live);
</script></body></html>
