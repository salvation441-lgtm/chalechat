let hls; const video=document.getElementById('video');

function play(c,btn){
document.querySelectorAll('.grid button').forEach(b=>b.classList.remove('on'));
btn.classList.add('on');
document.getElementById('chName').innerText=c.e+' '+c.name;
document.getElementById('chStat').innerText='● Playing: '+c.d;

let wrap=document.getElementById('player');
let ifr=wrap.querySelector('iframe'); if(ifr) ifr.remove();

if(c.type==='yt'){
video.style.display='none';
let f=document.createElement('iframe');
f.src=c.u+'?autoplay=1&mute=0';f.style.width='100%';f.style.height='100%';f.style.border='none';f.allow='autoplay; fullscreen';f.allowFullscreen=true;
wrap.prepend(f); return;
}
if(c.type==='audio'){
video.style.display='none';
let f=document.createElement('iframe');
f.src=''; f.style.display='none'; wrap.prepend(f);
if(hls){hls.destroy();}
video.style.display='block';
video.src=c.u; video.play().catch(()=>{}); return;
}

video.style.display='block';
if(hls){hls.destroy();}
if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}
else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=c.u;video.addEventListener('loadedmetadata',()=>video.play().catch(()=>{}));}
window.scrollTo({top:0,behavior:'smooth'});
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';

if(i==0) b.classList.add('on');
b.innerHTML=c.e+' '+c.name+'<small>'+c.d+'</small>';
b.onclick=()=>play(c,b);
g.appendChild(b);
});
if(list.length>0) play(list[0], g.firstChild);
}

function switchTab(cat,btn){
document.querySelectorAll('#tabs .tab').forEach(b=>b.className='tab off');
btn.className='tab on';
build(DB[cat]);
}
