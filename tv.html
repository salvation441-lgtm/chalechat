bottom:1px solid rgba(255,255,255,0.06)}.hero-info h1{font-size:18px;font-weight:900}.hero-info p{font-size:12px;color:#8aa0d0;margin-top:4px}#catScroll{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;background:#050814;position:sticky;top:62px;z-index:99;scrollbar-width:none}#catScroll::-webkit-scrollbar{display:none}.cat{white-space:nowrap;padding:10px 18px;border-radius:25px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;font-weight:700;transition:0.3s}.cat.on{background:#00e676;color:#000;border-color:#00e676;box-shadow:0 0 20px rgba(0,230,118,0.4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 110px}.card{background:linear-gradient(135deg,#131c37 0%,#0e152b 100%);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;text-align:center;transition:0.3s;position:relative;overflow:hidden}.card.on{background:linear-gradient(135deg,#00e676 0%,#00b894 100%);color:#000;border-color:#00e676;transform:scale(1.02);box-shadow:0 8px 30px rgba(0,230,118,0.3)}.card-emoji{font-size:28px;display:block;margin-bottom:6px}.card-name{font-size:12px;font-weight:900}.card-desc{font-size:9px;opacity:0.7;margin-top:4px}#bottomBar{position:fixed;bottom:0;left:0;right:0;background:rgba(5,8,20,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);padding:10px 16px;display:flex;gap:10px;z-index:100}.bBtn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;font-size:11px}.bBtn.primary{background:#00e676;color:#000}.bBtn.secondary{background:rgba(255,255,255,0.1);color:#fff}</style></head><body>
<header><div class="logo"><div class="logo-icon">S</div><div class="logo-text"><b>SALVATION TV</b><small>SALVATION TECH PRO</small></div></div><div class="pro-badge">PRO V17</div></header>

<div id="hero"><div class="video-wrap"><video id="video" controls autoplay playsinline></video><div class="live-badge"><span style="width:8px;height:8px;background:#fff;border-radius:50%;display:inline-block;animation:blink 1s infinite"></span> LIVE FREE</div></div><div class="hero-info"><h1 id="chName">Red Bull TV - Extreme Sports</h1><p id="chStat">● STAGE 14 Final Stage - Real Graphics Inside • 40+ Channels</p></div></div>

<div id="catScroll">
<button class="cat on" onclick="switchCat('news',this)">📰 News</button>
<button class="cat" onclick="switchCat('movies',this)">🎬 Movies</button>
<button class="cat" onclick="switchCat('telenovela',this)">💃 Telenovela</button>
<button class="cat" onclick="switchCat('lifestyle',this)">👗 Lifestyle</button>
<button class="cat" onclick="switchCat('sports',this)">⚽ Sports</button>
<button class="cat" onclick="switchCat('kids',this)">🧒 Kids</button>
<button class="cat" onclick="switchCat('radio',this)">📻 Radio</button>
<button class="cat" onclick="switchCat('ghana',this)">🇬🇭 Ghana</button>
</div>

<div class="grid" id="grid"></div>

<div id="bottomBar">
<button class="bBtn secondary" onclick="shareApp()">📤 Share App</button>
<button class="bBtn primary" onclick="installApp()">📲 Install App</button>
</div>

<script>
const DB={
news:[{n:"Al Jazeera EN",e:"📰",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"News Live"},{n:"France 24",e:"🇫🇷",u:"https://live.france24.com/hls/live/2037218/F24_EN_LO_HLS/master.m3u8",d:"France News"},{n:"DW English",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"Germany News"},{n:"NASA TV",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"Space Live"},{n:"CGTN",e:"🇨🇳",u:"https://news.cgtn.com/resource/live/english/cgtn-news.m3u8",d:"China News"},{n:"Bloomberg",e:"💹",u:"https://bloomberg-bloomberg-3-br.samsung.wurl.tv/playlist.m3u8",d:"Business"}],
movies:[{n:"FilmRise Movies",e:"🎬",u:"https://filmrisemovies-filmrise-1-us.samsung.wurl.tv/playlist.m3u8",d:"Free Movies"},{n:"FilmRise Action",e:"💥",u:"https://filmriseaction-filmrise-1-us.samsung.wurl.tv/playlist.m3u8",d:"Action"},{n:"Classic Movies",e:"🎥",u:"https://classicmovies-classicmovies-1-us.samsung.wurl.tv/playlist.m3u8",d:"Classic"}],
telenovela:[{n:"Telenovela Drama",e:"💃",u:"https://telenovela-telenovela-1-us.samsung.wurl.tv/playlist.m3u8",d:"Spanish Love"},{n:"Pluto Telenovela",e:"❤️",u:"https://service-stitcher.clusters.pluto.tv/v1/stitch/embed/hls/channel/5f4f8baf5c9b0f00073d5c9a/master.m3u8?appName=web",d:"Drama"}],
lifestyle:[{n:"Fashion TV",e:"👗",u:"https://fashiontv-fashiontv-1-us.samsung.wurl.tv/playlist.m3u8",d:"Runway"},{n:"Tastemade",e:"🍳",u:"https://tastemade-tastemade-1-us.samsung.wurl.tv/playlist.m3u8",d:"Food & Travel"},{n:"People TV",e:"⭐",u:"https://people-tv-people-tv-1-us.samsung.wurl.tv/playlist.m3u8",d:"Celebrity"}],
sports:[{n:"Red Bull TV",e:"🏎️",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",d:"Extreme Sports"},{n:"SportsGrid",e:"⚽",u:"https://sportsgrid-sportsgrid-1-us.samsung.wurl.tv/playlist.m3u8",d:"Sports News"},{n:"Stadium",e:"🏟️",u:"https://stadium-stadium-1-us.samsung.wurl.tv/playlist.m3u8",d:"Live Sports"}],
kids:[{n:"Kids Central",e:"🧒",u:"https://kidscentral-kidscentral-1-us.samsung.wurl.tv/playlist.m3u8",d:"Kids"}],
radio:[{n:"Joy FM 99.7",e:"📻",u:"https://195.154.182.222:8000/joy",d:"Ghana #1",t:"audio"},{n:"Citi FM 97.3",e:"🎙️",u:"https://citi973.radioca.st/stream",d:"News",t:"audio"},{n:"Peace FM",e:"🔥",u:"https://peacefmonline.radioca.st/stream",d:"Twi",t:"audio"},{n:"BBC World",e:"🌐",u:"https://stream.live.vc.bbcmedia.co.uk/bbc_world_service",d:"World",t:"audio"}],
ghana:[{n:"GTV Ghana",e:"🇬🇭",u:"https://www.youtube-nocookie.com/embed/5qap5aO4i9A",d:"GTV YouTube",t:"yt"},{n:"UTV Ghana",e:"📺",u:"https://www.youtube-nocookie.com/embed/86YLFOog4GM",d:"UTV YouTube",t:"yt"},{n:"TV3 Ghana",e:"🎬",u:"https://www.youtube-nocookie.com/embed/21X5lGlDOfg",d:"TV3 YouTube",t:"yt"}]
};
let hls; const video=document.getElementById('video');
function play(c,el){
document.querySelectorAll('.card').forEach(b=>b.classList.remove('on'));
el.classList.add('on');
document.getElementById('chName').innerText=c.e+' '+c.n;
document.getElementById('chStat').innerText='● Playing: '+c.d+' • Real Graphics Inside';
let wrap=document.querySelector('.video-wrap'); let ifr=wrap.querySelector('iframe'); if(ifr) ifr.remove();
if(c.t==='yt'){video.style.display='none';let f=document.createElement('iframe');f.src=c.u+'?autoplay=1&mute=0';f.style.width='100%';f.style.height='100%';f.style.border='none';f.allow='autoplay; fullscreen';wrap.prepend(f);return;}
video.style.display='block';
if(hls){hls.destroy();}
if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}
else{video.src=c.u;video.play().catch(()=>{});}
window.scrollTo({top:0,behavior:'smooth'});
}
function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
d.innerHTML='<span class="card-emoji">'+c.e+'</span><span class="card-name">'+c.n+'</span><small class="card-desc">'+c.d+'</small>';
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function switchCat(cat,btn){
document.querySelectorAll('.cat').forEach(b=>b.className='cat');
btn.className='cat on';
build(DB[cat]);
}
function shareApp(){
if(navigator.share){navigator.share({title:'Salvation TV Pro - Free Ghana TV App',text:'Watch free TV, Movies, Telenovela, Sports - 40+ channels free!',url:window.location.href});}
else{prompt('Copy and share this link:',window.location.href);}
}
function installApp(){alert('To Install as App:\n\n1. Tap the 3 dots (⋮) top right in Chrome\n2. Tap "Add to Home screen" or "Install app"\n3. Now it works like DSTV app on your phone!\n\nYour friends go think say you build DSTV! 😎');}
build(DB.sports);
</script></body></html>
