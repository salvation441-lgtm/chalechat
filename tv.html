<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Slim</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060806;color:#fff;font-family:system-ui;max-width:480px;margin:0 auto}
.header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0e160e;position:sticky;top:0;z-index:20;border-bottom:1px solid #1a2a1a}
.logo-img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 10px gold;object-fit:cover}
.player-box{margin:8px;border-radius:12px;overflow:hidden;border:1px solid #222;height:26vh;background:#000}
.player-box video{width:100%;height:100%;background:#000}
.note{padding:5px 12px;font-size:9px;text-align:center;color:#00FF88;background:#0a120a;letter-spacing:.5px}
.tabs{display:flex;gap:5px;padding:8px;background:#080c08;position:sticky;top:57px;z-index:15;overflow-x:auto;scrollbar-width:none}
.tab{padding:7px 14px;border-radius:20px;text-align:center;cursor:pointer;font-weight:700;font-size:9px;border:1px solid #222;background:#121812;white-space:nowrap;transition:.2s}
.tab.active{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.3)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 8px 20px}
.card{background:#111911;border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;border:1px solid #1e2e1e;transition:.15s}
.card:active{transform:scale(.96)}
.card.free{border-color:#00FF88}
.card.paid{border-color:#ff5050}
.card.outside{border-color:#222}
.card div{font-size:18px!important}
.card h3{font-size:9px!important;margin-top:4px!important;line-height:1.2;height:18px;overflow:hidden}
.badge{font-size:7px!important;padding:3px 6px!important;border-radius:10px!important;margin-top:5px!important}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" class="logo-img"><div><h1 style="font-size:14px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:8px;opacity:.5">Slim • Fast • Inside</p></div></div>

<div class="player-box"><video id="playerVideo" controls autoplay muted playsinline></video></div>
<div class="note" id="status">Al Jazeera - Inside (HLS)</div>

<div class="tabs">
<div class="tab active" id="tab-intl" onclick="switchTab('intl')">Inside</div>
<div class="tab" id="tab-ghana" onclick="switchTab('ghana')">Ghana</div>
<div class="tab" id="tab-global" onclick="switchTab('global')">Global</div>
<div class="tab" id="tab-fifa" onclick="switchTab('fifa')">FIFA+</div>
<div class="tab" id="tab-links" onclick="switchTab('links')">Paid</div>
</div>

<div class="grid" id="grid-intl"></div>
<div class="grid hidden" id="grid-ghana"></div>
<div class="grid hidden" id="grid-global"></div>
<div class="grid hidden" id="grid-fifa"></div>
<div class="grid hidden" id="grid-links"></div>

<script>
const gi=document.getElementById('grid-intl'),gg=document.getElementById('grid-ghana'),gglobal=document.getElementById('grid-global'),gf=document.getElementById('grid-fifa'),gll=document.getElementById('grid-links'),video=document.getElementById('playerVideo'),statusEl=document.getElementById('status');
let hlsInstance=null;
function playHLS(url,name){
  if(hlsInstance){hlsInstance.destroy();}
  statusEl.textContent=name+" • Inside";
  if(Hls.isSupported()){hlsInstance=new Hls();hlsInstance.loadSource(url);hlsInstance.attachMedia(video);hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>video.play());}
  else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play();}
  window.scrollTo({top:0,behavior:'smooth'});
}
const intl=[
{name:"Al Jazeera",icon:"W",hls:"https://live-hls-web-aje.getaj.net/AJE/01.m3u8"},
{name:"DW News",icon:"D",hls:"https://dwamdstream104.akamaized.net/hls/live/2015526/dwstream104/master.m3u8"},
{name:"France 24",icon:"F",hls:"https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master.m3u8"},
];
const ghana=[
{name:"Max TV",icon:"M",hls:"https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8",isInside:true},
{name:"JoyNews",handle:"@myjoyonline",icon:"J"},
{name:"UTV",handle:"@UTVGhanaOnline",icon:"U"},
{name:"GTV",handle:"@GTVGhana",icon:"G"},
{name:"TV3",handle:"@TV3Ghana",icon:"3"},
{name:"GHOne",handle:"@GHOneTV",icon:"G"},
{name:"Metro",handle:"@metrotvgh",icon:"M"},
{name:"Citi",handle:"@CitiTube",icon:"C"},
{name:"Angel",handle:"@AngelTVGhana",icon:"A"},
{name:"Adom",handle:"@adomtvgh",icon:"A"},
{name:"Onua",handle:"@OnuaTV",icon:"O"},
{name:"Kessben",handle:"@KessbenTV",icon:"K"},
];
const globalFree=[
{name:"FIFA+ Global",url:"https://www.fifa.com/fifaplus/en/live",icon:"F",desc:"Free"},
{name:"J-League",url:"https://www.youtube.com/@JLEAGUEINTERNATIONAL/live",icon:"J",desc:"Free"},
{name:"ISL",url:"https://www.youtube.com/@IndianSuperLeague/live",icon:"I",desc:"Free"},
];
const fifa=[{name:"FIFA+ Official",url:"https://www.fifa.com/fifaplus/en/live",icon:"F"}];
const paidEPL=[
{name:"SuperSport",url:"https://www.supersport.com/",icon:"S",desc:"DStv"},
{name:"Canal+",url:"https://www.canalplus-afrique.com/",icon:"C",desc:"Canal+"},
{name:"DStv Now",url:"https://now.dstv.com/",icon:"D",desc:"Paid"},
];
intl.forEach(s=>{
 const d=document.createElement('div');d.className='card free';d.style.borderColor='#fff';
 d.onclick=()=>playHLS(s.hls,s.name);
 d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge free">INSIDE</span>`;gi.appendChild(d);
});
ghana.forEach(s=>{
 const d=document.createElement('div');
 if(s.isInside){
   d.className='card free';d.style.borderColor='gold';
   d.onclick=()=>playHLS(s.hls,s.name);
   d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge free" style="background:gold">INSIDE</span>`;
 }else{
   d.className='card outside';d.onclick=()=>window.open(`https://www.youtube.com/${s.handle}/live`,'_blank');
   d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge outside">YT</span>`;
 }
 gg.appendChild(d);
});
globalFree.forEach(s=>{
 const d=document.createElement('div');d.className='card free';
 d.onclick=()=>window.open(s.url,'_blank');
 d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge free">FREE</span>`;gglobal.appendChild(d);
});
fifa.forEach(s=>{
 const d=document.createElement('div');d.className='card outside';d.style.borderColor='#ff5050';
 d.onclick=()=>window.open(s.url,'_blank');
 d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge" style="background:#ff5050;color:#fff">FIFA+</span>`;gf.appendChild(d);
});
paidEPL.forEach(s=>{
 const d=document.createElement('div');d.className='card paid';
 d.onclick=()=>window.open(s.url,'_blank');
 d.innerHTML=`<div>${s.icon}</div><h3>${s.name}</h3><span class="badge paid">PAID</span>`;gll.appendChild(d);
});
function switchTab(t){
 document.getElementById('grid-intl').classList.toggle('hidden',t!=='intl');
 document.getElementById('grid-ghana').classList.toggle('hidden',t!=='ghana');
 document.getElementById('grid-global').classList.toggle('hidden',t!=='global');
 document.getElementById('grid-fifa').classList.toggle('hidden',t!=='fifa');
 document.getElementById('grid-links').classList.toggle('hidden',t!=='links');
 ['intl','ghana','global','fifa','links'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('active',t===id));
}
playHLS('https://live-hls-web-aje.getaj.net/AJE/01.m3u8','Al Jazeera');
</script>
</body>
</html>
