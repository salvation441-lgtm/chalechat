let hls;
const video=document.getElementById('video');

function play(c,el){
document.querySelectorAll('.card').forEach(b=>b.classList.remove('on'));
el.classList.add('on');
document.getElementById('chName').innerText=c.e+' '+c.n;
document.getElementById('chStat').innerText=c.d+' • ✅ Pure HLS - No Block - No Private - Works GH';

if(hls){hls.destroy();}
video.style.display='block';

if(c.t==='audio'){
video.src=c.u;
video.play().catch(()=>{});
return;
}
if(Hls.isSupported()){
hls=new Hls({maxBufferLength:10,enableWorker:true});
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
hls.on(Hls.Events.ERROR,(event,data)=>{
console.log('HLS Error',data);
if(data.fatal){
document.getElementById('chStat').innerText='⚠️ Switching to Red Bull - Always works!';
setTimeout(()=>{play(DB.fresh[0], document.querySelector('.card'));},1000);
}
});
}else{
video.src=c.u;
video.play().catch(()=>{});
}
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
d.innerHTML=`<div class="card-emoji">${c.e}</div><div class="card-name">${c.n}</div><div class="card-desc">${c.d}</div><div class="tag">✅ HLS No Block</div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function setCat(cat,btn){
document.querySelectorAll('.cat').forEach(b=>b.className='cat');
btn.className='cat on';
build(DB[cat]);
}
function openPop(type){
document.getElementById('pop').classList.add('show');
if(type==='share'){
document.getElementById('popIcon').innerText='✅';
document.getElementById('popTitle').innerText='Pure HLS - No Block';
document.getElementById('popContent').innerHTML=`<input style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;font-size:10px;color:#00e676;text-align:center" value="${window.location.href}" readonly onclick="this.select();document.execCommand('copy')"><p style="font-size:11px;margin-top:12px;color:#8aa0d0;line-height:1.5">✅ No YouTube = No private, No processing<br>✅ All HLS = Red Bull, Al Jazeera, NASA - Tested GH<br>✅ Movies = Public domain HLS - Big Buck Bunny free</p>`;

}
