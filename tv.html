-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ok{font-size:7px;font-weight:700;margin-top:2px;color:#00ff88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status{position:absolute;bottom:6px;left:8px;right:8px;font-size:9px;background:rgba(0,0,0,0.85);padding:5px 8px;border-radius:8px;text-align:center;z-index:10}#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px 12px;display:flex;gap:8px}.btn{flex:1;height:42px;border-radius:10px;border:none;font-weight:600;font-size:11px}.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}.section-title{padding:10px 12px 4px;font-size:11px;font-weight:700;color:#00ff88;text-transform:uppercase;letter-spacing:0.5px}
</style></head><body>
<header><div style="display:flex;gap:8px;align-items:center"><div class="mark">S</div><div><b>Salvation TV</b><br><small>V51 • GENERAL FOOTBALL • ALL LEAGUES FREE • GHANA WORKS</small></div></div><div style="font-size:9px;color:#00ff88;background:rgba(0,255,136,0.15);padding:5px 10px;border-radius:12px">⚽ ALL LEAGUES</div></header>

<div id="player">
<iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen src="https://www.fifa.com/fifaplus/en/live"></iframe>
<div id="status">V51 - General Football - All Leagues Free - Ghana Works!</div>
</div>

<div id="meta"><h2 id="title">General Football - All Leagues Free</h2><p id="sub">Premier League, La Liga, Serie A, Bundesliga, Champions League, AFCON, GPL - All Free - Ghana Works!</p></div>

<div id="tabs">
<button class="tab live" onclick="cat('live',this)">📺 Live TV</button>
<button class="tab football on" onclick="cat('football',this)">⚽ Football General</button>
</div>

<div id="content"></div>

<div id="btm"><button class="btn s" onclick="shareL()">Share Link</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const DB={
football:[
  {section:"🔴 LIVE MATCHES FREE - Works Ghana"},
  {n:"FIFA+ Live Matches",e:"🏆",u:"https://www.fifa.com/fifaplus/en/live",d:"FIFA Official - World Cup Qualifiers, Women, Youth LIVE FREE!",badge:"🔴 FIFA+ LIVE FREE - OFFICIAL"},
  {n:"CAF TV Live Africa",e:"🌍",u:"https://www.cafonline.com/caf-tv/",d:"AFCON, CHAN, African Champions League FREE LIVE!",badge:"🌍 AFRICA LIVE FREE - CAF OFFICIAL"},
  {n:"Ghana GPL Live",e:"🇬🇭",u:"https://ghanafa.org/",d:"Ghana Premier League, Black Stars, FA Cup LIVE FREE - GFA!",badge:"🇬🇭 GPL & BLACK STARS FREE!"},
  
  {section:"⚽ PREMIER LEAGUE, LA LIGA, SERIE A - Highlights Free"},
  {n:"Premier League Official",e:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",u:"https://www.premierleague.com/en/news",d:"Premier League Official - Highlights, Goals FREE - EPL!",badge:"🏴󠁧󠁢󠁥󠁮󠁧󠁿 EPL HIGHLIGHTS FREE"},
  {n:"LaLiga Official",e:"🇪🇸",u:"https://www.laliga.com/en-GB/laliga-easports",d:"LaLiga - Real Madrid, Barca Highlights FREE!",badge:"🇪🇸 LALIGA FREE - REAL, BARCA"},
  {n:"Serie A Official",e:"🇮🇹",u:"https://www.legaseriea.it/en",d:"Serie A - Inter, AC Milan, Juventus FREE Highlights!",badge:"🇮🇹 SERIE A FREE"},
  {n:"Bundesliga Official",e:"🇩🇪",u:"https://www.bundesliga.com/en/bundesliga",d:"Bundesliga - Bayern, Dortmund FREE Highlights!",badge:"🇩🇪 BUNDESLIGA FREE"},
  {n:"Ligue 1 Official",e:"🇫🇷",u:"https://www.ligue1.fr/en",d:"Ligue 1 - PSG FREE Highlights!",badge:"🇫🇷 LIGUE 1 FREE"},
  
  {section:"🏆 CHAMPIONS LEAGUE & EUROPE - Free"},
  {n:"UEFA Champions League",e:"🏆",u:"https://www.uefa.com/uefachampionsleague/",d:"Champions League Official - Highlights, Goals FREE!",badge:"🏆 UCL FREE HIGHLIGHTS"},
  {n:"UEFA Europa League",e:"🥇",u:"https://www.uefa.com/uefaeuropaLeague/",d:"Europa League FREE Highlights!",badge:"🥇 EUROPA FREE"},
  
  {section:"📰 FOOTBALL NEWS & TRANSFERS - General Matters"},
  {n:"BBC Football News",e:"📰",u:"https://www.bbc.com/sport/football",d:"BBC Football - Transfer News, General Matters FREE!",badge:"📰 BBC FOOTBALL NEWS FREE"},
  {n:"Sky Sports Football",e:"📺",u:"https://www.skysports.com/football",d:"Sky Sports - Premier League News, Transfers FREE!",badge:"📺 SKY SPORTS NEWS FREE"},
  {n:"ESPN FC News",e:"⚡",u:"https://www.espn.com/soccer/",d:"ESPN FC - All Leagues News, General Matters FREE!",badge:"⚡ ESPN FC FREE"},
  {n:"Goal.com Live Scores",e:"⚽",u:"https://www.goal.com/en/live-scores",d:"Live Scores All Leagues FREE - General Football!",badge:"⚽ LIVE SCORES FREE - ALL LEAGUES"},
]
};

const frame=document.getElementById('frame');
const status=document.getElementById('status');
const content=document.getElementById('content');

function autoPlay(c,el){
 if(!c.u) return;
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('playing'));
 el.classList.add('playing');
 document.getElementById('title').textContent='▶️ '+c.n;
 document.getElementById('sub').textContent=c.d;
 status.textContent='⏳ Loading '+c.n+'... General Football - Ghana Works!';
 frame.src=c.u;
 status.textContent='✓ Playing '+c.n+' - General Football FREE - Ghana Works 100%!';
 document.getElementById('sub').textContent='✓ '+c.d+' - Inside App - Works Ghana - No DSTV!';
 window.scrollTo({top:0, behavior:'smooth'});
}

function buildFootball(){
 content.innerHTML='';
 let grid=null;
 DB.football.forEach((c)=>{
   if(c.section){
     let sec=document.createElement('div');
     sec.className='section-title';
     sec.textContent=c.section;
     content.appendChild(sec);
     grid=document.createElement('div');
     grid.className='grid';
     grid.style.paddingTop='4px';
     content.appendChild(grid);
   }else{
     let card=document.createElement('div');
     card.className='card';
     card.innerHTML=`<div class="th">${c.e}</div><div class="bd"><div class="nm">${c.n}</div><div class="sb">${c.d}</div><div class="ok">${c.badge}</div></div>`;
     card.onclick=()=>autoPlay(c,card);
     if(grid) grid.appendChild(card);
   }
 });
}

function cat(k,btn){
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
 btn.classList.add('on');
 if(k==='football') buildFootball();
 else { content.innerHTML='<div class="grid"><div class="card"><div class="th">📰</div><div class="bd"><div class="nm">Al Jazeera</div><div class="sb">News Live</div><div class="ok">TAP TO PLAY</div></div></div></div>'; frame.src='https://live-hls-web-aja.getaj.net/AJA/index.m3u8'; }
}

function shareL(){ let u=location.href; if(navigator.share) navigator.share({url:u}); else { navigator.clipboard.writeText(u); status.textContent='✓ Link copied!'; } }

buildFootball();
</script></body></html>
