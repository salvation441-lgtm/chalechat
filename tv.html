<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>Salvation TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080b14;--card:#121624;--card-hover:#1a1f36;--border:rgba(255,255,255,0.06);--text:#ffffff;--muted:#8b95b5;--accent:#ffffff}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);line-height:1.4;overflow-x:hidden}header{position:sticky;top:0;z-index:100;background:rgba(8,11,20,0.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;background:var(--text);border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#000;letter-spacing:-0.5px}.brand-text h1{font-size:15px;font-weight:700;letter-spacing:-0.3px;line-height:1}.brand-text p{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-top:3px}.player-section{position:relative;background:#000}.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:contain;background:#000}.player-meta{padding:14px 20px 18px;background:var(--bg)}.player-meta h2{font-size:17px;font-weight:700;letter-spacing:-0.3px;line-height:1.2}.player-meta .meta-row{display:flex;align-items:center;gap:8px;margin-top:6px}.live-pill{display:inline-flex;align-items:center;gap:5px;background:#ff1f1f;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.3px}.live-pill .dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:blink 1.5s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}.meta-text{font-size:12px;color:var(--muted);font-weight:500}.segment{position:sticky;top:73px;z-index:90;background:rgba(8,11,20,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 20px}.seg-track{display:flex;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px;width:fit-content;max-width:100%;overflow-x:auto}.seg-track::-webkit-scrollbar{display:none}.seg-btn{padding:8px 16px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:-0.1px;white-space:nowrap;transition:all 0.2s;cursor:pointer}.seg-btn.active{background:var(--text);color:#000;box-shadow:0 2px 12px rgba(255,255,255,0.12)}.content{padding:20px 16px 110px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.channel-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:0;overflow:hidden;transition:all 0.25s cubic-bezier(0.2,0.8,0.2,1);cursor:pointer}.channel-card:active{transform:scale(0.97)}.channel-card.active{background:var(--card-hover);border-color:rgba(255,255,255,0.12);box-shadow:0 8px 24px rgba(0,0,0,0.3),0 0 0 1px rgba(255,255,255,0.08) inset}.card-thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1f36 0%,#0f1323 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card-thumb:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.6) 100%)}.thumb-emoji{font-size:32px;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.4));position:relative;z-index:1}.card-body{padding:12px 12px 14px}.card-title{font-size:12px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-status{margin-top:8px;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:var(--muted)}.status-dot{width:5px;height:5px;border-radius:50%}.status-dot.live{background:#ff1f1f}.status-dot.movie{background:#8b95b5}.status-dot.radio{background:#ff8c00}.channel-card.active .card-title{color:#fff}.channel-card.active .card-sub{color:rgba(255,255,255,0.6)}.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,11,20,0.92);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:100}.btn{flex:1;height:48px;border-radius:12px;border:none;font-size:13px;font-weight:600;letter-spacing:-0.1px;transition:all 0.2s;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.btn-secondary{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border)}.btn-primary{background:#fff;color:#000}.btn:active{transform:scale(0.97)}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:12px 20px;border-radius:24px;font-size:12px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:all 0.35s cubic-bezier(0.2,0.8,0.2,1);z-index:200}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.content{max-width:900px;margin:0 auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="brand"><div class="brand-mark">S</div><div class="brand-text"><h1>Salvation TV</h1><p>Free Live</p></div></div><div style="width:32px;height:32px;background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px">◐</div></header>

<div class="player-section"><div class="player-wrap"><video id="video" controls playsinline></video></div><div class="player-meta"><h2 id="title">DW English</h2><div class="meta-row"><div class="live-pill" id="pill"><span class="dot"></span><span id="pillText">LIVE</span></div><span class="meta-text" id="sub">Germany News • Live 24/7</span></div></div></div>

<div class="segment"><div class="seg-track" id="segTrack"><button class="seg-btn active" onclick="setCat('live',this)">Live News</button><button class="seg-btn" onclick="setCat('movies',this)">Free Movies</button><button class="seg-btn" onclick="setCat('radio',this)">Radio</button><button class="seg-btn" onclick="setCat('all',this)">All</button></div></div>

<div class="content"><div class="grid" id="grid"></div></div>

<div class="bottom-bar"><button class="btn btn-secondary" onclick="shareApp()"><span>↗</span> Share</button><button class="btn btn-primary" onclick="installApp()">Add to Home</button></div>
<div id="toast"></div>

<script>
const DB={
live:[
{n:"Al Jazeera",e:"📰",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"World News 24/7",type:"LIVE"},
{n:"France 24",e:"🇫🇷",u:"https://live.france24.com/hls/live/2037218/F24_EN_LO_HLS/master.m3u8",d:"France • Live",type:"LIVE"},
{n:"DW English",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"Germany • Live",type:"LIVE"},
{n:"NASA TV",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"Space • Live",type:"LIVE"},
{n:"Red Bull TV",e:"🏎️",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",d:"Sports • Live",type:"LIVE"},
{n:"CGTN",e:"🌍",u:"https://news.cgtn.com/resource/live/english/cgtn-news.m3u8",d:"China • Live",type:"LIVE"},
],
movies:[
{n:"Sintel",e:"🎬",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",d:"Animation • Free",type:"MOVIE"},
{n:"Big Buck Bunny",e:"🐰",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",d:"Comedy • Free",type:"MOVIE"},
{n:"Tears of Steel",e:"💥",u:"https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8",d:"Sci-Fi • Free",type:"MOVIE"},
],
radio:[
{n:"Joy FM 99.7",e:"📻",u:"https://stream.zeno.fm/4x2b8q2kqg8uv",d:"Hit Music",type:"RADIO",t:"audio"},
{n:"Citi FM",e:"🎙️",u:"https://citi973.radioca.st/stream",d:"News & Talk",type:"RADIO",t:"audio"},
{n:"Peace FM",e:"🔥",u:"https://peacefmonline.radioca.st/stream",d:"Twi Music",type:"RADIO",t:"audio"},
{n:"Adom FM",e:"💚",u:"https://adom1063fm.radioca.st/stream",d:"Entertainment",type:"RADIO",t:"audio"},
],
};
DB.all=[...DB.live,...DB.movies,...DB.radio];

let hls;
const video=document.getElementById('video');

function toast(msg){
const t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2800);
}

function play(c,el){
document.querySelectorAll('.channel-card').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
document.getElementById('title').textContent=c.n;
document.getElementById('sub').textContent=c.d;
const pill=document.getElementById('pillText');
pill.textContent=c.type;
if(hls){hls.destroy();}
if(c.t==='audio'){
video.src=c.u;
video.play().then(()=>toast('Playing '+c.n)).catch(()=>toast('Tap play'));
return;
}
if(Hls.isSupported()){
hls=new Hls({maxBufferLength:12});
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
}else{
video.src=c.u;
video.play().catch(()=>{});
}
}

function build(list){
const g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
const d=document.createElement('div');d.className='channel-card'+(i===0?' active':'');
let dot=c.type==='LIVE'?'live':c.type==='RADIO'?'radio':'movie';
d.innerHTML=`<div class="card-thumb"><div class="thumb-emoji">${c.e}</div></div><div class="card-body"><div class="card-title">${c.n}</div><div class="card-sub">${c.d}</div><div class="card-status"><span class="status-dot ${dot}"></span>${c.type}</div></div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function setCat(cat,btn){
document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
build(DB[cat]);
}
function shareApp(){
if(navigator.share){navigator.share({title:'Salvation TV',text:'Free Live TV',url:location.href});}
else{navigator.clipboard.writeText(location.href);toast('Link copied');}
}
function installApp(){toast('Tap ⋮ → Add to Home screen');}

build(DB.live);
</script></body></html>
