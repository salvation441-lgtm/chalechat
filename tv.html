<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Ghana Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:20}
.logo-s{width:52px;height:52px;border-radius:14px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px gold;font-weight:900;color:gold;font-size:24px}
.hero{margin:12px;background:linear-gradient(135deg,#141e14,#0f1a0f);border-radius:20px;padding:20px;text-align:center;border:1px solid rgba(0,255,136,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.15);border-radius:18px;padding:16px;cursor:pointer;text-align:center;transition:.2s}
.card:active{transform:scale(.96);background:#1e2e1e}
.badge{font-size:10px;padding:4px 10px;border-radius:20px;background:#ff0000;color:#fff;margin-top:8px;display:inline-block}
.note{padding:10px;text-align:center;font-size:11px;color:#9aa79a}
</style>
</head>
<body>
<div class="header"><div class="logo-s">S</div><div><h1 style="font-size:20px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">TAP TO WATCH LIVE ON YOUTUBE</p></div></div>

<div class="hero">
<h2 style="font-size:18px">🇬🇭 Ghana Live TV</h2>
<p style="font-size:12px;opacity:.7;margin-top:6px">Tap any station — e go carry you go YouTube Live directly. No error, no block.</p>
</div>

<div class="grid" id="grid"></div>
<div class="note">All stations open on official YouTube Live • No more "Video unavailable"</div>

<script>
const stations=[
{name:"JoyNews",handle:"@myjoyonline",icon:"📰",color:"#ff0000"},
{name:"Joy Prime",handle:"@JoyPrimeTV",icon:"⭐",color:"#ff0055"},
{name:"Adom TV",handle:"@adomtvgh",icon:"🎬",color:"#00a651"},
{name:"UTV Ghana",handle:"@utvghanaOfficial",icon:"📡",color:"#ffcc00"},
{name:"GTV Ghana",handle:"@GTVGhana",icon:"📺",color:"#006b3d"},
{name:"TV3 Ghana",handle:"@TV3Ghana",icon:"📺",color:"#e4002b"},
{name:"GHOne TV",handle:"@GHOneTV",icon:"📡",color:"#001489"},
{name:"Onua TV",handle:"@OnuaTV",icon:"🎥",color:"#ff6600"},
{name:"Metro TV",handle:"@metrotvgh",icon:"📺",color:"#0047ab"},
{name:"Angel TV",handle:"@AngelTVGhana",icon:"😇",color:"#7b00ff"},
{name:"Net2 TV",handle:"@Net2TVGhana",icon:"📡",color:"#222"},
{name:"Citi TV",handle:"@CitiTube",icon:"🏙️",color:"#00b4d8"},
{name:"Ghana vs Argentina",handle:"@fifa",id:"-XRmFkzKq5E",icon:"🇬🇭",color:"#ff5050",isVideo:true},
{name:"Zambia vs France",handle:"@fifa",id:"z6PCKMYoDSs",icon:"🏆",color:"#ff5050",isVideo:true},
{name:"Nigeria vs Mexico",handle:"@fifa",id:"1e-Yq-GATiY",icon:"🇳🇬",color:"#ff5050",isVideo:true},
];

const grid=document.getElementById('grid');
stations.forEach(s=>{
 const d=document.createElement('div');d.className='card';
 d.onclick=()=>{
  if(s.isVideo){
   window.open(`https://www.youtube.com/watch?v=${s.id}`,'_blank');
  }else{
   window.open(`https://www.youtube.com/${s.handle}/live`,'_blank');
  }
 };
 d.innerHTML=`
  <div style="font-size:36px">${s.icon}</div>
  <h3 style="font-size:13px;margin-top:8px">${s.name}</h3>
  <span class="badge">LIVE ↗ YouTube</span>
  <p style="font-size:10px;opacity:.5;margin-top:6px">${s.handle}</p>
 `;
 grid.appendChild(d);
});
</script>
</body>
</html>
