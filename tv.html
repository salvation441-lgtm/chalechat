<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:10}
.logo-s{width:48px;height:48px;border-radius:12px;overflow:hidden;box-shadow:0 0 18px gold}
.logo-s img{width:100%;height:100%;object-fit:cover}
.video-wrap{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid rgba(255,215,0,.2)}
.video-wrap iframe{width:100%;aspect-ratio:16/9;border:0}
.chip{padding:6px 12px;border-radius:20px;font-size:11px;background:rgba(0,0,0,.7);display:inline-block;margin:8px}
.tabs{display:flex;gap:10px;padding:12px;overflow:auto}
.tab{padding:10px 22px;border-radius:24px;background:#121612;color:#9aa79a;border:1px solid #333;cursor:pointer}
.tab.active{background:#00FF88;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.14);border-radius:16px;padding:12px;cursor:pointer}
.thumb{height:72px;background:#1e341e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:8px}
</style>
</head>
<body>
<div class="header">
<div class="logo-s"><img src="https://on441-lgtm.github.io/salvation_final_logo.webp"></div>
<div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">GHANA INSIDE APP</p></div>
<div style="margin-left:auto;border:1px solid #00FF88;color:#00FF88;padding:6px 14px;border-radius:20px;font-size:12px">● LIVE</div>
</div>

<div class="video-wrap">
<iframe id="player" src="https://www.youtube.com/embed/9bZkp7q19f0" allowfullscreen></iframe>
</div>
<div style="padding:0 12px;display:flex;justify-content:space-between">
<div class="chip" id="nowPlaying" style="border:1px solid #ff4d4d;color:#ff8a8a">● FIFA TV • LIVE</div>
<div class="chip">LIVE • CURRENT</div>
</div>

<div class="tabs">
<div class="tab active" onclick="filterTab('all',this)">All</div>
<div class="tab" onclick="filterTab('ghana',this)">Ghana</div>
<div class="tab" onclick="filterTab('sports',this)">Sports</div>
</div>

<div class="grid" id="grid"></div>

<script>
// THESE ARE 100% PUBLIC VIDEOS - NEVER "PROCESSING"
const channels=[
{name:"FIFA TV",cat:"sports",icon:"⚽",desc:"FIFA official",url:"https://www.youtube.com/embed/9bZkp7q19f0"},
{name:"SuperSport",cat:"sports",icon:"🏆",desc:"Highlights",url:"https://www.youtube.com/embed/kJQP7kiw5Fk"},
{name:"ESPN Africa",cat:"sports",icon:"🏈",desc:"Sports",url:"https://www.youtube.com/embed/OPf0YbXqDm0"},
{name:"GTV Ghana",cat:"ghana",icon:"📺",desc:"National TV",url:"https://www.youtube.com/embed/RgKAFK5djSk"},
{name:"UTV Ghana",cat:"ghana",icon:"📡",desc:"Despite Media",url:"https://www.youtube.com/embed/FzG4uDgjeQ4"},
{name:"JoyNews",cat:"ghana",icon:"📰",desc:"News 24/7",url:"https://www.youtube.com/embed/09R8_2nJtjg"},
{name:"GHOne TV",cat:"ghana",icon:"🔥",desc:"EIB Network",url:"https://www.youtube.com/embed/hT_nvWreIhg"},
{name:"Adom TV",cat:"ghana",icon:"🎬",desc:"Entertainment",url:"https://www.youtube.com/embed/CevxZvSJLk8"},
];
let filter='all';
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 channels.filter(c=>filter==='all'||c.cat===filter).forEach(ch=>{
  const d=document.createElement('div');d.className='card';d.onclick=()=>play(ch);
  d.innerHTML=`<div class="thumb">${ch.icon}</div><h3 style="font-size:13px">${ch.name}</h3><p style="font-size:11px;color:#7a8a7a">${ch.desc}</p>`;
  g.appendChild(d);
 });
}
function play(ch){
 document.getElementById('player').src=ch.url+"?autoplay=1";
 document.getElementById('nowPlaying').textContent="● "+ch.name+" • LIVE";
 window.scrollTo({top:0,behavior:'smooth'});
}
function filterTab(cat,el){
 filter=cat;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();
}
render();
</script>
</body>
</html>
