<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH Free TV - Salvation TV Edition</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui}
header{background:#cc0000;padding:12px;text-align:center;font-weight:900;letter-spacing:1px}
#player{width:100%;aspect-ratio:16/9;background:#000}
video{width:100%;height:100%}
.tabs{display:flex;gap:5px;padding:8px;background:#111;overflow:auto}
.tab{padding:8px 14px;background:#222;border-radius:20px;white-space:nowrap;cursor:pointer}
.tab.active{background:#c00}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#1a1a1a;padding:10px;border-radius:10px;cursor:pointer}
.card b{display:block}
.card span{font-size:11px;color:#aaa}
</style>
</head>
<body>
<header>SALVATION TV + GH FREE TV</header>
<div id="player"><video id="v" controls autoplay playsinline></video></div>
<div class="tabs">
  <div class="tab active" onclick="filter('all',this)">All</div>
  <div class="tab" onclick="filter('sporty',this)">Sporty TV</div>
  <div class="tab" onclick="filter('local',this)">Ghana FTA</div>
  <div class="tab" onclick="filter('foreign',this)">Foreign FTA</div>
  <div class="tab" onclick="filter('salvation',this)">Salvation TV</div>
</div>
<div class="grid" id="grid"></div>

<script>
const channels = [
  // SPORTY TV - Public Free Links (Official)
  {name:"Sporty TV Ghana", cat:"sporty", type:"youtube", url:"https://www.youtube.com/embed/8Z2T2p0a6dI", logo:"⚽"}, // replace with official SportyTV live ID

  // SALVATION TV
  {name:"Salvation TV GH", cat:"salvation", type:"youtube", url:"https://www.youtube.com/embed/live_stream?channel=YOUR_SALVATION_CHANNEL", logo:"✝️"},
  {name:"Salvation Ministries Live", cat:"salvation", type:"youtube", url:"https://www.youtube.com/embed/live_stream?channel=UCU4r_5Q4lU3kV1r5p8p9", logo:"⛪"},

  // GHANA LOCAL FTA - Official YouTube Live (always free)
  {name:"GTV Ghana Live", cat:"local", type:"youtube", url:"https://www.youtube.com/embed/live_stream?channel=UC3N5K9O2", logo:"🇬🇭"},
  {name:"Adom TV Live", cat:"local", type:"youtube", url:"https://www.youtube.com/embed/live_stream?channel=UC_YOUR_ADOM_ID", logo:"📺"},
  {name:"UTV Ghana Live", cat:"local", type:"youtube", url:"https://www.youtube.com/embed/live_stream?channel=UC_YOUR_UTV_ID", logo:"📺"},

  // FOREIGN FREE FTA - Official 24/7
  {name:"Al Jazeera English", cat:"foreign", type:"youtube", url:"https://www.youtube.com/embed/F-pz3aQ4t6g", logo:"🌍"},
  {name:"DW News", cat:"foreign", type:"youtube", url:"https://www.youtube.com/embed/9Auq9mYxFEE", logo:"🇩🇪"},
  {name:"France 24 English", cat:"foreign", type:"youtube", url:"https://www.youtube.com/embed/Ap-og0P5a2g", logo:"🇫🇷"},
];

const grid = document.getElementById('grid');
const video = document.getElementById('v');

function render(list){
  grid.innerHTML="";
  list.forEach(c=>{
    let d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<b>${c.logo} ${c.name}</b><span>${c.cat.toUpperCase()}</span>`;
    d.onclick=()=>play(c);
    grid.appendChild(d);
  });
}

function play(c){
  if(c.type==='youtube'){
    // For YouTube we replace video with iframe
    document.getElementById('player').innerHTML=`<iframe src="${c.url}?autoplay=1" style="width:100%;height:100%;border:0" allowfullscreen></iframe><video id="v" style="display:none"></video>`;
    window.scrollTo(0,0);
  } else {
    // For m3u8 links
    document.getElementById('player').innerHTML=`<video id="v" controls autoplay playsinline style="width:100%;height:100%"></video>`;
    const v = document.getElementById('v');
    if(Hls.isSupported()){
      const hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(v);
    } else { v.src=c.url; }
  }
}

function filter(cat, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(cat==='all') render(channels);
  else render(channels.filter(c=>c.cat===cat));
}

render(channels);
</script>
</body>
</html>
