<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050814"><title>Salvation TV Pro V18 - Nice Popup</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#050814;color:#fff}header{position:sticky;top:0;z-index:100;background:rgba(5,8,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;align-items:center;gap:10px}.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#00e676,#00b894);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}.logo-text b{font-size:16px;display:block}.logo-text small{font-size:9px;color:#8aa0d0;letter-spacing:1.5px}.pro-badge{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#000;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:900}#hero{position:relative;background:#000}.video-wrap{width:100%;aspect-ratio:16/9;background:#000;position:relative}video,iframe{width:100%;height:100%;border:none}.live-badge{position:absolute;top:12px;left:12px;background:#ff0000;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;animation:pulse 2s infinite;z-index:2}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 10px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}.hero-info{padding:14px 16px;background:linear-gradient(180deg,#0e152b 0%,#050814 100%)}.hero-info h1{font-size:18px;font-weight:900}.hero-info p{font-size:12px;color:#8aa0d0;margin-top:4px}#catScroll{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;background:#050814;position:sticky;top:62px;z-index:99}#catScroll::-webkit-scrollbar{display:none}.cat{white-space:nowrap;padding:10px 18px;border-radius:25px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;font-weight:700}.cat.on{background:#00e676;color:#000;border-color:#00e676;box-shadow:0 0 20px rgba(0,230,118,0.4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 110px}.card{background:linear-gradient(135deg,#131c37 0%,#0e152b 100%);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;text-align:center;transition:0.3s}.card.on{background:linear-gradient(135deg,#00e676 0%,#00b894 100%);color:#000;border-color:#00e676;transform:scale(1.02);box-shadow:0 8px 30px rgba(0,230,118,0.3)}.card-emoji{font-size:28px;display:block;margin-bottom:6px}.card-name{font-size:12px;font-weight:900}.card-desc{font-size:9px;opacity:0.7;margin-top:4px}#bottomBar{position:fixed;bottom:0;left:0;right:0;background:rgba(5,8,20,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);padding:10px 16px;display:flex;gap:10px;z-index:100}.bBtn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;font-size:11px}.bBtn.primary{background:#00e676;color:#000}.bBtn.secondary{background:rgba(255,255,255,0.1);color:#fff}

/* NICE AI POPUP - PROFESSIONAL */
#popupOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.3s ease}
#popupOverlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(0.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.popupBox{width:100%;max-width:380px;background:linear-gradient(135deg,#131c37 0%,#0e152b 100%);border:1px solid rgba(0,230,118,0.3);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(0,230,118,0.15);animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.popupIcon{width:64px;height:64px;background:linear-gradient(135deg,#00e676,#00b894);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 20px rgba(0,230,118,0.3)}
.popupTitle{font-size:20px;font-weight:900;text-align:center;margin-bottom:8px}
.popupSub{font-size:12px;color:#8aa0d0;text-align:center;margin-bottom:20px;line-height:1.5}
.popupSteps{background:rgba(0,0,0,0.3);border-radius:16px;padding:14px;margin-bottom:20px}
.step{display:flex;gap:12px;margin-bottom:12px;font-size:12px;line-height:1.4}.step:last-child{margin-bottom:0}.stepNum{width:24px;height:24px;background:#00e676;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex-shrink:0}
.popupActions{display:flex;gap:10px}.popupBtn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:900;font-size:13px;cursor:pointer;transition:0.2s}.popupBtn.primary{background:#00e676;color:#000}.popupBtn.primary:active{transform:scale(0.97)}.popupBtn.secondary{background:rgba(255,255,255,0.08);color:#fff}
.shareInput{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;font-size:11px;color:#00e676;text-align:center;margin-bottom:16px;outline:none}
</style></head><body>
<header><div class="logo"><div class="logo-icon">S</div><div class="logo-text"><b>SALVATION TV</b><small>SALVATION TECH PRO</small></div></div><div class="pro-badge">PRO V18</div></header>
<div id="hero"><div class="video-wrap"><video id="video" controls autoplay playsinline></video><div class="live-badge">● LIVE FREE</div></div><div class="hero-info"><h1 id="chName">Red Bull TV - Extreme Sports</h1><p id="chStat">● Professional Popup Edition • 40+ Channels</p></div></div>
<div id="catScroll">
<button class="cat on" onclick="switchCat('news',this)">📰 News</button>
<button class="cat" onclick="switchCat('movies',this)">🎬 Movies</button>
<button class="cat" onclick="switchCat('telenovela',this)">💃 Telenovela</button>
<button class="cat" onclick="switchCat('lifestyle',this)">👗 Lifestyle</button>
<button class="cat" onclick="switchCat('sports',this)">⚽ Sports</button>
<button class="cat" onclick="switchCat('radio',this)">📻 Radio</button>
<button class="cat" onclick="switchCat('ghana',this)">🇬🇭 Ghana</button>
</div>
<div class="grid" id="grid"></div>
<div id="bottomBar"><button class="bBtn secondary" onclick="openSharePopup()">📤 Share App</button><button class="bBtn primary" onclick="openInstallPopup()">📲 Install App</button></div>

<!-- NICE AI POPUP -->
<div id="popupOverlay" onclick="closePopup(event)">
<div class="popupBox" onclick="event.stopPropagation()">
<div class="popupIcon" id="popupIcon">📲</div>
<div class="popupTitle" id="popupTitle">Install as Pro App</div>
<div class="popupSub" id="popupSub">Get DSTV-like experience on your phone</div>
<div id="popupContent"></div>
<div class="popupActions">
<button class="popupBtn secondary" onclick="closePopup()">Cancel</button>
<button class="popupBtn primary" id="popupActionBtn" onclick="handlePopupAction()">Got it! 🚀</button>
</div>
</div>
</div>

<script>
const DB={
news:[{n:"Al Jazeera EN",e:"📰",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"News Live"},{n:"France 24",e:"🇫🇷",u:"https://live.france24.com/hls/live/2037218/F24_EN_LO_HLS/master.m3u8",d:"France News"},{n:"DW English",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"Germany News"},{n:"NASA TV",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"Space Live"}],
movies:[{n:"FilmRise Movies",e:"🎬",u:"https://filmrisemovies-filmrise-1-us.samsung.wurl.tv/playlist.m3u8",d:"Free Movies"},{n:"FilmRise Action",e:"💥",u:"https://filmriseaction-filmrise-1-us.samsung.wurl.tv/playlist.m3u8",d:"Action"}],
telenovela:[{n:"Telenovela Drama",e:"💃",u:"https://telenovela-telenovela-1-us.samsung.wurl.tv/playlist.m3u8",d:"Spanish Love"}],
lifestyle:[{n:"Fashion TV",e:"👗",u:"https://fashiontv-fashiontv-1-us.samsung.wurl.tv/playlist.m3u8",d:"Runway"},{n:"Tastemade",e:"🍳",u:"https://tastemade-tastemade-1-us.samsung.wurl.tv/playlist.m3u8",d:"Food & Travel"}],
sports:[{n:"Red Bull TV",e:"🏎️",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",d:"Extreme Sports"},{n:"SportsGrid",e:"⚽",u:"https://sportsgrid-sportsgrid-1-us.samsung.wurl.tv/playlist.m3u8",d:"Sports News"},{n:"Stadium",e:"🏟️",u:"https://stadium-stadium-1-us.samsung.wurl.tv/playlist.m3u8",d:"Live Sports"}],
radio:[{n:"Joy FM 99.7",e:"📻",u:"https://195.154.182.222:8000/joy",d:"Ghana #1",t:"audio"},{n:"Citi FM 97.3",e:"🎙️",u:"https://citi973.radioca.st/stream",d:"News",t:"audio"}],
ghana:[{n:"GTV Ghana",e:"🇬🇭",u:"https://www.youtube-nocookie.com/embed/5qap5aO4i9A",d:"GTV YouTube",t:"yt"}]
};
let hls; const video=document.getElementById('video');
function play(c,el){
document.querySelectorAll('.card').forEach(b=>b.classList.remove('on'));
el.classList.add('on');
document.getElementById('chName').innerText=c.e+' '+c.n;
document.getElementById('chStat').innerText='● Playing: '+c.d;
let wrap=document.querySelector('.video-wrap'); let ifr=wrap.querySelector('iframe'); if(ifr) ifr.remove();
if(c.t==='yt'){video.style.display='none';let f=document.createElement('iframe');f.src=c.u+'?autoplay=1&mute=0';f.style.width='100%';f.style.height='100%';f.style.border='none';f.allow='autoplay; fullscreen';wrap.prepend(f);return;}
video.style.display='block';
if(hls){hls.destroy();}
if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}
else{video.src=c.u;video.play().catch(()=>{});}
}
function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
d.innerHTML='<span class="card-emoji">'+c.e+'</span><span class="card-name">'+c.n+'</span><small class="card-desc">'+c.d+'</small>';
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function switchCat(cat,btn){
document.querySelectorAll('.cat').forEach(b=>b.className='cat');
btn.className='cat on';
build(DB[cat]);
}

// NICE POPUP LOGIC - NO MORE UGLY ALERT!
let popupMode='install';
function openInstallPopup(){
popupMode='install';
document.getElementById('popupIcon').innerText='📲';
document.getElementById('popupTitle').innerText='Install as Pro App';
document.getElementById('popupSub').innerText='Make it work like DSTV app on your phone';
document.getElementById('popupContent').innerHTML=`
<div class="popupSteps">
<div class="step"><div class="stepNum">1</div><div>Tap the <b>3 dots ⋮</b> top right in Chrome</div></div>
<div class="step"><div class="stepNum">2</div><div>Tap <b>"Add to Home screen"</b> or <b>"Install app"</b></div></div>
<div class="step"><div class="stepNum">3</div><div>Your Salvation TV Pro go appear for your apps like DSTV! 😎</div></div>
</div>`;
document.getElementById('popupActionBtn').innerText='Got it! 🚀';
document.getElementById('popupOverlay').classList.add('show');
}
function openSharePopup(){
popupMode='share';
document.getElementById('popupIcon').innerText='📤';
document.getElementById('popupTitle').innerText='Share Salvation TV Pro';
document.getElementById('popupSub').innerText='Spread this free TV app to Ghana!';
document.getElementById('popupContent').innerHTML=`
<input class="shareInput" id="shareLink" value="${window.location.href}" readonly>
<div class="popupSteps">
<div class="step"><div class="stepNum">🔥</div><div><b>40+ Free Channels</b> - Movies, Telenovela, Sports</div></div>
<div class="step"><div class="stepNum">📱</div><div>Works like DSTV app - No subscription!</div></div>
<div class="step"><div class="stepNum">🇬🇭</div><div>Built in Accra by Salvation Tech Pro</div></div>
</div>`;
document.getElementById('popupActionBtn').innerText='Copy & Share 📋';
document.getElementById('popupOverlay').classList.add('show');
setTimeout(()=>{document.getElementById('shareLink')?.select();},100);
}
function closePopup(e){
if(e && e.target.id!=='popupOverlay') return;
document.getElementById('popupOverlay').classList.remove('show');
}
function handlePopupAction(){
if(popupMode==='share'){
let input=document.getElementById('shareLink');
input.select();
document.execCommand('copy');
if(navigator.share){
navigator.share({title:'Salvation TV Pro - Free Ghana TV',text:'Watch 40+ free channels - Movies, Telenovela, Sports, News!',url:window.location.href});
}else{
document.getElementById('popupActionBtn').innerText='Copied! ✅';
setTimeout(()=>closePopup(),800);
return;
}
}
closePopup();
}
build(DB.sports);
</script></body></html>
