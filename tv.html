let hls;
const video=document.getElementById('video');

function play(c,el){
document.querySelectorAll('.card').forEach(b=>b.classList.remove('on'));
el.classList.add('on');
document.getElementById('chName').innerText=c.e+' '+c.n;
document.getElementById('chStat').innerText=c.d+' • '+c.tag;

let badge=document.getElementById('badge');
if(c.tag.includes('RADIO')){
badge.className='badge radio';
badge.innerText='📻 RADIO - TAP PLAY BUTTON';
}else if(c.tag.includes('LIVE')){
badge.className='badge live';
badge.innerText='● LIVE - NO DURATION';
}else{
badge.className='badge movie';
badge.innerText='▶️ FREE MOVIE';
}

if(hls){hls.destroy();}
video.style.display='block';

if(c.t==='audio'){
video.src=c.u;
video.load();
video.play().then(()=>{
document.getElementById('chStat').innerText='✅ Playing! '+c.d;
}).catch(e=>{
document.getElementById('chStat').innerText='⚠️ Tap play button on video player - Browser block autoplay for audio';
});
return;
}
if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
}else{
video.src=c.u;
video.play().catch(()=>{});
}
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
let tagClass=c.tag.includes('RADIO')?'radio':c.tag.includes('LIVE')?'live':'movie';
d.innerHTML=`<div class="card-emoji">${c.e}</div><div class="card-name">${c.n}</div><div class="card-desc">${c.d}</div><div class="tag ${tagClass}">${c.tag}</div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function setCat(cat,btn){
document.querySelectorAll('.tab').forEach(b=>b.className='tab');
btn.className='tab on';
build(DB[cat]);
// Scroll tabs to center
btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
function openPop(type){

if(type==='help'){
