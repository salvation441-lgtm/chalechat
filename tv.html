<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvation TV Lite</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#080b14;color:#fff}header{background:#0e1220;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1f36}.logo{width:34px;height:34px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}.lite{background:#00e676;color:#000;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:800}#player{width:100%;aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;background:#000}#tap{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5} #tap b{background:#fff;color:#000;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}#info{padding:10px 14px;background:#0e1220;border-bottom:1px solid #1a1f36}#info h2{font-size:14px}#info p{font-size:11px;color:#8b95b5;margin-top:3px}#tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#080b14;border-bottom:1px solid #1a1f36}#tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid #1a1f36;background:#121624;color:#8b95b5;font-size:11px;font-weight:600}.tab.on{background:#fff;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 100px}.card{background:#121624;border:1px solid #1a1f36;border-radius:12px;overflow:hidden}.card.on{border-color:#fff}.th{height:70px;background:#1a1f36;display:flex;align-items:center;justify-content:center;font-size:24px}.bd{padding:8px}.nm{font-size:11px;font-weight:700}.sb{font-size:9px;color:#8b95b5}.tg{font-size:8px;margin-top:4px;display:inline-block;padding:2px 6px;border-radius:8px;font-weight:700}.tg.r{background:#ff8c001a;color:#ff8c00}.tg.l{background:#00e6761a;color:#00e676}#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px 12px;display:flex;gap:8px}.btn{flex:1;height:42px;border-radius:10px;border:none;font-weight:600;font-size:12px}.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}
</style></head><body>
<header><div style="display:flex;gap:10px;align-items:center"><div class="logo">S</div><div><b style="font-size:13px">Salvation TV</b><br><small style="font-size:9px;color:#8b95b5">ULTRA LITE</small></div></div><div class="lite">✓ 95% LESS DATA</div></header>

<div id="player"><video id="v" controls playsinline preload="none" poster=""></video><div id="tap" onclick="goPlay()"><b id="playIcon">📻</b><div style="margin-top:10px;font-weight:700;font-size:12px" id="tapText">Tap to Play Radio - 5KB/s</div><div style="margin-top:6px;font-size:10px;background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:12px" id="tapSub">Radio uses only 20MB per hour</div></div></div>

<div id="info"><h2 id="title">Joy FM - Tap to Play</h2><p id="sub">📻 5KB/s • No video load until you tap • Save data</p></div>

<div id="tabs">
<button class="tab on" onclick="cat('radio',this)">📻 Radio 5KB/s - USE THIS</button>
<button class="tab" onclick="cat('live',this)">Live 80KB/s</button>
<button class="tab" onclick="cat('movies',this)">Movies Small</button>
</div>

<div class="grid" id="grid"></div>

<div id="btm"><button class="btn s" onclick="shareApp()">Share</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
let HLS=null;
const DB={
radio:[
{n:"Joy FM",e:"📻",u:"https://stream.zeno.fm/4x2b8q2kqg8uv",d:"5KB/s • 20MB/hr",tg:"5KB/s",a:1},
{n:"Citi FM",e:"🎙️",u:"https://citi973.radioca.st/stream",d:"8KB/s • 30MB/hr",tg:"8KB/s",a:1},
{n:"Peace FM",e:"🔥",u:"https://peacefmonline.radioca.st/stream",d:"8KB/s • 30MB/hr",tg:"8KB/s",a:1},
{n:"Adom FM",e:"💚",u:"https://adom1063fm.radioca.st/stream",d:"8KB/s",tg:"8KB/s",a:1},
{n:"BBC World",e:"🌐",u:"https://stream.live.vc.bbcmedia.co.uk/bbc_world_service",d:"10KB/s",tg:"10KB/s",a:1},
{n:"Asaase",e:"📡",u:"https://asaaseradio.radioca.st/stream",d:"8KB/s",tg:"8KB/s",a:1},
],
live:[
// These be low quality 240p max - small buffer
{n:"Al Jazeera",e:"📰",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"80KB/s • 300MB/hr",tg:"80KB/s LOW"},
{n:"DW",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"70KB/s",tg:"70KB/s LOW"},
{n:"CGTN",e:"🌍",u:"https://news.cgtn.com/resource/live/english/cgtn-news.m3u8",d:"60KB/s",tg:"60KB/s LOW"},
{n:"NASA",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"50KB/s",tg:"50KB/s LOW"},
],
movies:[
// USE SMALL MP4 - NOT HEAVY HLS - LOAD FAST
{n:"Bunny Small",e:"🐰",u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",d:"Small MP4 • Fast",tg:"SMALL MP4",mp4:1},
{n:"Sintel Small",e:"🎬",u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",d:"Small MP4 • Fast",tg:"SMALL MP4",mp4:1},
{n:"For Bigger Joy",e:"🚗",u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",d:"Small MP4",tg:"SMALL MP4",mp4:1},
{n:"For Bigger Blazes",e:"🔥",u:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",d:"Small MP4",tg:"SMALL MP4",mp4:1},
]
};

let cur=null, curEl=null;
const v=document.getElementById('v');
const tap=document.getElementById('tap');

async function loadHls(){
if(HLS) return HLS;
let s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/hls.js@latest';
document.head.appendChild(s);
await new Promise(r=>s.onload=r);
HLS=true;
return true;
}

async function goPlay(){
if(!cur) return;
tap.style.display='none';
if(cur.a || cur.mp4){
v.src=cur.u;
v.play().catch(()=>{});
return;
}
await loadHls();
if(window.Hls && Hls.isSupported()){
if(window.hls) window.hls.destroy();
let hls=new Hls({maxBufferLength:2, maxMaxBufferLength:5, maxBufferSize:5*1000*1000});
window.hls=hls;
hls.loadSource(cur.u);
hls.attachMedia(v);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{
// force low quality
let l=hls.levels;
let low=0;
for(let i=0;i<l.length;i++){ if(l[i].height<=240) low=i; }
hls.currentLevel=low;
v.play().catch(()=>{});
});
}else{
v.src=cur.u;
v.play().catch(()=>{});
}
}

function play(c,el){
cur=c;
document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));
el.classList.add('on');
document.getElementById('title').textContent=c.n+' - Tap Play to Start';
document.getElementById('sub').textContent=c.d+' • Tap big button - No data until tap';
document.getElementById('playIcon').textContent=c.a?'📻':c.mp4?'🎬':'📺';
document.getElementById('tapText').textContent='Tap to Play '+c.n+' - '+c.tg;
document.getElementById('tapSub').textContent=c.a?'Radio = '+c.d+' - Best for low data':'Video = '+c.d+' - Click to load';
tap.style.display='flex';
v.pause();
v.removeAttribute('src');
v.load();
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
let tc=c.a?'r':'l';
d.innerHTML=`<div class="th">${c.e}</div><div class="bd"><div class="nm">${c.n}</div><div class="sb">${c.d}</div><span class="tg ${tc}">${c.tg}</span></div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
if(i==0){ cur=c; curEl=d; document.getElementById('title').textContent=c.n+' - Ready - Tap Play'; }
});
}

function cat(k,btn){
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
btn.classList.add('on');
build(DB[k]);
}

function shareApp(){
if(navigator.share) navigator.share({title:'Salvation TV Lite',url:location.href});
else navigator.clipboard.writeText(location.href);
}

build(DB.radio);
</script></body></html>
