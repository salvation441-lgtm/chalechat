<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvation TV - Complete</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060a06;color:#fff;font-family:system-ui;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.header{padding:14px;background:#0a140a;border-bottom:1px solid #222;font-weight:900;letter-spacing:0.5px}.header span{color:#00ff88}
.player-box{margin:10px;border-radius:16px;background:#000;height:32vh;min-height:220px;border:1px solid #333;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player-box video,.player-box iframe{width:100%;height:100%;border:0;position:absolute;inset:0;background:#000}
#status{position:absolute;z-index:10;background:#111;padding:8px 14px;border-radius:20px;font-size:11px;border:1px solid #333;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none}.tab{padding:9px 15px;border-radius:20px;font-size:10px;font-weight:800;border:1px solid #333;background:#111;white-space:nowrap;cursor:pointer}.tab.active{background:#fff;color:#000}
.content{flex:1;overflow-y:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#111;border-radius:14px;padding:12px 4px;text-align:center;border:1px solid #222;cursor:pointer;transition:0.1s}.card:active{transform:scale(0.96)}
.card h3{font-size:7.5px;margin-top:4px;line-height:1.1;font-weight:700}
.badge{font-size:5px;padding:3px 7px;border-radius:10px;margin-top:5px;display:inline-block;font-weight:900;letter-spacing:0.5px}
.badge.hls{background:#ffcc00;color:#000}.badge.yt{background:#ff0000;color:#fff}.badge.inside{background:#00ff88;color:#000}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header">Salvation <span>TV</span></div>
<div class="player-box"><div id="status">TAP A CHANNEL BELOW</div><video id="v" controls autoplay muted playsinline></video><iframe id="yt" class="hidden" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>
<div class="tabs">
<div class="tab active" id="t-ghana" onclick="st('ghana')">Ghana</div>
<div class="tab" id="t-foreign" onclick="st('foreign')">Foreign</div>
<div class="tab" id="t-sports" onclick="st('sports')">Sports</div>
</div>
<div class="content">
<div class="grid" id="g-ghana"></div>
<div class="grid hidden" id="g-foreign"></div>
<div class="grid hidden" id="g-sports"></div>
</div>
<script>
const v=document.getElementById('v'), yt=document.getElementById('yt'), stt=document.getElementById('status');
let h=null;
function show(t){stt.textContent=t; stt.classList.remove('hidden');}
function hide(){stt.classList.add('hidden');}
function playHLS(u){
  yt.classList.add('hidden'); yt.src=''; v.classList.remove('hidden');
  if(h){h.destroy();h=null;} show('CONNECTING...');
  if(Hls.isSupported()){
    h=new Hls({enableWorker:true, lowLatencyMode:true});
    h.loadSource(u); h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED,()=>{ v.play().then(hide).catch(()=>{ show('TAP PLAY BUTTON'); }); });
    h.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ show('OFFLINE - TRY ANOTHER'); setTimeout(hide,2000); } });
  }else{ v.src=u; v.play().then(hide).catch(()=>show('TAP PLAY')); }
}
function playYTInside(id){
  if(h){h.destroy();h=null;} v.pause(); v.classList.add('hidden'); yt.classList.remove('hidden');
  show('LOADING...'); yt.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&origin=https://on441-lgtm.github.io`;
  yt.onload=()=>hide(); setTimeout(hide,2500);
}
function openLink(u){ window.open(u, '_blank'); }
function mk(g,fn,name,type){
  const d=document.createElement('div'); d.className='card';
  d.style.borderColor=type==='hls'?'#ffcc00':type==='inside'?'#00ff88':'#333';
  d.onclick=fn; d.innerHTML=`<div style="font-weight:900;font-size:18px">${name[0]}</div><h3>${name}</h3><span class="badge ${type}">${type.toUpperCase()}</span>`;
  g.appendChild(d);
}

const gh=document.getElementById('g-ghana');
// ===== GHANA - ALL WORKING LOCALS BACK - TV3 JOIN YOUTUBE SQUAD =====
mk(gh, ()=>playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8"), "MAX TV", "hls"); // only HLS wey stable
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=TV3+Ghana+live+today"), "TV3 Ghana", "yt"); // TV3 NOW YOUTUBE SQUAD
mk(gh, ()=>openLink("https://www.youtube.com/@myjoyonline"), "JoyNews", "yt"); // REAL 500k
mk(gh, ()=>openLink("https://www.youtube.com/@adomtvgh"), "Adom TV", "yt"); // REAL
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=UTV+Ghana+Online+live"), "UTV Ghana", "yt"); // search - no monkey
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=GHOne+TV+live+today"), "GHOne TV", "yt");
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=Channel+One+TV+Ghana+live"), "Channel One", "yt");
mk(gh, ()=>openLink("https://www.youtube.com/results?search_query=Onua+TV+live"), "Onua TV", "yt");

const fo=document.getElementById('g-foreign');
mk(fo, ()=>playHLS("https://live-hls-web-aje.getaj.net/AJE/01.m3u8"), "Al Jazeera HLS", "hls");
mk(fo, ()=>playHLS("https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8"), "France24 HLS", "hls");
mk(fo, ()=>playYTInside("gCNeDWCI0vo"), "Al Jazeera YT", "inside");
mk(fo, ()=>playYTInside("21X5lGlDOfg"), "NASA ISS", "inside");
mk(fo, ()=>playYTInside("W3ODvWk0y0g"), "DW News", "inside");

const sp=document.getElementById('g-sports');
// RED BULL FIXED + HIGHLIGHTS AROUND THE WORLD
mk(sp, ()=>playHLS("https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8"), "Red Bull TV", "hls"); // FIXED - no token
mk(sp, ()=>openLink("https://www.redbull.com/int-en/tv/live/BORB-AT"), "Red Bull Site", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@fifaworldcup"), "FIFA World Cup", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@caf"), "CAF Africa TV", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@premierleague"), "Premier League", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@LaLiga"), "LaLiga", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@NBA"), "NBA Highlights", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@ESPNFC"), "ESPN FC", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@SkySportsFootball"), "Sky Sports", "yt");
mk(sp, ()=>openLink("https://www.youtube.com/@CBSSportsGolazo"), "Golazo Highlights", "yt");

function st(t){
  ['ghana','foreign','sports'].forEach(id=>{
    document.getElementById('g-'+id).classList.toggle('hidden', id!==t);
    document.getElementById('t-'+id).classList.toggle('active', id===t);
  });
}
st('ghana');
// No auto-play - user tap to avoid 0:00 mute issue on phone
show('TAP A CHANNEL BELOW TO PLAY');
</script>
</body>
</html>
