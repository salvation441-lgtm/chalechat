<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Salvation TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080b14;--card:#121624;--border:rgba(255,255,255,0.06);--muted:#8b95b5}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--bg);color:#fff}header{position:sticky;top:0;z-index:100;background:rgba(8,11,20,0.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000}.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}video{width:100%;height:100%;background:#000}.player-meta{padding:14px 18px;background:var(--bg)}.player-meta h2{font-size:16px;font-weight:700}.meta-row{display:flex;align-items:center;gap:8px;margin-top:6px}.pill{background:#ff1f1f;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700}.meta-text{font-size:11px;color:var(--muted)}#tabs{position:sticky;top:67px;z-index:90;background:rgba(8,11,20,0.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;gap:8px;overflow-x:auto}#tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;padding:9px 16px;border-radius:22px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}.tab.on{background:#fff;color:#000;border-color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 14px 110px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:0.2s}.card.on{border-color:rgba(255,255,255,0.2);transform:translateY(-2px)}.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1f36,#0f1323);display:flex;align-items:center;justify-content:center;font-size:28px}.body{padding:10px 12px}.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{margin-top:6px;font-size:9px;color:var(--muted);font-weight:600}#bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,11,20,0.92);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:12px 14px;display:flex;gap:10px}.btn{flex:1;height:46px;border-radius:12px;border:none;font-weight:600;font-size:12px;cursor:pointer}.btn.s{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border)}.btn.p{background:#fff;color:#000}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-size:11px;font-weight:600;display:none}
</style></head><body>
<header><div class="brand"><div class="mark">S</div><div><b style="font-size:14px">Salvation TV</b><br><small style="font-size:9px;color:var(--muted);letter-spacing:0.6px;text-transform:uppercase">Free Live • 20+ Channels</small></div></div><div style="font-size:10px;color:var(--muted)">v31 EXPANDED</div></header>

<div class="player-wrap"><video id="video" controls playsinline></video></div>
<div class="player-meta"><h2 id="title">Loading...</h2><div class="meta-row"><div class="pill" id="pill">● LIVE</div><span class="meta-text" id="sub">Select channel below</span></div></div>

<div id="tabs">
<button class="tab on" onclick="setCat('live',this)">Live News (12)</button>
<button class="tab" onclick="setCat('world',this)">World (8)</button>
<button class="tab" onclick="setCat('movies',this)">Movies (6)</button>
<button class="tab" onclick="setCat('docs',this)">Docs</button>
<button class="tab" onclick="setCat('radio',this)">Radio (6)</button>
<button class="tab" onclick="setCat('all',this)">All 30+</button>
</div>

<div class="grid" id="grid"></div>

<div id="bottom"><button class="btn s" onclick="shareApp()">↗ Share</button><button class="btn p" onclick="installApp()">Add to Home</button></div>
<div id="toast"></div>

{n:"Weather Channel",e:"⛅",u:"https://weather-lifestyle-1-us.rakuten.wideorbit.com/playlist.m3u8",d:"Weather Live",t:"LIVE"},

],

{n:"Earth Cam",e:"🌎",u:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",d:"Nature Free",t:"MOVIE"},

DB.all=[...DB.live,...DB.world,...DB.movies,...DB.docs,...DB.radio];

let hls;
const video=document.getElementById('video');

function toast(m){
let t=document.getElementById('toast');
t.textContent=m;
t.style.display='block';
setTimeout(()=>t.style.display='none',2500);
}

function play(c,el){
document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));
el.classList.add('on');
document.getElementById('title').textContent=c.n;
document.getElementById('sub').textContent=c.d+' • '+c.t;
document.getElementById('pill').textContent='● '+c.t;
if(hls){hls.destroy();}
if(c.a){
video.src=c.u;
video.play().then(()=>toast('Playing '+c.n)).catch(()=>toast('Tap play button'));
return;
}
if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(c.u);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
hls.on(Hls.Events.ERROR,(e,data)=>{
if(data.fatal){toast('Channel offline - try another');}
});
}else{
video.src=c.u;
video.play().catch(()=>{});
}
}

function build(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((c,i)=>{
let d=document.createElement('div');d.className='card'+(i==0?' on':'');
d.innerHTML=`<div class="thumb">${c.e}</div><div class="body"><div class="name">${c.n}</div><div class="sub">${c.d}</div><div class="status">${c.t}</div></div>`;
d.onclick=()=>play(c,d);
g.appendChild(d);
});
if(list.length>0) play(list[0], g.firstChild);
}
function setCat(cat,btn){
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
btn.classList.add('on');
build(DB[cat]);
}
function shareApp(){
if(navigator.share){navigator.share({title:'Salvation TV - 30+ Free Channels',text:'Free Live TV - No block - Works everywhere',url:location.href});}
else{navigator.clipboard.writeText(location.href);toast('Link copied');}
}
function installApp(){toast('Tap ⋮ → Add to Home screen');}

build(DB.live);
</script></body></html>
