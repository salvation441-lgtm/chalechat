<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Salvation TV - Ghana Inside App</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080e08;--card:#111d11;--card2:#1a2c1a;--border:#203d20;--green:#3ddb6a;--green2:#22c55e;--red:#ef4444;--text:#e8f5e8;--muted:#8fb48f}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui;padding:12px;padding-bottom:90px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,#111d11,#0f2310);border:1px solid var(--border);border-radius:18px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.dot-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--green),#facc15);display:grid;place-items:center;font-weight:900;color:#000}
.brand h1{font-size:20px;font-weight:800;line-height:1}.brand h1 span{color:var(--green)}.brand p{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:600}
.live-pill{background:#0b1f0b;border:1px solid var(--green);color:var(--green);padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.player-wrap{position:relative;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--border);aspect-ratio:16/9;margin-bottom:16px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.player-wrap iframe,.player-wrap video{width:100%;height:100%;border:0}
.player-info{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{background:rgba(0,0,0,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);padding:7px 12px;border-radius:100px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.pill.live{border-color:var(--red);color:#fff}.pill.live b{width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block}
.categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.cat{padding:10px 18px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;transition:.2s}
.cat.active{background:var(--green);color:#000;border-color:var(--green);box-shadow:0 6px 20px rgba(61,219,106,.3)}
.section-title{font-size:12px;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:14px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--green)}
.card.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,219,106,.25) inset}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:100px;border:1px solid var(--border);color:var(--muted)}
.badge.live{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}
.card h3{font-size:14px;font-weight:800;line-height:1.2;margin-bottom:4px}
.card p{font-size:11px;color:var(--muted)}
.thumb{width:100%;height:64px;border-radius:12px;background:radial-gradient(60% 80% at 30% 20%,#1f3d1f,#0a160a);display:grid;place-items:center;font-size:26px;margin-bottom:10px;border:1px solid var(--border)}
.footer{margin-top:26px;text-align:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:18px}
.footer p{font-size:11px;color:var(--muted)}.footer strong{color:var(--text)}
.contact{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.contact a{text-decoration:none;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:700;border:1px solid var(--border);color:var(--text);background:var(--card2)}
.contact a.green{background:var(--green);color:#000;border-color:var(--green)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="dot-logo">S</div>
    <div>
      <h1>Salvation <span>TV</span></h1>
      <p>GHANA INSIDE APP</p>
    </div>
  </div>
  <div class="live-pill"><span class="live-dot"></span> LIVE</div>
</div>

<div class="player-wrap" id="playerWrap">
  <div class="player-info">
    <div class="pill live"><b></b> <span id="now">Connecting...</span></div>
    <div class="pill" id="catNow">Ghana</div>
  </div>
</div>

<div class="categories" id="cats"></div>

<div class="section-title" id="sectionTitle">GHANA CHANNELS • ALWAYS CURRENT</div>
<div class="grid" id="grid"></div>

<div class="footer">
  <p><strong>Salvation TV - Ghana Inside App</strong><br>Powered by Salvation Tech-Ghana</p>
  <div class="contact">
    <a href="https://wa.me/233000000000" class="green">WhatsApp Us</a>
    <a href="https://salvationtv-ghana.com">Website</a>
    <a href="#">Privacy</a>
  </div>
  <p style="margin-top:12px;opacity:.6">No old recordings • Always plays current live feed • Tap any card to switch</p>
</div>

<script>
const channels=[
 {name:'UTV Ghana', cat:'Ghana', icon:'📺', handle:'@utvghanaonline', channelId:'UChd1DEecCRlxaa0-hvPACCw'},
 {name:'JoyNews', cat:'Ghana', icon:'📰', handle:'@myjoyonline', channelId:'UChd1DEecCRlxaa0-hvPACCw'},
 {name:'TV3 Ghana', cat:'Ghana', icon:'📡', handle:'@TV3Ghana', channelId:'UC9VSDs4ZXo3sjOoPkmW2iRQ'},
 {name:'GTV Ghana', cat:'Ghana', icon:'🇬🇭', handle:'@thegbcghana', channelId:'UCs1'},
 {name:'Metro TV', cat:'Ghana', icon:'🎙️', handle:'@metrotvgh', channelId:'UCm1'},
 {name:'FIFA TV', cat:'Sports', icon:'⚽', handle:'@FIFA', channelId:'UCpcTrCXblq8pI8TqLr7MorA'},
 {name:'SuperSport', cat:'Sports', icon:'🏆', handle:'@SuperSportTV', channelId:'UCs9'},
 {name:'ESPN Africa', cat:'Sports', icon:'🏅', handle:'@ESPNFC', channelId:'UCa'},
];

let curCat='Ghana',curCh=null;
const catsEl=document.getElementById('cats'),gridEl=document.getElementById('grid'),wrap=document.getElementById('playerWrap'),nowEl=document.getElementById('now'),catNowEl=document.getElementById('catNow'),secTitle=document.getElementById('sectionTitle');

function renderCats(){
 catsEl.innerHTML='';['Ghana','Sports','All'].forEach(c=>{
  const b=document.createElement('button');b.className='cat'+(curCat===c?' active':'');b.textContent=c;b.onclick=()=>{curCat=c;renderCats();renderGrid();};catsEl.appendChild(b);
 });
}
function renderGrid(){
 gridEl.innerHTML='';
 const list=curCat==='All'?channels:channels.filter(x=>x.cat===curCat);
 secTitle.textContent=curCat.toUpperCase()+' • ALWAYS CURRENT • NO OLD SCORE';
 list.forEach(ch=>{
  const active=curCh&&curCh.name===ch.name;
  const d=document.createElement('div');d.className='card'+(active?' active':'');
  d.innerHTML=`<div class="card-top"><span class="badge live">● LIVE</span><span class="badge">${ch.cat}</span></div><div class="thumb">${ch.icon}</div><h3>${ch.name}</h3><p>Tap to watch current live feed</p>`;
  d.onclick=()=>play(ch);gridEl.appendChild(d);
 });
}

async function getRealId(handle){
 try{
  const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/'+handle)}`;
  const r=await fetch(proxy); const j=await r.json();
  const m=j.contents.match(/"channelId":"(UC[\w-]{22})"/);
  if(m) return m[1];
 }catch(e){} return null;
}

async function play(ch){
 curCh=ch; renderGrid();
 wrap.querySelectorAll('iframe,video').forEach(e=>e.remove());
 nowEl.textContent='Finding current live...'; catNowEl.textContent=ch.cat;

 let cid=ch.channelId;
 const real=await getRealId(ch.handle);
 if(real) cid=real;

 const ifr=document.createElement('iframe');
 ifr.src=`https://www.youtube.com/embed/live_stream?channel=${cid}&autoplay=1&mute=0`;
 ifr.allow='autoplay; fullscreen; picture-in-picture'; ifr.allowFullscreen=true;
 wrap.appendChild(ifr);
 nowEl.textContent=ch.name+' • LIVE';
 catNowEl.textContent='LIVE • CURRENT';
}

renderCats();renderGrid();play(channels[0]);
</script>
</body>
</html>
