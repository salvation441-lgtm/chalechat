<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Global</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:20}
.logo-img{width:52px;height:52px;border-radius:14px;box-shadow:0 0 20px gold;object-fit:cover}
.player-box{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:46vh;position:relative}
.player-box iframe,.player-box video{width:100%;height:100%;border:0;background:#000}
.note{padding:8px 16px;font-size:11px;text-align:center;color:#00FF88;background:#0f1a0f}
.tabs{display:flex;gap:6px;padding:10px;background:#0f1a0f;position:sticky;top:78px;z-index:15;overflow-x:auto}
.tab{flex:1;min-width:80px;padding:10px;border-radius:12px;text-align:center;cursor:pointer;font-weight:700;font-size:10px;border:1px solid #333;background:#141e14;white-space:nowrap}
.tab.active{background:gold;color:#000;box-shadow:0 0 12px gold;border-color:gold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border-radius:16px;padding:16px;cursor:pointer;text-align:center;border:1px solid #333}
.card.inside{border-color:#00FF88}
.card.free{border-color:#00FF88;background:#0a1a0a}
.card.paid{border-color:#ff5050;background:#1a1010}
.card.outside{border-color:#444}
.badge{font-size:9px;padding:5px 10px;border-radius:20px;margin-top:8px;display:inline-block;font-weight:700}
.badge.inside{background:#00FF88;color:#000}
.badge.free{background:#00FF88;color:#000}
.badge.paid{background:#ff5050;color:#fff}
.badge.outside{background:#333;color:#fff}
.badge.fifa{background:#ff5050;color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" class="logo-img"><div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:10px;opacity:.6">Live Television - Max Inside</p></div></div>

<div class="player-box">
  <video id="playerVideo" controls autoplay muted playsinline style="display:none"></video>
  <iframe id="player" src="https://www.youtube-nocookie.com/embed/gCNeDWCI0vo?autoplay=1&mute=1" allowfullscreen allow="autoplay; fullscreen"></iframe>
</div>
<div class="note" id="status">Al Jazeera Live - Inside App</div>

<div class="tabs">
<div class="tab active" id="tab-intl" onclick="switchTab('intl')">Inside</div>
<div class="tab" id="tab-ghana" onclick="switchTab('ghana')">Ghana</div>
<div class="tab" id="tab-global" onclick="switchTab('global')">Global Free</div>
<div class="tab" id="tab-fifa" onclick="switchTab('fifa')">FIFA+</div>
<div class="tab" id="tab-links" onclick="switchTab('links')">Paid EPL</div>
</div>

<div class="grid" id="grid-intl"></div>
<div class="grid hidden" id="grid-ghana"></div>
<div class="grid hidden" id="grid-global"></div>
<div class="grid hidden" id="grid-fifa"></div>
<div class="grid hidden" id="grid-links"></div>

<script>
const gi=document.getElementById('grid-intl');
const gg=document.getElementById('grid-ghana');
const gglobal=document.getElementById('grid-global');
const gf=document.getElementById('grid-fifa');
const gll=document.getElementById('grid-links');
const player=document.getElementById('player');
const video=document.getElementById('playerVideo');
const statusEl=document.getElementById('status');
let hlsInstance=null;

function playHLS(url,name){
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null;}
  player.style.display='none';
  video.style.display='block';
  statusEl.textContent=name+" - Playing Inside App";
  if(Hls.isSupported()){
    hlsInstance=new Hls();
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,function(){video.play();});
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;video.play();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function playYouTube(id,name){
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null;}
  video.pause();video.style.display='none';
  player.style.display='block';
  player.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1`;
  statusEl.textContent=name+" Live - Inside App";
  window.scrollTo({top:0,behavior:'smooth'});
}

const intl=[
{name:"Al Jazeera",icon:"W",video:"gCNeDWCI0vo"},
{name:"DW News",icon:"D",video:"4IfaKA1sGhA"},
{name:"France 24",icon:"F",video:"Ap-og3N-pFU"},
];

const ghana=[
{name:"Max TV - PLAY INSIDE",icon:"M",hls:"https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8",isInside:true},
{name:"JoyNews",handle:"@myjoyonline",icon:"J"},
{name:"Joy Prime",handle:"@JoyPrimeTV",icon:"J"},
{name:"Adom TV",handle:"@adomtvgh",icon:"A"},
{name:"UTV Ghana",handle:"@UTVGhanaOnline",icon:"U"},
{name:"GTV Ghana",handle:"@GTVGhana",icon:"G"},
{name:"TV3 Ghana",handle:"@TV3Ghana",icon:"3"},
{name:"GHOne TV",handle:"@GHOneTV",icon:"G"},
{name:"Onua TV",handle:"@OnuaTV",icon:"O"},
{name:"Metro TV",handle:"@metrotvgh",icon:"M"},
{name:"Angel TV",handle:"@AngelTVGhana",icon:"A"},
{name:"Net2 TV",handle:"@Net2TVGhana",icon:"N"},
{name:"Citi TV",handle:"@CitiTube",icon:"C"},
{name:"Kantanka TV",handle:"@KantankaTV",icon:"K"},
{name:"Kessben TV",handle:"@KessbenTV",icon:"K"},
{name:"Light TV",handle:"@LightTVGhana",icon:"L"},
{name:"Atinka TV",handle:"@AtinkaTVGhana",icon:"A"},
{name:"Pan African TV",handle:"@PanAfricanTelevision",icon:"P"},
{name:"Wontumi TV",handle:"@WontumiTV",icon:"W"},
{name:"Original TV",handle:"@OriginalTVGhana",icon:"O"},
{name:"Lawson TV",handle:"@LawsonTVMedia",icon:"L"},
{name:"NewDay TV",handle:"@NewDayTVGhana",icon:"N"},
{name:"4Syte TV",handle:"@4sytetv",icon:"4"},
{name:"Homebase TV",handle:"@HomebaseTV",icon:"H"},
{name:"Adom News",handle:"@AdomTVGh",icon:"A"},
];

const globalFree=[
{name:"FIFA+ Global Free",url:"https://www.fifa.com/fifaplus/en/live",icon:"F",desc:"FREE Worldwide"},
{name:"J-League Live",url:"https://www.youtube.com/@JLEAGUEINTERNATIONAL/live",icon:"J",desc:"Japan - Free Globally"},
{name:"Indian Super League",url:"https://www.youtube.com/@IndianSuperLeague/live",icon:"I",desc:"ISL - Free Worldwide"},
{name:"LaLiga YouTube",url:"https://www.youtube.com/@LaLiga/live",icon:"L",desc:"LaLiga - Free"},
{name:"Bundesliga YouTube",url:"https://www.youtube.com/@Bundesliga/live",icon:"B",desc:"Bundesliga Free"},
{name:"LiveSoccerTV Global",url:"https://www.livesoccertv.com/",icon:"L",desc:"Check Free Matches"},
];

const fifa=[
{name:"FIFA+ Official",url:"https://www.fifa.com/fifaplus/en/live",icon:"F"},
{name:"FIFA Live YouTube",url:"https://www.youtube.com/@fifa/live",icon:"F"},
];

const paidEPL=[
{name:"SuperSport MaXimo 2",url:"https://www.supersport.com/",icon:"S",desc:"Chelsea vs Man Utd - Needs DStv"},
{name:"Canal+ Sport 3 Afrique",url:"https://www.canalplus-afrique.com/",icon:"C",desc:"EPL - Needs Canal+"},
{name:"DStv Now EPL",url:"https://now.dstv.com/",icon:"D",desc:"Paid - Login Required"},
{name:"GTV Sports+ (GPL ONLY)",url:"https://www.youtube.com/@GTVGhana/live",icon:"G",desc:"Ghana League ONLY"},
];

intl.forEach(s=>{
 const d=document.createElement('div');d.className='card inside';
 d.onclick=()=>playYouTube(s.video,s.name);
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><span class="badge inside">Inside App</span>`;
 gi.appendChild(d);
});

ghana.forEach(s=>{
 const d=document.createElement('div');
 if(s.isInside){
   d.className='card free';d.style.borderColor='gold';d.style.boxShadow='0 0 15px gold';
   d.onclick=()=>playHLS(s.hls,s.name);
   d.innerHTML=`<div style="font-size:32px">${s.icon}</div><h3 style="font-size:12px;margin-top:6px;font-weight:900">${s.name}</h3><p style="font-size:8px;opacity:.8;margin-top:4px">Your Screenshot Channel - Plays Inside</p><span class="badge free" style="background:gold">PLAY INSIDE APP</span>`;
 }else{
   d.className='card outside';
   d.onclick=()=>{window.open(`https://www.youtube.com/${s.handle}/live`,'_blank');};
   d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><span class="badge outside">YouTube</span>`;
 }
 gg.appendChild(d);
});

globalFree.forEach(s=>{
 const d=document.createElement('div');d.className='card free';
 d.onclick=()=>{window.open(s.url,'_blank');};
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><p style="font-size:8px;opacity:.7;margin-top:4px">${s.desc}</p><span class="badge free">FREE GLOBAL</span>`;
 gglobal.appendChild(d);
});

fifa.forEach(s=>{
 const d=document.createElement('div');d.className='card outside';d.style.borderColor='#ff5050';
 d.onclick=()=>{window.open(s.url,'_blank');};
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><span class="badge fifa">FIFA+</span>`;
 gf.appendChild(d);
});

paidEPL.forEach(s=>{
 const d=document.createElement('div');d.className='card paid';
 d.onclick=()=>{window.open(s.url,'_blank');};
 d.innerHTML=`<div style="font-size:28px">${s.icon}</div><h3 style="font-size:11px;margin-top:6px">${s.name}</h3><p style="font-size:8px;opacity:.7;margin-top:4px">${s.desc}</p><span class="badge paid">PAID - Needs Sub</span>`;
 gll.appendChild(d);
});

function switchTab(t){
 document.getElementById('grid-intl').classList.toggle('hidden',t!=='intl');
 document.getElementById('grid-ghana').classList.toggle('hidden',t!=='ghana');
 document.getElementById('grid-global').classList.toggle('hidden',t!=='global');
 document.getElementById('grid-fifa').classList.toggle('hidden',t!=='fifa');
 document.getElementById('grid-links').classList.toggle('hidden',t!=='links');
 document.getElementById('tab-intl').classList.toggle('active',t==='intl');
 document.getElementById('tab-ghana').classList.toggle('active',t==='ghana');
 document.getElementById('tab-global').classList.toggle('active',t==='global');
 document.getElementById('tab-fifa').classList.toggle('active',t==='fifa');
 document.getElementById('tab-links').classList.toggle('active',t==='links');
}

// Auto play Max TV inside on load if user wants - comment out if not needed
// playHLS('https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8','Max TV Ghana');
</script>
</body>
</html>
