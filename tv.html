<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - Current Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:20}
.logo-s{width:48px;height:48px;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px gold;font-weight:900;color:gold;font-size:22px}
.player-box{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:52vh}
.player-box iframe{width:100%;height:100%;border:0}
.note{padding:8px 16px;font-size:11px;color:#00FF88;text-align:center;background:#0f1a0f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.14);border-radius:16px;padding:12px;cursor:pointer;text-align:center}
</style>
</head>
<body>
<div class="header"><div class="logo-s">S</div><div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">CURRENT LIVE - AUTO UPDATE</p></div></div>
<div class="player-box"><iframe id="player" src="https://www.youtube-nocookie.com/embed/@myjoyonline/live?autoplay=1&mute=1&origin=https://on441-lgtm.github.io" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div class="note" id="status">JoyNews CURRENT LIVE - Will auto-play today's live, not old recording ✓</div>
<div class="grid" id="grid"></div>
<script>
const origin="https://on441-lgtm.github.io";
const ytLive = (handle) => `https://www.youtube-nocookie.com/embed/${handle}/live?autoplay=1&mute=1&origin=${origin}`;
const ytId = (id) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&origin=${origin}`;

const channels=[
{name:"JoyNews NOW",icon:"📰",src:ytLive("@myjoyonline"),type:"current"},
{name:"JoyNews Last",icon:"📺",src:ytId("1YY8rqelS9U"),type:"last"},
{name:"JoyNews Old",icon:"🎬",src:ytId("WZl6xCiT0LE"),type:"old"},
{name:"Ghana vs Argentina",icon:"🇬🇭",id:"-XRmFkzKq5E",type:"outside"},
];

const g=document.getElementById('grid');
channels.forEach(ch=>{
 const d=document.createElement('div');d.className='card';
 d.onclick=()=>{
  if(ch.type==='outside'){window.open(`https://www.youtube.com/watch?v=${ch.id}`,'_blank');return;}
  document.getElementById('player').src=ch.src;
  document.getElementById('status').textContent=`Playing: ${ch.name} • ${ch.type==='current'?'CURRENT LIVE':'Recorded'}`;
 };
 d.innerHTML=`<div style="font-size:28px">${ch.icon}</div><h3 style="font-size:13px;margin-top:6px">${ch.name}</h3><p style="font-size:10px;color:#00FF88">${ch.type==='current'?'CURRENT ✓':'Recorded'}</p>`;
 g.appendChild(d);
});
</script>
</body>
</html>
