<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvation Tech TV V2</title><style>body{margin:0;background:#070a12;color:#fff;font-family:Inter,sans-serif}header{padding:14px;background:linear-gradient(90deg,#000,#102040);border-bottom:2px solid #00e676;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}header b{font-size:16px}header b span{color:#00e676}.liveDot{width:8px;height:8px;background:#ff1744;border-radius:50%;animation:blink 1s infinite;margin-left:auto}@keyframes blink{50%{opacity:.3}}#playerWrap{background:#000;position:sticky;top:56px;z-index:9}#player{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}#player iframe{width:100%;height:100%;border:none}#info{padding:10px 12px;background:#0e152b;display:flex;justify-content:space-between;align-items:center;font-size:12px}#info a{background:#ff0000;color:#fff;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:800;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 10px 90px}button{padding:14px 8px;border-radius:14px;border:1px solid #22305a;background:#131c37;color:#fff;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}button.on{background:#00e676;color:#000;border-color:#00e676;transform:scale(.98)}button small{font-size:10px;opacity:.7;font-weight:600}footer{position:fixed;bottom:0;left:0;right:0;background:#0e152b;border-top:1px solid #22305a;padding:8px;text-align:center;font-size:10px;color:#8aa0d0}</style></head><body>
<header><b>🇬🇭 SALVATION <span>TECH TV</span> V2</b><div class="liveDot"></div><span style="font-size:10px;background:#00e676;color:#000;padding:4px 8px;border-radius:10px;font-weight:900;margin-left:6px">12 LIVE</span></header>
<div id="playerWrap"><div id="player"><div style="text-align:center;color:#556899"><div style="font-size:40px">📺</div><div style="font-weight:800;margin-top:8px">SELECT CHANNEL</div><div style="font-size:11px">Tap any channel below — opens live</div></div></div><div id="info"><div><b id="cName">No channel</b> <span id="cStatus" style="color:#8aa0d0">• Tap to watch</span></div><a id="ytBtn" href="#" target="_blank" style="display:none">▶ Open in YouTube</a></div></div>
<div class="grid" id="grid"></div>
<footer>Salvation Tech TV © 2026 • All Ghana Channels Free • Built on phone 📱</footer>
<script>
let channels=[
{n:'GTV Ghana',id:'gtv',e:'🇬🇭',yt:'https://www.youtube.com/c/GTVGhanaOfficial/live'},
{n:'UTV Ghana',id:'utv',e:'📺',yt:'https://www.youtube.com/c/UTVGhanaOfficial/live'},
{n:'TV3 Ghana',id:'tv3',e:'🎬',yt:'https://www.youtube.com/c/TV3Ghana/live'},
{n:'Adom TV',id:'adom',e:'🔥',yt:'https://www.youtube.com/c/AdomTV/live'},
{n:'GHOne TV',id:'ghone',e:'📰',yt:'https://www.youtube.com/c/GHOneTV/live'},
{n:'Joy Prime',id:'joy',e:'💫',yt:'https://www.youtube.com/c/JoyPrimeTV/live'},
{n:'Metro TV',id:'metro',e:'📡',yt:'https://www.youtube.com/c/MetroTVGhana/live'},
{n:'Angel TV',id:'angel',e:'👼',yt:'https://www.youtube.com/c/AngelTVOfficial/live'},
{n:'GTV Sports+',id:'sports',e:'⚽',yt:'https://www.youtube.com/c/GTVSportsPlus/live'},
{n:'Citi TV',id:'citi',e:'🏙️',yt:'https://www.youtube.com/c/CitiTube/live'},
{n:'TV Africa',id:'africa',e:'🌍',yt:'https://www.youtube.com/c/TVAfricaGhana/live'},
{n:'NET2 TV',id:'net2',e:'📺',yt:'https://www.youtube.com/c/Net2TVOfficial/live'}
];
let cur=null;
function render(){
let g=document.getElementById('grid');g.innerHTML='';
channels.forEach(ch=>{
let b=document.createElement('button');
b.id='btn-'+ch.id;
b.innerHTML=`${ch.e} ${ch.n}<small>Tap to Play • LIVE</small>`;
b.onclick=()=>play(ch);
g.appendChild(b);
});
}
function play(ch){
cur=ch;
document.querySelectorAll('.grid button').forEach(b=>b.classList.remove('on'));
document.getElementById('btn-'+ch.id).classList.add('on');
document.getElementById('cName').textContent=ch.n;
document.getElementById('cStatus').textContent='• LIVE NOW';
let player=document.getElementById('player');
// Try embedded live — if blocked, show thumbnail + button
player.innerHTML=`<div style="width:100%;height:100%;background:linear-gradient(135deg,#0f2040,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center"><div style="font-size:50px">${ch.e}</div><div style="font-weight:900;font-size:18px;margin-top:10px">${ch.n}</div><div style="color:#00e676;margin-top:6px;font-weight:800">● LIVE STREAM READY</div><div style="font-size:11px;color:#8aa0d0;margin-top:8px">Tap "Open in YouTube" below for full screen live</div><a href="${ch.yt}" target="_blank" style="margin-top:14px;background:#ff0000;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:900">▶ WATCH ${ch.n} LIVE</a></div>`;
let ytBtn=document.getElementById('ytBtn');
ytBtn.href=ch.yt;
ytBtn.style.display='block';
ytBtn.textContent='▶ YouTube';
window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script></body></html>
