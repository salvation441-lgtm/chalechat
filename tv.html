<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvation TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background: radial-gradient(1200px 600px at 10% -10%, #00ff88 0%, transparent 50%), radial-gradient(1000px 500px at 90% 0%, #ffcc00 0%, transparent 40%), radial-gradient(800px 400px at 50% 120%, #aa55ff 0%, transparent 50%), #050a05;color:#fff;font-family:system-ui;display:flex;flex-direction:column;max-width:480px;margin:0 auto;height:100dvh;}
.header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,20,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo-img{width:32px;height:32px;border-radius:8px;box-shadow:0 0 12px gold;object-fit:cover}
.player-box{margin:8px 10px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);height:28dvh;min-height:160px;background:#000;flex-shrink:0}
.player-box video{width:100%;height:100%;background:#000}
.tabs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tab{padding:8px 16px;border-radius:20px;font-weight:800;font-size:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);white-space:nowrap;cursor:pointer}
.tab.active{background:#fff;color:#000;border-color:#fff}
.content{flex:1;overflow-y:auto;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px}
.card{background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));backdrop-filter:blur(14px);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.card:active{transform:scale(.95)}
.card.free{border-color:rgba(0,255,136,.5)}
.card div{font-size:20px;font-weight:900}
.card h3{font-size:9px;margin-top:4px;font-weight:700;line-height:1.1}
.badge{font-size:6px;padding:3px 6px;border-radius:10px;margin-top:6px;display:inline-block;font-weight:800}
.badge.free{background:#00ff88;color:#000}
.badge.gold{background:linear-gradient(90deg,gold,#ffcc00);color:#000}
.badge.movie{background:linear-gradient(90deg,#ff0055,#ff8800);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" class="logo-img"><div><h1 style="font-size:13px">Salvation <span style="color:#00FF88">TV</span></h1></div></div>
<div class="player-box"><video id="v" controls autoplay muted playsinline></video></div>
<div class="tabs">
<div class="tab active" id="t-intl" onclick="st('intl')">Inside</div>
<div class="tab" id="t-ghana" onclick="st('ghana')">Ghana</div>
<div class="tab" id="t-global" onclick="st('global')">Global</div>
<div class="tab" id="t-movies" onclick="st('movies')">Movies</div>
<div class="tab" id="t-fifa" onclick="st('fifa')">FIFA+</div>
<div class="tab" id="t-links" onclick="st('links')">Paid</div>
</div>
<div class="content">
<div class="grid" id="g-intl"></div>
<div class="grid hidden" id="g-ghana"></div>
<div class="grid hidden" id="g-global"></div>
<div class="grid hidden" id="g-movies"></div>
<div class="grid hidden" id="g-fifa"></div>
<div class="grid hidden" id="g-links"></div>
</div>
<script>
const v=document.getElementById('v');let h=null;
function p(u){if(h){h.destroy();}if(Hls.isSupported()){h=new Hls();h.loadSource(u);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}else{v.src=u;v.play();}}
const intl=[{n:"Al Jazeera",i:"W",u:"https://live-hls-web-aje.getaj.net/AJE/01.m3u8"},{n:"DW News",i:"D",u:"https://dwamdstream104.akamaized.net/hls/live/2015526/dwstream104/master.m3u8"},{n:"France 24",i:"F",u:"https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master.m3u8"}];
const ghana=[
{n:"Max TV",i:"M",u:"https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8",g:true},
{n:"TV3",i:"3",u:"https://adesa.tv/live/tv3_AdesaAdb.m3u8",g:true},
{n:"JoyNews",h:"@myjoyonline",i:"J"},
{n:"UTV",h:"@UTVGhanaOnline",i:"U"},
{n:"GTV",h:"@GTVGhana",i:"G"},
{n:"GHOne",h:"@GHOneTV",i:"G"},
{n:"Metro",h:"@metrotvgh",i:"M"},
{n:"Citi",h:"@CitiTube",i:"C"},
{n:"Angel",h:"@AngelTVGhana",i:"A"}
];
const globalFree=[
{n:"Premier League",u:"https://www.youtube.com/@premierleague/live",i:"P"},
{n:"FIFA+ Global",u:"https://www.fifa.com/fifaplus/en/live",i:"F"},
{n:"J-League",u:"https://www.youtube.com/@JLEAGUEINTERNATIONAL/live",i:"J"},
{n:"ISL",u:"https://www.youtube.com/@IndianSuperLeague/live",i:"I"},
{n:"LaLiga",u:"https://www.youtube.com/@LaLiga/live",i:"L"},
{n:"Bundesliga",u:"https://www.youtube.com/@Bundesliga/live",i:"B"},
{n:"Serie A",u:"https://www.youtube.com/@SerieA/live",i:"S"}
];
const movies=[
{n:"FilmRise",u:"https://www.youtube.com/@FilmRiseMovies/videos",i:"F",m:true},
{n:"Free Movies+",u:"https://www.youtube.com/@FreeMoviesPlus/videos",i:"FM",m:true},
{n:"Nollywood GH",u:"https://www.youtube.com/@NollywoodPicturesTV",i:"N",m:true},
{n:"Akwaaba Magic",u:"https://www.youtube.com/@AkwaabaMagic",i:"A",m:true},
{n:"Plex Free GH",u:"https://watch.plex.tv/movies",i:"PX",m:true},
{n:"Archive Movies",u:"https://archive.org/details/movies",i:"AR",m:true}
];
const fifa=[{n:"FIFA+",u:"https://www.fifa.com/fifaplus/en/live",i:"F"}];
const paid=[{n:"SuperSport",u:"https://www.supersport.com/",i:"S"},{n:"Canal+",u:"https://www.canalplus-afrique.com/",i:"C"},{n:"DStv Now",u:"https://now.dstv.com/",i:"D"}];
function mk(g,fn,o){const e=document.createElement('div');e.className='card '+(o.g||o.free||o.m?'free':'');if(o.g){e.style.borderColor='gold';}if(o.m){e.style.borderColor='#ff0055';}e.onclick=fn;e.innerHTML=`<div>${o.i}</div><h3>${o.n}</h3><span class="badge ${o.g?'gold':o.m?'movie':o.free?'free':'out'}">${o.g?'PLAY INSIDE':o.m?'FREE GH':o.free?'FREE':o.b||'YT'}</span>`;g.appendChild(e);}
const gi=document.getElementById('g-intl'),gg=document.getElementById('g-ghana'),ggl=document.getElementById('g-global'),gm=document.getElementById('g-movies'),gf=document.getElementById('g-fifa'),gl=document.getElementById('g-links');
intl.forEach(s=>mk(gi,()=>p(s.u),{n:s.n,i:s.i,free:true}));
ghana.forEach(s=>{if(s.g){mk(gg,()=>p(s.u),{n:s.n,i:s.i,g:true});}else{mk(gg,()=>window.open(`https://www.youtube.com/${s.h}/live`,'_blank'),{n:s.n,i:s.i});}});
globalFree.forEach(s=>mk(ggl,()=>window.open(s.u,'_blank'),{n:s.n,i:s.i,free:true}));
movies.forEach(s=>mk(gm,()=>window.open(s.u,'_blank'),{n:s.n,i:s.i,m:true}));
fifa.forEach(s=>mk(gf,()=>window.open(s.u,'_blank'),{n:s.n,i:s.i,b:'FIFA+'}));
paid.forEach(s=>mk(gl,()=>window.open(s.u,'_blank'),{n:s.n,i:s.i,b:'PAID'}));
function st(t){['intl','ghana','global','movies','fifa','links'].forEach(id=>{document.getElementById('g-'+id).classList.toggle('hidden',t!==id);document.getElementById('t-'+id).classList.toggle('active',t===id);});}
p("https://live-hls-web-aje.getaj.net/AJE/01.m3u8");
</script>
</body>
</html>
