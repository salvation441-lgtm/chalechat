<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvation TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050a05;color:#fff;font-family:system-ui;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:10px 14px;background:#0a140a;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center}
.player-box{margin:8px;border-radius:14px;overflow:hidden;background:#000;height:32dvh;min-height:200px;border:1px solid #222}
.player-box video,.player-box iframe{width:100%;height:100%;border:0}
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.tab{padding:7px 12px;border-radius:20px;font-size:9px;font-weight:800;border:1px solid #333;background:#111;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.content{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#111;border-radius:12px;padding:12px 6px;text-align:center;border:1px solid #222}
.card h3{font-size:8px;margin-top:4px}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" style="width:28px;height:28px;border-radius:6px"><h1 style="font-size:12px">Salvation <span style="color:#00ff88">TV</span></h1></div>
<div class="player-box"><video id="v" controls autoplay muted playsinline></video><iframe id="yt" class="hidden" allowfullscreen></iframe></div>
<div class="tabs">
<div class="tab active" id="t-ghana" onclick="st('ghana')">Ghana</div>
<div class="tab" id="t-intl" onclick="st('intl')">Inside</div>
<div class="tab" id="t-rb" onclick="st('rb')">Red Bull</div>
<div class="tab" id="t-movies" onclick="st('movies')">Movies</div>
</div>
<div class="content">
<div class="grid" id="g-ghana"></div>
<div class="grid hidden" id="g-intl"></div>
<div class="grid hidden" id="g-rb"></div>
<div class="grid hidden" id="g-movies"></div>
</div>
<script>
const v=document.getElementById('v'), yt=document.getElementById('yt'); let h=null;
function playHLS(u){yt.classList.add('hidden');yt.src='';v.classList.remove('hidden');if(h){h.destroy();h=null}if(Hls.isSupported()){h=new Hls();h.loadSource(u);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}else{v.src=u;v.play()}}
function playLink(u){if(h){h.destroy();h=null}v.classList.add('hidden');v.pause();yt.classList.remove('hidden');yt.src=u}
function mk(g,fn,n){const e=document.createElement('div');e.className='card';e.onclick=fn;e.innerHTML=`<div style="font-weight:900">${n[0]}</div><h3>${n}</h3>`;g.appendChild(e)}
mk(document.getElementById('g-ghana'),()=>playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8"),"Max TV");
mk(document.getElementById('g-ghana'),()=>playHLS("https://adesa.tv/live/tv3_AdesaAdb.m3u8"),"TV3");
mk(document.getElementById('g-intl'),()=>playHLS("https://live-hls-web-aje.getaj.net/AJE/01.m3u8"),"Al Jazeera");
mk(document.getElementById('g-intl'),()=>playHLS("https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8"),"France 24");
mk(document.getElementById('g-rb'),()=>playHLS("https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8"),"Red Bull TV");
mk(document.getElementById('g-rb'),()=>playHLS("https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8"),"Red Bull Sports");
mk(document.getElementById('g-movies'),()=>playLink("https://watch.plex.tv/movies"),"Plex");
mk(document.getElementById('g-movies'),()=>playLink("https://archive.org/details/feature_films"),"Cinema");
function st(t){['ghana','intl','rb','movies'].forEach(id=>{document.getElementById('g-'+id).classList.toggle('hidden',t!==id);document.getElementById('t-'+id).classList.toggle('active',t===id)})}
playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8");
</script>
</body>
</html>
