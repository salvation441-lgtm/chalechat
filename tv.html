<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation TV V66 Ghana Embed Works</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080a14;color:#fff}
header{background:#0e1220;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1f36;position:sticky;top:0;z-index:30}
.mark{width:34px;height:34px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
header b{font-size:14px}header small{font-size:9px;color:#8b95b5}
#playerWrap{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:54px;z-index:20;display:flex;align-items:center;justify-content:center}
iframe,video{width:100%;height:100%;background:#000;border:none}
#status{position:absolute;bottom:8px;left:10px;right:10px;font-size:9px;background:rgba(0,0,0,0.9);padding:6px 10px;border-radius:10px;text-align:center;z-index:10}
#meta{padding:12px 14px;background:#0e1220;border-bottom:1px solid #1a1f36}
#meta h2{font-size:14px;font-weight:800}#meta p{font-size:10px;color:#8b95b5;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 90px}
.card{background:#121624;border:1px solid #1e2442;border-radius:14px;overflow:hidden;cursor:pointer}
.card.playing{border-color:#ffaa00;background:rgba(255,170,0,0.15);box-shadow:0 0 20px rgba(255,170,0,0.25)}
.th{height:58px;background:#1a1f36;display:flex;align-items:center;justify-content:center;font-size:22px}
.bd{padding:9px}.nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb{font-size:9px;color:#8b95b5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ok{font-size:7.5px;font-weight:800;margin-top:4px;color:#00ff88}
#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px 14px;display:flex;gap:10px}
.btn{flex:1;height:44px;border-radius:12px;border:none;font-weight:700;font-size:11px}.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}
.section-title{padding:14px 14px 6px;font-size:11px;font-weight:800;color:#ffaa00;text-transform:uppercase}
</style>
</head>
<body>
<header>
<div style="display:flex;gap:10px;align-items:center"><div class="mark">S</div><div><b>Salvation TV</b><br><small>V66 FIXED - NO UNAVAILABLE - GHANA WORKS</small></div></div>
<div style="font-size:9px;color:#00ff88;background:rgba(0,255,136,0.15);padding:6px 12px;border-radius:20px">WORKS</div>
</header>

<div id="playerWrap">
<video id="v" controls playsinline style="display:none"></video>
<iframe id="frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="display:block"></iframe>
<div id="status">V66 Fixed - No more This video is unavailable - Only embed allowed videos</div>
</div>

<div id="meta">
<h2 id="title">Ghana & Africa Movies - Fixed - No Unavailable</h2>
<p id="sub">Fixed that black unavailable screen - Only videos wey owner allow embed + HLS wey work Tamale - People go like</p>
</div>

<div id="content"></div>

<div id="btm"><button class="btn s" onclick="shareApp()">Share App</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const DB=[
{section:"GHANA & AFRICA - Only Embed Allowed - No More Unavailable - Ghana Works"},
{n:"Ghana News Live - HLS Works",e:"🇬🇭",u:"https://live-hls-web-aja.getaj.net/AJA/index.m3u8",d:"Ghana News Live Video - Al Jazeera Africa - Works Ghana 100% - No Unavailable",badge:"GHANA WORKS - HLS - NO BLOCK",type:"hls"},
{n:"Africa Sports Live - HLS",e:"🌍",u:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",d:"Africa Sports Live - Red Bull - Works Ghana - Real Video",badge:"AFRICA SPORTS - HLS WORKS",type:"hls"},
{n:"Big Buck Bunny - Embed Allowed",e:"🐰",u:"https://www.youtube-nocookie.com/embed/YE7VzlLtp-4",d:"Big Buck Bunny Official - Embed Allowed - Works Ghana",badge:"EMBED ALLOWED - WORKS",type:"youtube"},
{n:"Sintel - Embed Allowed",e:"🐉",u:"https://www.youtube-nocookie.com/embed/eRsGyueVLvQ",d:"Sintel Movie - Embed Allowed - Works Ghana",badge:"EMBED ALLOWED - WORKS",type:"youtube"},
{n:"YouTube Test Ghana",e:"🎬",u:"https://www.youtube-nocookie.com/embed/jNQXAC9IVRw",d:"YouTube Me at Zoo - Embed Allowed Test - Works",badge:"YOUTUBE EMBED TEST WORKS",type:"youtube"},
{n:"Nasa Africa Doc - HLS",e:"🚀",u:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",d:"NASA Africa Doc - HLS Works Ghana - No Unavailable",badge:"NASA HLS - GHANA WORKS",type:"hls"},
{n:"DW Africa News - HLS",e:"🇩🇪",u:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",d:"DW Africa - HLS Works - No Unavailable Black Screen",badge:"DW HLS - GHANA WORKS",type:"hls"},
{n:"France24 Africa - HLS",e:"🇫🇷",u:"https://live.france24.com/hls/live/2037218/F24_EN_LO_HLS/master.m3u8",d:"France24 Africa Live - HLS Works Ghana",badge:"FRANCE24 HLS - GHANA WORKS",type:"hls"},
];

const v=document.getElementById('v');
const frame=document.getElementById('frame');
const status=document.getElementById('status');
const content=document.getElementById('content');
let hls=null;

function play(c,el){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('playing'));
 el.classList.add('playing');
 document.getElementById('title').textContent=c.n;
 document.getElementById('sub').textContent=c.d;
 status.textContent='Loading '+c.n+'...';
 window.scrollTo({top:0, behavior:'smooth'});

 if(c.type==='hls'){
   frame.style.display='none';
   v.style.display='block';
   if(hls){ hls.destroy(); hls=null; }
   if(Hls.isSupported()){
     hls=new Hls();
     hls.loadSource(c.u);
     hls.attachMedia(v);
     hls.on(Hls.Events.MANIFEST_PARSED,function(){ v.play().then(function(){ status.textContent='Playing '+c.n+' - Ghana Works - No Unavailable!'; }); });
   }else{ v.src=c.u; v.play(); }
 }else{
   v.style.display='none';
   v.pause();
   if(hls){ hls.destroy(); hls=null; }
   frame.style.display='block';
   frame.src=c.u;
   status.textContent='Playing '+c.n+' - Embed Allowed - No More This video is unavailable - Ghana Works!';
 }
}

function build(){
 content.innerHTML='';
 let grid=null;
 DB.forEach(function(c){
   if(c.section){
     let sec=document.createElement('div');
     sec.className='section-title';
     sec.textContent=c.section;
     content.appendChild(sec);
     grid=document.createElement('div');
     grid.className='grid';
     grid.style.paddingTop='4px';
     content.appendChild(grid);
   }else{
     let card=document.createElement('div');
     card.className='card';
     card.innerHTML='<div class="th">'+c.e+'</div><div class="bd"><div class="nm">'+c.n+'</div><div class="sb">'+c.d+'</div><div class="ok">'+c.badge+'</div></div>';
     (function(cCopy,cardCopy){ cardCopy.onclick=function(){ play(cCopy,cardCopy); }; })(c,card);
     if(grid) grid.appendChild(card);
   }
 });
}

function shareApp(){ if(navigator.share){ navigator.share({title:'Salvation TV V66', url:location.href}); } else{ navigator.clipboard.writeText(location.href); status.textContent='Link copied!'; } }

build();
setTimeout(function(){ let first=document.querySelector('.card'); if(first) first.click(); },800);
</script>
</body>
</html>
