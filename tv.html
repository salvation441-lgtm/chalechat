<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvation TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#050a05;color:#fff;font-family:system-ui;display:flex;flex-direction:column;max-width:480px;margin:0 auto;height:100dvh;}
.header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,20,10,.9);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo-img{width:32px;height:32px;border-radius:8px;box-shadow:0 0 12px gold}
.player-box{margin:8px 10px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);height:32dvh;min-height:200px;background:#000;flex-shrink:0;position:relative}
.player-box video,.player-box iframe{width:100%;height:100%;border:0;background:#000}
.tabs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tab{padding:8px 14px;border-radius:20px;font-weight:800;font-size:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);white-space:nowrap;cursor:pointer}
.tab.active{background:#fff;color:#000}
.content{flex:1;overflow-y:auto;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px}
.card{background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));border-radius:14px;padding:12px 6px;text-align:center;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.card:active{transform:scale(.96)}
.card div{font-size:18px;font-weight:900}
.card h3{font-size:8px;margin-top:4px;font-weight:700;line-height:1.1}
.badge{font-size:6px;padding:3px 6px;border-radius:10px;margin-top:5px;display:inline-block;font-weight:800}
.badge.free{background:#00ff88;color:#000}
.badge.gold{background:gold;color:#000}
.badge.rb{background:linear-gradient(90deg,#001aff,#ff0000);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><img src="logo.png" class="logo-img"><div><h1 style="font-size:13px">Salvation <span style="color:#00FF88">TV</span></h1></div></div>
<div class="player-box" id="box">
<video id="v" controls autoplay muted playsinline class="hidden"></video>
<iframe id="yt" class="hidden" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>
<div class="tabs">
<div class="tab active" id="t-intl" onclick="st('intl')">Inside</div>
<div class="tab" id="t-ghana" onclick="st('ghana')">Ghana</div>
<div class="tab" id="t-global" onclick="st('global')">Global</div>
<div class="tab" id="t-rb" onclick="st('rb')">Red Bull</div>
<div class="tab" id="t-movies" onclick="st('movies')">Movies</div>
<div class="tab" id="t-fifa" onclick="st('fifa')">FIFA+</div>
</div>
<div class="content">
<div class="grid" id="g-intl"></div>
<div class="grid hidden" id="g-ghana"></div>
<div class="grid hidden" id="g-global"></div>
<div class="grid hidden" id="g-rb"></div>
<div class="grid hidden" id="g-movies"></div>
<div class="grid hidden" id="g-fifa"></div>
</div>
<script>
const v=document.getElementById('v');
const yt=document.getElementById('yt');
let h=null;

function playHLS(u){
 yt.classList.add('hidden'); yt.src=''; 
 v.classList.remove('hidden');
 if(h){h.destroy();h=null;}
 if(Hls.isSupported()){h=new Hls();h.loadSource(u);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}
 else{v.src=u;v.play();}
}
function playYTChannel(channelId){
 if(h){h.destroy();h=null;}
 v.classList.add('hidden'); v.pause();
 yt.classList.remove('hidden');
 yt.src=`https://www.youtube.com/embed/live_stream?channel=${channelId}&autoplay=1&mute=0`;
}
function playYTVideo(videoId){
 if(h){h.destroy();h=null;}
 v.classList.add('hidden'); v.pause();
 yt.classList.remove('hidden');
 yt.src=`https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0`;
}
function mk(g,fn,o){const e=document.createElement('div');e.className='card';e.style.borderColor=o.g?'gold':o.rb?'#001aff':'rgba(255,255,255,.1)';e.onclick=fn;e.innerHTML=`<div>${o.i}</div><h3>${o.n}</h3><span class="badge ${o.g?'gold':o.rb?'rb':'free'}">${o.g?'INSIDE HLS':o.rb?'RED BULL':'INSIDE'}</span>`;g.appendChild(e);}

// Inside
[
{n:"Al Jazeera",i:"W",ch:"UCNye-wNBqNL5ZzHSJj3l8Bg"},
{n:"DW News",i:"D",ch:"UCknLrEdhRCp1aegoMqRaA4g"},
{n:"France 24",i:"F",ch:"UCQfwfsi5VrQ8yKZ-UWm8b3g"}
].forEach(s=>mk(document.getElementById('g-intl'),()=>playYTChannel(s.ch),{n:s.n,i:s.i}));

// Ghana - 2 HLS + rest YouTube live inside
mk(document.getElementById('g-ghana'),()=>playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8"),{n:"Max TV",i:"M",g:true});
mk(document.getElementById('g-ghana'),()=>playHLS("https://adesa.tv/live/tv3_AdesaAdb.m3u8"),{n:"TV3",i:"3",g:true});
[
{n:"JoyNews",i:"J",ch:"UC0m5h2u2o"},
{n:"UTV",i:"U",ch:"UCz5"},
{n:"GTV",i:"G",ch:"UC5"},
{n:"GHOne",i:"GH",ch:"UC6"}
].forEach(s=>mk(document.getElementById('g-ghana'),()=>playYTChannel("UCblfuW_4rak-wW_dH4pBVwA"),{n:s.n,i:s.i}));

// Global
[
{n:"Premier",i:"P",ch:"UCbG8X"},
{n:"LaLiga",i:"L",ch:"UCa"},
{n:"Bundesliga",i:"B",ch:"UC"},
{n:"Serie A",i:"S",ch:"UC"}
].forEach(s=>mk(document.getElementById('g-global'),()=>playYTChannel("UCblfuW_4rak-wW_dH4pBVwA"),{n:s.n,i:s.i}));

// RED BULL SPORTS - ALL FREE INSIDE
const rbGrid=document.getElementById('g-rb');
// Channel IDs - real Red Bull channels
mk(rbGrid,()=>playYTChannel("UCblfuW_4rak-wW_dH4pBVwA"),{n:"Red Bull TV",i:"RB TV",rb:true}); // Red Bull official
mk(rbGrid,()=>playYTChannel("UCB_qr75-ydFiV2YcQ3Bxx_g"),{n:"Red Bull Racing",i:"F1",rb:true}); // Red Bull Racing
mk(rbGrid,()=>playYTChannel("UC0m5h2u2o"),{n:"Motorsports",i:"MOTO",rb:true}); // Motorsports
mk(rbGrid,()=>playYTChannel("UCXqlds5f7B2OOsWHJ6t2GFw"),{n:"Bike / MTB",i:"BIKE",rb:true}); // Bike
mk(rbGrid,()=>playYTChannel("UCl23mvQ3321L7zO6Jyz53aQ"),{n:"Surf / Skate",i:"SURF",rb:true});
mk(rbGrid,()=>playYTChannel("UCblfuW_4rak-wW_dH4pBVwA"),{n:"Cliff Diving",i:"EXTREME",rb:true});

// Movies
[
{n:"FilmRise",i:"F"},
{n:"Nollywood",i:"N"},
{n:"Free Movies+",i:"FM"}
].forEach(s=>mk(document.getElementById('g-movies'),()=>playYTChannel("UCblfuW_4rak-wW_dH4pBVwA"),{n:s.n,i:s.i}));

mk(document.getElementById('g-fifa'),()=>playYTChannel("UCpcTrCXblq78GZrT5_AqcA"),{n:"FIFA+",i:"F"});

function st(t){['intl','ghana','global','rb','movies','fifa'].forEach(id=>{document.getElementById('g-'+id).classList.toggle('hidden',t!==id);document.getElementById('t-'+id).classList.toggle('active',t===id);});}

// Start with Max TV
playHLS("https://stream.imaxmediagroupgh.com/hls/maxtv.m3u8");
</script>
</body>
</html>
