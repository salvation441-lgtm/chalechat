<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation TV - No Block</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a08;color:#fff;font-family:system-ui}
.header{display:flex;align-items:center;gap:12px;padding:14px;background:#141e14;position:sticky;top:0;z-index:10}
.logo-s{width:48px;height:48px;border-radius:12px;overflow:hidden;box-shadow:0 0 18px gold;background:#000;display:flex;align-items:center;justify-content:center;font-size:22px}
.video-wrap{margin:12px;background:#000;border-radius:18px;overflow:hidden;border:1px solid gold;height:52vh;position:relative}
.video-wrap iframe{width:100%;height:100%;border:0}
.tabs{display:flex;gap:10px;padding:12px;overflow:auto}
.tab{padding:10px 22px;border-radius:24px;background:#121612;color:#9aa79a;border:1px solid #333;cursor:pointer;white-space:nowrap}
.tab.active{background:#00FF88;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 90px}
.card{background:#141e14;border:1px solid rgba(0,255,136,.14);border-radius:16px;padding:12px;cursor:pointer;text-align:center}
.thumb{height:60px;background:#1e341e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px}
.note{padding:10px 16px;font-size:11px;color:#8aa08a;text-align:center}
</style>
</head>
<body>
<div class="header">
<div class="logo-s">S</div>
<div><h1 style="font-size:19px">Salvation <span style="color:#00FF88">TV</span></h1><p style="font-size:11px;opacity:.6">GHANA INSIDE APP - NO BLOCK</p></div>
<div style="margin-left:auto;border:1px solid #00FF88;color:#00FF88;padding:6px 14px;border-radius:20px;font-size:12px">● LIVE</div>
</div>

<div class="video-wrap">
<iframe id="player" src="https://www.youtube.com/embed/9bZkp7q19f0" allowfullscreen></iframe>
</div>
<p class="note" id="status">FIFA TV • YouTube (Not blocked)</p>

<div class="tabs">
<div class="tab active" onclick="showTab('all',this)">All</div>
<div class="tab" onclick="showTab('ghana',this)">Ghana (No Block)</div>
<div class="tab" onclick="showTab('sports',this)">Sports</div>
</div>

<div class="grid" id="grid"></div>

<script>
const ghanaChannels=[
{name:"UTV Ghana",icon:"📡",type:"ghana",embed:"https://liveghanatv.com/embed/utv-ghana/",note:"UTV - LiveGhanaTV (No YouTube block)"},
{name:"GTV Ghana",icon:"📺",type:"ghana",embed:"https://liveghanatv.com/embed/gtv-ghana/",note:"GTV - LiveGhanaTV"},
{name:"Adom TV",icon:"🎬",type:"ghana",embed:"https://liveghanatv.com/embed/adom-tv/",note:"Adom TV - LiveGhanaTV"},
{name:"JoyNews",icon:"📰",type:"ghana",embed:"https://liveghanatv.com/embed/joy-prime/",note:"JoyNews - LiveGhanaTV (Real Live)"},
{name:"TV3 Ghana",icon:"🌟",type:"ghana",embed:"https://liveghanatv.com/embed/tv3-ghana/",note:"TV3 - LiveGhanaTV"},
{name:"GHOne TV",icon:"🔥",type:"ghana",embed:"https://liveghanatv.com/embed/gh-one-tv/",note:"GHOne - LiveGhanaTV"},
];

const sportsChannels=[
{name:"FIFA TV",icon:"⚽",type:"sports",embed:"https://www.youtube.com/embed/JGwWNGJdvx8",note:"FIFA - YouTube (Not blocked)"},
{name:"SuperSport",icon:"🏆",type:"sports",embed:"https://www.youtube.com/embed/86YLFOog4GM",note:"SuperSport - YouTube"},
{name:"ESPN Africa",icon:"🏈",type:"sports",embed:"https://www.youtube.com/embed/5qap5aO4i9A",note:"ESPN - YouTube"},
];

let current='all';
function showTab(cat,el){
 current=cat;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
 render();
}
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 let list = current==='ghana'? ghanaChannels : current==='sports'? sportsChannels : [...ghanaChannels,...sportsChannels];
 list.forEach(ch=>{
  const d=document.createElement('div');d.className='card';
  d.onclick=()=>{document.getElementById('player').src=ch.embed; document.getElementById('status').textContent=ch.note; window.scrollTo({top:0,behavior:'smooth'});};
  d.innerHTML=`<div class="thumb">${ch.icon}</div><h3 style="font-size:13px">${ch.name}</h3><p style="font-size:10px;color:#7a8a7a">${ch.type==='ghana'?'No Block ✓':'YouTube'}</p>`;
  g.appendChild(d);
 });
}
render();
</script>
</body>
</html>
