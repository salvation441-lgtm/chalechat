<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation TV V63 Fixed Movies Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080a14;color:#fff}
header{background:#0e1220;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1f36;position:sticky;top:0;z-index:30}
.mark{width:34px;height:34px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
header b{font-size:14px}header small{font-size:9px;color:#8b95b5}
#playerWrap{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:54px;z-index:20;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;background:#000}
#status{position:absolute;bottom:8px;left:10px;right:10px;font-size:9px;background:rgba(0,0,0,0.85);padding:6px 10px;border-radius:10px;text-align:center;z-index:10}
#meta{padding:12px 14px;background:#0e1220;border-bottom:1px solid #1a1f36}
#meta h2{font-size:14px;font-weight:800}#meta p{font-size:10px;color:#8b95b5;margin-top:4px}
#tabs{display:flex;gap:7px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid #1a1f36;background:#0a0e1e}
.tab{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid #242a4a;background:#121624;color:#8b95b5;font-size:10px;font-weight:600;flex-shrink:0}
.tab.on{background:#ff2d7b;color:#fff;border-color:#ff2d7b;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 90px}
.card{background:#121624;border:1px solid #1e2442;border-radius:14px;overflow:hidden;cursor:pointer}
.card.playing{border-color:#ff2d7b;background:rgba(255,45,123,0.15);box-shadow:0 4px 20px rgba(255,45,123,0.25)}
.th{height:58px;background:#1a1f36;display:flex;align-items:center;justify-content:center;font-size:22px}
.bd{padding:9px}.nm{font-size:11px;font-weight:700}.sb{font-size:9px;color:#8b95b5;margin-top:2px}.ok{font-size:7.5px;font-weight:800;margin-top:4px;color:#00ff88}
#btm{position:fixed;bottom:0;left:0;right:0;background:#0e1220;border-top:1px solid #1a1f36;padding:10px 14px;display:flex;gap:10px}
.btn{flex:1;height:44px;border-radius:12px;border:none;font-weight:700;font-size:11px}.s{background:#1a1f36;color:#fff}.p{background:#fff;color:#000}
</style>
</head>
<body>
<header>
<div style="display:flex;gap:10px;align-items:center"><div class="mark">S</div><div><b>Salvation TV</b><br><small>V63 FIXED - 8 MOVIES PLAYING - GHANA WORKS</small></div></div>
<div style="font-size:9px;color:#ff2d7b;background:rgba(255,45,123,0.15);padding:6px 12px;border-radius:20px">PLAYING</div>
</header>

<div id="playerWrap">
<video id="v" controls playsinline preload="metadata" crossorigin="anonymous"></video>
<div id="status">V63 Fixed - Tap a movie below - Real video go play - No broken icon!</div>
</div>

<div id="meta">
<h2 id="title">Free Movies - 8 Different - All Playing</h2>
<p id="sub">Fixed - No more 0:00 broken icon - All 8 different movies dey play Ghana - Tap any card</p>
</div>

<div id="tabs"><button class="tab on">Free Movies - 8 Working</button></div>

<div id="content"></div>

<div id="btm"><button class="btn s" onclick="shareApp()">Share App</button><button class="btn p" onclick="location.reload()">Refresh</button></div>

<script>
const MOVIES=[
{n:"Big Buck Bunny",e:"🐰",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",d:"Comedy Animation - Big Buck Bunny - 10min - Free",badge:"MOVIE 1 - COMEDY - PLAYING"},
{n:"Sintel Trailer",e:"🐉",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",d:"Fantasy - Sintel Style - Elephants Dream - Free",badge:"MOVIE 2 - FANTASY - PLAYING"},
{n:"Tears of Steel Style",e:"🤖",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",d:"Sci-Fi Action - Blazes - Free Movie",badge:"MOVIE 3 - SCI-FI - PLAYING"},
{n:"Elephants Dream",e:"🐘",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",d:"Sci-Fi Drama - Escapes - Free Movie",badge:"MOVIE 4 - DRAMA - PLAYING"},
{n:"Subaru Adventure",e:"🚗",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",d:"Action Adventure - Fun - Free Movie",badge:"MOVIE 5 - ACTION - PLAYING"},
{n:"Joyrides Adventure",e:"🎢",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",d:"Adventure Joyrides - Free Movie",badge:"MOVIE 6 - ADVENTURE - PLAYING"},
{n:"Meltdown Action",e:"🏔️",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4",d:"Action Meltdown - Free Movie",badge:"MOVIE 7 - ACTION - PLAYING"},
{n:"Subaru On Street",e:"🏎️",u:"https://storage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4",d:"Racing - Subaru - Free Movie",badge:"MOVIE 8 - RACING - PLAYING"},
];

const v=document.getElementById('v');
const status=document.getElementById('status');
const content=document.getElementById('content');

function playMovie(c,el){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('playing'));
 el.classList.add('playing');
 document.getElementById('title').textContent=c.n;
 document.getElementById('sub').textContent=c.d;
 status.textContent='Loading '+c.n+'... Wait small...';
 window.scrollTo({top:0, behavior:'smooth'});
 v.pause();
 v.src=c.u;
 v.load();
 v.play().then(function(){
   status.textContent='Playing '+c.n+' - Real Movie - 8 Different Movies - Ghana Works!';
 }).catch(function(){
   status.textContent='Tap play button inside video for '+c.n+' - Ghana network need tap';
   v.controls=true;
 });
}

function build(){
 content.innerHTML='';
 let grid=document.createElement('div');
 grid.className='grid';
 content.appendChild(grid);
 MOVIES.forEach(function(c){
   let card=document.createElement('div');
   card.className='card';
   card.innerHTML='<div class="th">'+c.e+'</div><div class="bd"><div class="nm">'+c.n+'</div><div class="sb">'+c.d+'</div><div class="ok">'+c.badge+'</div></div>';
   (function(cCopy,cardCopy){ cardCopy.onclick=function(){ playMovie(cCopy,cardCopy); }; })(c,card);
   grid.appendChild(card);
 });
}

function shareApp(){ if(navigator.share){ navigator.share({title:'Salvation TV V63', url:location.href}); } else{ navigator.clipboard.writeText(location.href); status.textContent='Link copied!'; } }

build();
setTimeout(function(){
 let first=document.querySelector('.card');
 if(first) first.click();
},800);

v.addEventListener('error',function(){ status.textContent='Video error - Tap another movie - Ghana network'; });
</script>
</body>
</html>
