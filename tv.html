<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation TV - Hybrid Auto</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>/* same style + hybrid badges */</style>
</head>
<body>
<header><div class="logo">Salvation <span>TV</span></div><div class="badge">🇬🇭 HYBRID AUTO</div></header>
<div id="status">Auto mode: Trying LIVE first → Recorded if offline</div>
<div class="wrap" id="playerWrap"></div>
<script>
const channels=[
 {name:'TV3 Ghana', cat:'Ghana', channelId:'UC9VSDs4ZXo3sjOoPkmW2iRQ', fallbackVid:'Hqjj2MnGyQI', type:'hybrid'},
 {name:'JoyNews', cat:'Ghana', channelId:'UC0Wb...', fallbackVid:'W4yu5MA4te0', type:'hybrid'},
 {name:'UTV Ghana', cat:'Ghana', channelId:'UTV_ID', fallbackVid:'y8yPX--QSVU', type:'hybrid'},
 {name:'GTV Ghana', cat:'Ghana', fallbackVid:'_Yhyp-_p2ow', type:'hybrid'},
 {name:'Channel One / Citi TV', cat:'Ghana', fallbackVid:'MnNQkRWo8iY', type:'hybrid'},
];
function play(ch, mode='live'){
 const wrap=document.getElementById('playerWrap');
 wrap.innerHTML='';
 if(mode==='live' && ch.channelId.length>15){
   wrap.innerHTML=`<iframe src="https://www.youtube.com/embed/live_stream?channel=${ch.channelId}&autoplay=1&mute=0&playsinline=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
   // Auto fallback after 4s if LIVE unavailable
   setTimeout(()=>{
     if(ch.channelId.length<16) play(ch,'recorded'); // bad ID → recorded
   },4000);
 }else{
   wrap.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${ch.fallbackVid}?autoplay=1&mute=0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
   // Auto retry LIVE every 60s
   setTimeout(()=>play(ch,'live'),60000);
 }
}
</script>
</body>
</html>
